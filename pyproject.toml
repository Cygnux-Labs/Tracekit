[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit-ai"
dynamic = ["version"]   # single source of truth: tracekit/__init__.py
description = "Signed, checkpointed evidence of what coding agents did"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cygnux Labs" }]
keywords = ["ai-agents", "observability", "audit", "tamper-evident", "claude-code", "security", "provenance", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
]
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]   # signing; `tracekit verify` alone also works without it

[project.optional-dependencies]
yaml = ["PyYAML>=6"]   # optional: policies are parsed with a built-in YAML subset otherwise
langchain = ["langchain-core>=0.2"]   # tracekit.adapters.langchain (LangChain / LangGraph tools)
grpc = ["grpcio>=1.50"]   # `tracekit otel serve --grpc-port 4317`
dev = ["pytest>=7", "PyYAML>=6", "pyflakes", "langchain-core>=0.2; python_version>='3.10'", "langgraph>=0.2; python_version>='3.10'",
       "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20",   # only tests use these: the receiver has no deps
       "openai>=1.0", "anthropic>=0.30", "google-genai>=1.0"]   # tests for tracekit_sdk.init(); patched only when installed

[project.scripts]
tracekit = "tracekit.cli:main"

[project.urls]
Homepage = "https://github.com/Cygnux-Labs/Tracekit"
Issues = "https://github.com/Cygnux-Labs/Tracekit/issues"
Changelog = "https://github.com/Cygnux-Labs/Tracekit/blob/main/CHANGELOG.md"
Security = "https://github.com/Cygnux-Labs/Tracekit/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["tracekit", "tracekit.adapters", "tracekit.deploy"]
py-modules = ["tracekit_sdk"]

[tool.setuptools.dynamic]
version = { attr = "tracekit.__version__" }

[tool.setuptools.package-data]
tracekit = ["schema/*.json", "policy/*.yaml", "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["root: needs root; run by the CI insider job"]
