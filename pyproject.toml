[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit-ai"
dynamic = ["version"]   # single source of truth: tracekit/__init__.py
description = "Signed, checkpointed evidence of what coding agents did"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cygnux Labs" }]
keywords = ["ai-agents", "observability", "audit", "tamper-evident", "claude-code", "security", "provenance", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
]
requires-python = ">=3.9"
# signing, JCS for format v2, the v2 signer's policy engine (it uses regex when google-re2 is not importable; pip
# still builds google-re2 from source where it has no wheel); `tracekit verify` needs none of them:
# `pip install --no-deps tracekit-ai` is the verifier alone
dependencies = ["cryptography>=41", "rfc8785>=0.1,<0.2", "google-re2>=1.1; python_version>='3.10'", "regex>=2023.8"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]   # optional: policies are parsed with a built-in YAML subset otherwise
langchain = ["langchain-core>=0.2"]   # tracekit.adapters.langchain (LangChain / LangGraph tools)
grpc = ["grpcio>=1.50"]   # `tracekit otel serve --grpc-port 4317`
postgres = ["psycopg[binary]>=3.1"]   # tracekit.storage.postgres: the signer's Postgres store
aws = ["boto3>=1.34"]   # the signer's log key in AWS KMS (log_key: {aws_kms: ...})
signer = []   # now in the default dependencies; kept so `tracekit-ai[signer]` still installs
dev = ["pytest>=7", "PyYAML>=6", "pyflakes", "regex>=2023.8", "google-re2>=1.1; python_version>='3.10'",
       "hypothesis>=6.100",   # property tests of the v2 verifier (tests/test_verify_v2_property.py)
       "moto>=5",   # tests/test_signer_kms.py against moto's KMS, where it has Ed25519
       "langchain-core>=0.2; python_version>='3.10'",
       "langchain>=1.4,<1.5; python_version>='3.10'", "langgraph>=1.2,<1.3; python_version>='3.10'",   # tested minors
       "langgraph-checkpoint-sqlite>=3.1,<3.2; python_version>='3.10'",
       "openai-agents>=0.23.1,<0.24; python_version>='3.10'",   # tested minor of tracekit.integrations.openai_agents
       "claude-agent-sdk>=0.2.165,<0.3; python_version>='3.10'",   # tested minor of tracekit.integrations.claude_agent_sdk
       "mcp>=2.3,<2.4; python_version>='3.10'",   # tested minor of tracekit.integrations.mcp
       "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20",   # only tests use these: the receiver has no deps
       "openai>=1.0", "anthropic>=0.30", "google-genai>=1.0"]   # tests for tracekit_sdk.init(); patched only when installed

[project.scripts]
tracekit = "tracekit.cli:main"

[project.urls]
Homepage = "https://github.com/Cygnux-Labs/Tracekit"
Issues = "https://github.com/Cygnux-Labs/Tracekit/issues"
Changelog = "https://github.com/Cygnux-Labs/Tracekit/blob/main/CHANGELOG.md"
Security = "https://github.com/Cygnux-Labs/Tracekit/blob/main/SECURITY.md"

[tool.setuptools]
py-modules = ["tracekit_sdk"]

[tool.setuptools.packages.find]
include = ["tracekit", "tracekit.*"]   # every subpackage; new modules need no edit here

[tool.setuptools.dynamic]
version = { attr = "tracekit.__version__" }

[tool.setuptools.package-data]
tracekit = ["schema/*.json", "policy/*.yaml", "policy2/packs/*.yaml", "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["root: needs root; run by the CI insider job"]
