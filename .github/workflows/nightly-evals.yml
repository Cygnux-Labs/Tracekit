name: Nightly evals
# The slow and machine-bound evals (docs/evaluation.md): E2 and E14 in full, E9 and E16 on Postgres, E22 through all
# three verifiers, E7 at a million events. Each eval's own exit code is the gate; a failed scheduled run is shown in
# Actions and GitHub notifies the workflow's owner.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer:
    name: E2 and E14 in full (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - name: Build the TypeScript SDK (E14's TS client scenario)
        run: cd sdk/typescript && npm ci --no-audit --no-fund && npm run build
      - run: python eval/e2_perf.py
      - run: python eval/e14_outage.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-signer
          path: |
            eval/results/e2_perf.json
            eval/results/e14_outage.json

  postgres:
    name: E9 and E16 on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tk
          POSTGRES_DB: tracekit
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRACEKIT_TEST_PG_DSN: postgresql://postgres:tk@localhost:5432/tracekit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[signer,postgres]"
      - run: python eval/e9_signer_perf.py --storage postgres --dsn "$TRACEKIT_TEST_PG_DSN"
      - run: python eval/e16_doctor.py
      - name: E16 ran its Postgres cases
        run: jq -e '.postgres.cases | length > 0' eval/results/e16_doctor.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-postgres
          path: |
            eval/results/e9_signer_perf_postgres.json
            eval/results/e16_doctor.json

  verifiers:
    name: E22 verifier agreement (Python, TypeScript, browser page)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the release tags (E22 runs the released 1.2.3 and 1.3.0 signers)
        run: git fetch --no-tags --depth=1 origin "+refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # the extras of the six framework examples need 3.11 or later
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]" playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: cd sdk/typescript && npm ci --no-audit --no-fund && npm run build
      - name: Run E22 (its headed pass needs a display)
        run: xvfb-run -a python eval/e22_verifier_agreement.py
      - name: The browser page ran
        run: jq -e '[.skipped[].name] | index("page") == null' eval/results/e22_verifier_agreement.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e22
          path: eval/results/e22_verifier_agreement.json

  scale:
    name: E7 SQL index at a million events
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python contrib/query/e7_sql_scale.py --out "$RUNNER_TEMP/e7_sql_scale.json"
