name: Release
# Tag a version (git tag v0.4.0 && git push origin v0.4.0). PyPI and npm use trusted publishing: no token is stored.
# docs/RELEASING.md has the procedure and the one-time setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cygnux-labs/tracekit-signer

jobs:
  test:
    # the tagged commit itself must pass lint and the suite before anything is built
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: make lint test PY=python

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install -c scripts/release/constraints.txt build twine
      - name: Tag must match the package versions
        # the npm version is the semver form of the Python one (1.0.0rc2 -> 1.0.0-rc.2), as tests/test_version.py checks
        shell: python
        run: |
          import json, os, re, sys
          v = re.search(r'__version__ = "([^"]+)"', open("tracekit/__init__.py").read()).group(1)
          n = json.load(open("sdk/typescript/package.json"))["version"]
          m = re.fullmatch(r"(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?", v)
          npm = m and m[1] + (f"-{dict(a='alpha', b='beta').get(m[2], m[2])}.{m[3]}" if m[2] else "")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{v}" or n != npm:
              sys.exit(f"tag {tag} != package v{v} / npm {n} (expected npm {npm})")
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      # build.py sets SOURCE_DATE_EPOCH to HEAD's commit time and writes SHA256SUMS and the SBOMs
      - run: python scripts/release/build.py dist/release --image "${IMAGE}@${{ steps.image.outputs.digest }}"
      - run: python -m twine check dist/release/*.whl dist/release/*.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image and attest its SBOM (keyless, by digest)
        run: |
          ref="${IMAGE}@${{ steps.image.outputs.digest }}"
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate dist/release/tracekit-signer-image.cdx.json "$ref"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/

  wheel-check:
    # the wheel that will be published, installed in a clean venv outside the checkout: the CLI, the demo, and the
    # version and golden-corpus tests against the installed package (no tracekit/ next to the copied tests)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - run: cd release && sha256sum --check --ignore-missing SHA256SUMS
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install release/*.whl pytest
          "$RUNNER_TEMP/clean/bin/tracekit" --version
          "$RUNNER_TEMP/clean/bin/tracekit" demo
      - name: Version and golden tests against the installed wheel
        run: |
          w="$RUNNER_TEMP/wheel-tests"
          mkdir -p "$w/plugin/.claude-plugin" "$w/sdk/typescript"
          cp -r tests "$w/"
          cp plugin/.claude-plugin/plugin.json "$w/plugin/.claude-plugin/"
          cp sdk/typescript/package.json "$w/sdk/typescript/"
          cd "$w"
          "$RUNNER_TEMP/clean/bin/python" -c "import tracekit, sys; sys.exit('site-packages' not in tracekit.__file__)"
          "$RUNNER_TEMP/clean/bin/python" -m pytest -q -p no:cacheprovider tests/test_version.py tests/test_golden.py

  pypi:
    needs: [build, wheel-check]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - run: mkdir dist && cp release/*.whl release/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    # the signer packages bundle the release's own tracekit-ai wheel (checked against SHA256SUMS); they go up after
    # PyPI and before @cygnux/tracekit, which depends on them
    needs: pypi
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.0   # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - run: python scripts/build-signer-bundles.py
      - name: Pack the signer packages into the release
        run: |
          for d in build/npm/tracekit-signer-*; do npm pack "./$d" --pack-destination release/; done
          cd release && rm SHA256SUMS && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/cygnux-tracekit-signer-*.tgz
            release/SHA256SUMS
      - name: Publish (platform packages first)
        run: |
          case "${GITHUB_REF_NAME#v}" in *[a-z]*) dist=next ;; *) dist=latest ;; esac   # pre-releases never become latest
          for f in release/cygnux-tracekit-signer-*.tgz; do npm publish "$f" --provenance --access public --tag "$dist"; done
          npm publish release/cygnux-tracekit-[0-9]*.tgz --provenance --access public --tag "$dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-final
          path: release/

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final
          path: release/
      - run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
