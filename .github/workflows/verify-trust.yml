name: Verify trust action acceptance
on:
  push:
    branches: [agent/issue-393]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'kausthubhk/Tracekit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kausthubhk/Tracekit
          ref: ${{ github.sha }}

      - name: Verify v2 sample against pinned trust
        uses: kausthubhk/Tracekit@agent/issue-393
        with:
          bundle: sdk/typescript/src/verify/sample/sample.tkb
          trust: sdk/typescript/src/verify/sample/sample.trust.json

      - name: Confirm tampered v2 sample is rejected
        id: tampered
        continue-on-error: true
        uses: kausthubhk/Tracekit@agent/issue-393
        with:
          bundle: sdk/typescript/src/verify/sample/sample-tampered.tkb
          trust: sdk/typescript/src/verify/sample/sample.trust.json

      - name: Assert tampered sample failed verification
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.tampered.outcome }}
          VERIFY_JSON: ${{ steps.tampered.outputs.json }}
        shell: bash
        run: |
          test "$VERIFY_OUTCOME" = failure
          python -c 'import json, os, sys; r=json.loads(os.environ["VERIFY_JSON"]); sys.exit(not (r.get("exit_code") == 1 and bool(r.get("failures"))))'

      - name: Verify v1 sample with pinned signer key
        uses: kausthubhk/Tracekit@agent/issue-393
        with:
          bundle: docs/sample/demo-run.tkb
          key: docs/sample/signer.pub

  linux-validation:
    if: github.repository == 'kausthubhk/Tracekit'
    name: Linux validation (Python 3.12, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the release tags (tests/test_released_verifiers.py runs their verifiers)
        run: git fetch --no-tags --depth=1 origin "+refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint PY=python
      - name: Test
        run: make test PY=python
        env:
          PYTEST_ADDOPTS: -v -o faulthandler_timeout=240
      - name: Build
        if: always()
        run: make build PY=python
      - name: TypeScript tests
        if: always()
        run: make test-ts PY=python
