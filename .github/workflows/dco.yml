name: DCO
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # every non-merge commit in the pull request needs a Signed-off-by line matching its author (CONTRIBUTING.md)
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check sign-off
        # the checkout is the PR merge commit: parent 1 is the base branch, parent 2 the PR head
        run: |
          # sign-off is required for pull requests from forks only (CONTRIBUTING.md)
          if [ "$(jq -r .pull_request.head.repo.full_name "$GITHUB_EVENT_PATH")" = "$GITHUB_REPOSITORY" ]; then
            echo "Pull request from a branch of $GITHUB_REPOSITORY: sign-off not required."
            exit 0
          fi
          missing=0
          for c in $(git rev-list --no-merges HEAD^1..HEAD^2); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): missing 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s'; fix a branch with 'git rebase --signoff origin/$GITHUB_BASE_REF'. See CONTRIBUTING.md."
            exit 1
          fi
