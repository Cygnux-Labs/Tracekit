name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # a hung test must fail the job, not hold a runner for six hours
    timeout-minutes: 25
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    # Linux is the supported platform for system mode; macOS and Windows run dev mode and are
    # reported but do not block merges until their runs are green
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes tracekit tracekit_sdk.py tests eval examples
      - name: Test
        run: python -m pytest -v -o faulthandler_timeout=240

  insider:
    # 0.2.1: E8 attacks the path that feeds the ledger, as real separate OS users against a system-mode
    # signer. Merges are blocked unless E8.1-E8.5 are caught (E8.6 is tracked, closed by 0.3).
    name: E8 insider attacks (Linux system mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system mode with separate agent and attacker users
        run: |
          PY="$(which python)"
          sudo cp -r "$GITHUB_WORKSPACE" /opt/tracekit
          sudo chmod -R a+rX /opt/tracekit
          sudo useradd -m agent
          sudo useradd -m mallory
          sudo "$PY" -m pip install /opt/tracekit
          cd /tmp && sudo "$PY" -m tracekit init --user agent --no-service --no-hooks
      - name: Run E8
        run: cd /opt/tracekit && sudo "$(which python)" eval/e8_insider.py --out /tmp/e8_insider.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-insider
          path: /tmp/e8_insider.json

  typescript:
    name: TypeScript SDK and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Test the SDK (real signer, mocked model APIs)
        run: make test-ts
      - name: Run the Vercel AI SDK example
        run: |
          export TRACEKIT_CLIENT_HOME="$RUNNER_TEMP/client"
          python -c "from tracekit import install; install.init_dev('$RUNNER_TEMP/signer', [], start=True)"
          cd sdk/typescript && node examples/vercel_ai.mjs

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/tracekit --version
          /tmp/clean/bin/tracekit demo
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
