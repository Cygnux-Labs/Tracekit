name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # a hung test must fail the job, not hold a runner for six hours
    timeout-minutes: 25
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    # Linux is the supported platform for system mode; macOS and Windows run dev mode and are
    # reported but do not block merges until their runs are green
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes tracekit tracekit_sdk.py tests eval examples
      - name: Test
        run: python -m pytest -v -o faulthandler_timeout=240

  typescript:
    name: TypeScript SDK and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Test the SDK (real signer, mocked model APIs)
        run: make test-ts
      - name: Run the Vercel AI SDK example
        run: |
          export TRACEKIT_CLIENT_HOME="$RUNNER_TEMP/client"
          python -c "from tracekit import install; install.init_dev('$RUNNER_TEMP/signer', [], start=True)"
          cd sdk/typescript && node examples/vercel_ai.mjs

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/tracekit --version
          /tmp/clean/bin/tracekit demo
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
