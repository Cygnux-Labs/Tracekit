{{- $n := int (include "tc.logs" .) }}
# The front: a new run goes to any ready replica. The run's id starts with `<release>-<n>.`, and the client sends every
# later call for it to the Service of replica n (tracekit.sdk.client).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
spec:
  selector: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
  ports: [{name: https, port: 8443, targetPort: https}]
{{- range $i := until $n }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $i }}
  labels: {{- include "tc.labels" (dict "root" $ "component" "signer") | nindent 4 }}
spec:
  selector:
    {{- include "tc.labels" (dict "root" $ "component" "signer") | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-{{ $i }}
  ports: [{name: https, port: 8443, targetPort: https}, {name: metrics, port: 9464, targetPort: metrics}]
{{- end }}
