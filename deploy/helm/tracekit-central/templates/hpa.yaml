{{- if .Values.autoscaling.enabled }}
# Scaling up adds a replica, and its ordinal's log; scaling down closes the last replica's log (log.closed) for good.
# lean: an ordinal whose log is closed comes back refusing to start until it is given a new log (DSN Secret, KMS key,
# origin), so the HPA scales down only with autoscaling.scaleDown; give ordinals a log generation once it must
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: {{ .Release.Name }}}
  minReplicas: {{ .Values.replicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- if not .Values.autoscaling.scaleDown }}
  behavior: {scaleDown: {selectPolicy: Disabled}}
  {{- end }}
  metrics:
    - type: Pods
      pods:
        metric: {name: tracekit_signer_queue_depth}
        target: {type: AverageValue, averageValue: {{ .Values.autoscaling.targetQueueDepth | quote }}}
{{- end }}
