apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-signer
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
# TokenReview of the agents' service-account tokens
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-signer, namespace: {{ .Release.Namespace }}}
  {{- if .Values.issuer.enabled }}
  - {kind: ServiceAccount, name: {{ .Release.Name }}-issuer, namespace: {{ .Release.Namespace }}}
  {{- end }}
---
# The preStop scale-down check reads the StatefulSet's replicas
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-signer
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
rules:
  - {apiGroups: [apps], resources: [statefulsets], resourceNames: [{{ .Release.Name }}], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-signer
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-signer}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-signer, namespace: {{ .Release.Namespace }}}
