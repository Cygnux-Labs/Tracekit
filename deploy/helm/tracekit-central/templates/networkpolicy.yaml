# Agents reach the signers' HTTPS port from anywhere; the metrics port (with the monitor: every tenant's records) only
# from the monitoring namespace and the monitor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-signer
  labels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tc.labels" (dict "root" . "component" "signer") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8443, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}}}
        - podSelector:
            matchLabels: {{- include "tc.labels" (dict "root" . "component" "monitor") | nindent 14 }}
      ports: [{port: 9464, protocol: TCP}]
