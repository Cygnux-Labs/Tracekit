# Values of the tracekit-central chart: a StatefulSet of signers, each replica the single writer of its own log.
# docs/deploy-kubernetes.md.

signer:
  # The signer image (deploy/docker/Dockerfile). Pin it by digest: the image is the signer's code trust.
  image: ghcr.io/cygnux-labs/tracekit-signer:v1.5.0
  uid: 10001
  durability: ack-on-fsync
  # More signer.yaml keys (tenants, authorize, approvals, witnesses, record_key, ...: tracekit/signer/service.py).
  # The chart sets data_dir, durability, route, origin, http, storage, log_key, metrics, policy and content (below),
  # and they win.
  config: {}
  # The content vault (docs/privacy.md): off. retain: true keeps each record's redacted content, encrypted under
  # keys/content.key in the signer's data volume, for retention_days. On a store made before 1.1, run
  # `tracekit signer migrate` on each schema first (docs/deploy.md#upgrading): the signers refuse to start without it.
  content: {retain: false, retention_days: 30, max_record_bytes: 1048576}
  # The signers' policy file (docs/policy-v2.md), mounted at /etc/tracekit/policy.yaml. The default runs the image's
  # server pack (/etc/tracekit/packs/server.yaml); replace it with your own, which may extend packs/server.yaml.
  policy: |
    extends: packs/server.yaml
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  # Seconds a stopping pod has: a scaled-down replica closes its log and waits up to 60 s for the witnesses.
  terminationGracePeriodSeconds: 120
  # Each replica's keys (record key, salts): a ReadWriteOnce volume per replica, kept when it scales down.
  storage:
    storageClass: ""
    size: 1Gi

# Replicas, each with its own log; with autoscaling, the HPA moves between replicas and autoscaling.maxReplicas.
replicas: 2
autoscaling:
  enabled: false
  maxReplicas: 4
  # Let the HPA scale down too. Each scale-down closes the last replica's log for good: that ordinal starts again only
  # with a new log of its own (docs/deploy-kubernetes.md).
  scaleDown: false
  # tracekit_signer_queue_depth, averaged over the replicas, through prometheus-adapter (docs/deploy-kubernetes.md)
  targetQueueDepth: 50

# Each replica's log. Replica n (0, 1, ...) writes the log whose:
# - origin is `<origin>/<n>`; empty: <release>.<namespace>/log/<n>
# - Postgres DSN is the `dsn` key of Secret `<postgres.dsnSecretPrefix>-<n>`, its search_path the log's schema
#   (migrated beforehand; the role holds tracekit.storage.postgres.GRANTS)
# - log key is awsKms.keyIds[n] (empty: the file key in the replica's volume)
origin: ""
postgres:
  dsnSecretPrefix: tracekit-log
awsKms:
  region: ""
  keyIds: []

# The HTTPS listener: a kubernetes.io/tls Secret whose certificate names <release>.<namespace>.svc and
# <release>-<n>.<namespace>.svc for every replica (clients route a run's calls to its replica by its run id).
tls:
  secretName: ""
# The audience agents' projected service-account tokens are minted for; the signer checks them by TokenReview.
audience: tracekit-signer

# The signers' service account. Workload identity for the KMS log keys goes here only (e.g.
# eks.amazonaws.com/role-arn): the agent pods, the viewer and the monitor never get it.
serviceAccount:
  annotations: {}

# Who reaches the metrics port (9464: Prometheus, and the record entries the monitor reads).
networkPolicy:
  monitoringNamespace: monitoring

# The record-key issuer (tracekit issuer serve, docs/issuer.md); point the signers' record_key at it in signer.config.
issuer:
  enabled: false
  config: {}               # issuer.yaml without data_dir and http (name, origin, witnesses, identities, ca_key, ...)
  tlsSecretName: ""
  serviceAccount:
    annotations: {}        # workload identity for a KMS ca_key / log_key of the issuer
  storage:
    storageClass: ""
    size: 1Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

# A read-only viewer of every log (tracekit view, docs/viewer.md) on port 7778. Its DSNs come from Secrets
# `<dsnSecretPrefix>-<n>` (key `dsn`) of a role holding tracekit.storage.postgres.READ_GRANTS only.
viewer:
  enabled: false
  config: {}               # more of viewer.yaml: view.oidc and the http section of its issuers (docs/identity.md)
  dsnSecretPrefix: tracekit-log-read
  tokenSecretName: ""      # Secret with key `token`: the viewer's login token
  tlsSecretName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The custody services: each holds credentials the agents never get, from `secretName` (mounted at
# /etc/tracekit/secrets in its own pod only), serves the agents on HTTPS with `k8s_sa` (tokens of audience
# `<audience>-<name>`, such as tracekit-signer-executor, never the signers' `audience`; tlsSecretName: a
# kubernetes.io/tls Secret naming <release>-<name>.<namespace>.svc) and records for their runs as the signer `gateways`
# identity k8s_sa:system:serviceaccount:<namespace>:<release>-<name>: list it in signer.config `gateways` and grant it
# its methods in `authorize` (docs/deploy-kubernetes.md#custody). They reach the signers with tls.secretName's ca.crt.
# The LLM gateway (docs/gateway.md), on 8080: config is its gateway.yaml without http, signer and api_key_file
# (upstream, api_key_header, max_body); secretName holds the provider key as `api_key`.
gateway:
  enabled: false
  config: {}
  secretName: ""
  tlsSecretName: ""
  image: ""                # default signer.image
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
# The tool executor (docs/executor.md), on 8090: config is its executor.yaml without http and signer (actions,
# approval_wait_s, max_body); the actions' headers name files under /etc/tracekit/secrets/ (secretName's keys).
executor:
  enabled: false
  config: {}
  secretName: ""
  tlsSecretName: ""
  image: ""
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
# The MCP gateway (docs/mcp-gateway.md), on 8091: config is its mcp-gateway.yaml without http and signer (upstreams,
# trusted, ...); upstream env and headers name files under /etc/tracekit/secrets/. A stdio upstream runs in its pod:
# give it an `image` that has the upstream's command.
mcpGateway:
  enabled: false
  config: {}
  secretName: ""
  tlsSecretName: ""
  image: ""
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# The egress observer (docs/egress.md), on 3128: a CONNECT proxy for the agents' outside traffic, which records each
# run's hosts as the signer identity k8s_sa:system:serviceaccount:<namespace>:<release>-egress: grant it
# observe_effect in signer.config `authorize`. config is its egress.yaml without http and signer (allow). It takes
# a run token per request: agents set TRACEKIT_EGRESS_PROXY=https://<release>-egress.<namespace>.svc:3128 with
# NO_PROXY=.svc,.cluster.local and give each run's commands and HTTP clients the SDKs' run.proxy_env; a plain
# HTTPS_PROXY without a run token is refused (407). No secretName: it holds none.
egress:
  enabled: false
  config: {}
  tlsSecretName: ""
  image: ""
  replicas: 1   # one: the signer reads a second process of the observer as a restart (observer_lost in each run)
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}

# An egress NetworkPolicy for the agent pods (podSelector, in `namespace`): they reach only the signers, the custody
# services above that are enabled (the egress observer among them), the egress proxy and DNS. Off: agents reach
# anything. Needs a CNI that enforces egress policies (docs/deploy-kubernetes.md#custody).
agentEgress:
  enabled: false
  namespace: ""            # where the agent pods run; default the release's
  podSelector: {}          # the agent pods' labels
  egressProxy:             # the egress proxy (its pod labels, namespace and port), if one is deployed
    podSelector: {}
    namespace: ""
    port: 3128

# tracekit monitor of each log; logKeys[n] is replica n's log vkey (`tracekit signer vkey`). Turns on the metrics
# port's record entries (serve_records), which only the monitor and networkPolicy.monitoringNamespace reach.
monitor:
  enabled: false
  logKeys: []
  everySeconds: 60
  storage:
    storageClass: ""
    size: 1Gi
  resources:               # each log's monitor container
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
