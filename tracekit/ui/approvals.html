<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracekit approvals</title>
<style>
body { font: 14px system-ui, sans-serif; margin: 2em; max-width: 64em; }
table { border-collapse: collapse; }
th, td { padding: .3em .6em; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
pre { background: #f4f4f4; padding: 1em; white-space: pre-wrap; overflow-wrap: anywhere; }
dt { font-weight: bold; } dd { margin: 0 0 .4em 0; overflow-wrap: anywhere; }
.error { color: #b00020; }
.nav a { margin-right: 1em; } .nav a.on { font-weight: bold; }
</style>
</head>
<body>
<!--__NAV__-->
<h1>Approvals</h1>
<p id="who"></p>
<p><button id="register">Register a passkey</button></p>
<p class="error" id="error"></p>
<p><label>Show <select id="filter"><option value="">all</option><option value="person">for people</option>
<option value="agent">with an agent approver</option><option value="escalated">escalated to people</option></select></label></p>
<table>
<thead><tr><th>Approval</th><th>State</th><th>Tool</th><th>Arguments</th><th>Rules</th><th>Run</th><th>Expires</th><th>Answered by</th></tr></thead>
<tbody id="list"></tbody>
</table>
<section id="detail" hidden>
<h2 id="title"></h2>
<dl id="facts"></dl>
<h3>Arguments (the signer's copy)</h3>
<pre id="args"></pre>
<p id="answer"><label>Reason <input id="reason" maxlength="1024" size="60"></label></p>
<p><button id="approve">Approve</button> <button id="reject">Reject</button>
<button id="revoke" hidden>Revoke the agent's approval</button></p>
<p id="answered" hidden></p>
</section>
<script>
"use strict";
// every value is set with textContent, never parsed as markup; every invisible character (controls, format
// characters such as bidi overrides and TAG characters, line and paragraph separators, and default-ignorable
// ones such as variation selectors and Hangul fillers) is shown escaped, but for one U+FE0E or U+FE0F right after an
// pictographic character (Extended_Pictographic: its text or emoji style; never a digit, # or *)
const vis = s => String(s).replace(/(?![\t\n\r]|(?<=\p{Extended_Pictographic})[\uFE0E\uFE0F](?![\uFE00-\uFE0F\u{E0100}-\u{E01EF}]))[\p{Cc}\p{Cf}\p{Zl}\p{Zp}\p{Default_Ignorable_Code_Point}]/gu,
  c => "\\u" + (c.codePointAt(0) > 0xffff ? "{" + c.codePointAt(0).toString(16) + "}" : c.codePointAt(0).toString(16).padStart(4, "0")));
const $ = id => document.getElementById(id);
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
let session = null, current = null;
const REFRESH_MS = 5000;   // the list (and the approval shown) refresh on their own: another approver may answer first
const argsOf = new Map();   // approval id -> its arguments in one line, read once (the list carries none)

// "in 12 min", "3 min ago": when an approval expires, from this browser's clock
function relative(ts) {
  const s = Math.round((Date.parse(ts) - Date.now()) / 1000), a = Math.abs(s);
  const t = a < 90 ? a + " s" : a < 5400 ? Math.round(a / 60) + " min" : Math.round(a / 3600) + " h";
  return isNaN(s) ? ts : s >= 0 ? "in " + t : t + " ago";
}

// a call's arguments in one line: each field's value, shortened
function brief(args, source) {
  if (args === null || args === undefined) return "";
  const text = source === "raw" || typeof args !== "object" ? String(args)
    : Object.entries(args).map(([k, v]) => k + ": " + (typeof v === "string" ? v : JSON.stringify(v))).join(" · ");
  return text.length > 90 ? text.slice(0, 89) + "…" : text;
}

// the run's page on this viewer: its live terminal, else its run pages
function runLink(id) {
  const page = document.querySelector('.nav a[href="/"]') ? "/" : document.querySelector('.nav a[href="/runs"]') ? "/runs" : null;
  if (!page) return document.createTextNode(vis(id));
  const a = document.createElement("a");
  a.href = page + "#run=" + encodeURIComponent(id);
  a.textContent = vis(id);
  return a;
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json", "X-CSRF-Token": session.csrf}});
  const out = await r.json();
  if (!r.ok) throw new Error(out.error || String(r.status));
  return out;
}

function fail(e) { $("error").textContent = vis(e.message || e); }
// an agent's answer is model output; an agent may answer only within the policy's bounds, people answer the rest
const answeredBy = a => !a.answered ? "" : a.answered.kind === "agent" ? "agent " + a.answered.by + " (model output)"
  : a.answered.by;
// a.agent: an agent approver's answer can still decide it; people answer every other one
const kinds = {person: a => !a.agent, agent: a => a.agent, escalated: a => a.escalated};

async function list() {
  const page = await api("/api/approvals"), rows = $("list"), keep = kinds[$("filter").value] || (() => true);
  rows.replaceChildren();
  const shown = page.approvals.filter(keep);
  for (const a of shown) {
    const row = rows.insertRow(), open = document.createElement("button");
    open.textContent = vis(a.approval_id);
    open.addEventListener("click", () => show(a.approval_id).catch(fail));
    row.insertCell().append(open);
    for (const v of [a.state + (a.escalated ? " (escalated)" : a.agent ? " (agent approver)" : ""),
      a.tool + (a.passkey ? " (passkey)" : ""), argsOf.get(a.approval_id) ?? "", a.rule_ids.join(", ")])
      row.insertCell().textContent = vis(v);
    row.insertCell().append(runLink(a.run_id));
    const exp = row.insertCell();
    exp.textContent = vis(relative(a.expires_at));
    exp.title = vis(a.expires_at);
    row.insertCell().textContent = vis(answeredBy(a));
  }
  // the arguments of each approval still waiting, read once each
  for (const a of shown.filter(a => a.state === "requested" && !argsOf.has(a.approval_id))) {
    argsOf.set(a.approval_id, "…");
    api("/api/approvals/" + encodeURIComponent(a.approval_id)).then(x => {
      argsOf.set(a.approval_id, brief(x.args, x.args_source));
      return list();
    }).catch(() => argsOf.set(a.approval_id, ""));
  }
}

async function show(id) {
  const next = await api("/api/approvals/" + encodeURIComponent(id));
  if (!current || current.approval_id !== next.approval_id) $("reason").value = "";   // a reason is for one approval
  current = next;
  $("title").textContent = vis(current.approval_id + " (" + current.state + ")");
  const facts = [["tool", current.tool], ["rules", current.rule_ids.join(", ")], ["run", current.run_id],
    ["call", current.tool_call_id + " attempt " + current.attempt], ["requester", current.requester],
    ["expires", current.expires_at], ["binding", current.binding_digest],
    ["passkey", current.passkey ? "required to approve" : "not required"]];
  if ("reason" in current) facts.push(["reason given by the agent (unverified)", current.reason]);
  if (current.answered) facts.push(["answered by", answeredBy(current)]);
  if (current.escalation) facts.push(["escalated by " + current.escalation.by, (current.escalation.reason || "")
    + (current.escalation.by === "agent" ? " (model output, over arguments the requesting agent supplied)" : "")]);
  $("facts").replaceChildren(...facts.flatMap(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k;
    dd.textContent = vis(v);
    return [dt, dd];
  }));
  $("args").textContent = vis(current.args === null ? "(deleted: the approval is no longer live)"
    : current.args_source === "raw" ? current.args : JSON.stringify(current.args, null, 2));
  // only a waiting approval can be answered; an agent's approval can be revoked until it is used
  const open = current.state === "requested", revocable = current.state === "approved" && current.answered?.kind === "agent";
  $("approve").hidden = $("reject").hidden = !open;
  $("revoke").hidden = !revocable;
  $("answer").hidden = !(open || revocable);
  $("answered").hidden = open || revocable;
  $("answered").textContent = vis("This approval is " + current.state + (current.answered ? ", answered by " + answeredBy(current) : "")
    + ": there is nothing to answer.");
  $("detail").hidden = false;
}

async function decide(decision) {
  const body = decision === "revoke" ? {} : {decision}, reason = $("reason").value;
  if (reason) body.reason = reason;
  if (decision === "revoke") {
    const out = await api("/api/approvals/" + encodeURIComponent(current.approval_id) + "/revoke", body);
    $("error").textContent = "";
    await show(out.approval_id);
    return list();
  }
  if (decision === "approve" && current.passkey) {
    const cred = await navigator.credentials.get({publicKey: {challenge: unb64u(current.challenge),
      rpId: session.rp_id, userVerification: "required", timeout: 120000}});
    body.passkey = {credential_id: b64u(cred.rawId), client_data_json: b64u(cred.response.clientDataJSON),
      authenticator_data: b64u(cred.response.authenticatorData), signature: b64u(cred.response.signature)};
  }
  const out = await api("/api/approvals/" + encodeURIComponent(current.approval_id), body);
  $("error").textContent = "";
  await show(out.approval_id);
  await list();
}

async function register() {
  const user = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(session.person));
  const cred = await navigator.credentials.create({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: {id: session.rp_id, name: "Tracekit"}, user: {id: user, name: session.person, displayName: session.person},
    pubKeyCredParams: [{type: "public-key", alg: -7}, {type: "public-key", alg: -8}],
    authenticatorSelection: {residentKey: "required", userVerification: "required"}}});
  await api("/api/passkey", {credential_id: b64u(cred.rawId), public_key: b64u(cred.response.getPublicKey())});
  $("error").textContent = "";
  $("who").textContent = vis("Signed in as " + session.person + "; passkey registered");
}

$("approve").addEventListener("click", () => decide("approve").catch(fail));
$("reject").addEventListener("click", () => decide("reject").catch(fail));
$("revoke").addEventListener("click", () => decide("revoke").catch(fail));
$("filter").addEventListener("change", () => list().catch(fail));
$("register").addEventListener("click", () => register().catch(fail));
api("/api/session").then(s => {
  session = s;
  $("who").textContent = vis("Signed in as " + s.person);
  $("register").hidden = !s.rp_id;
  setInterval(() => {
    list().catch(fail);
    if (current && document.activeElement !== $("reason")) show(current.approval_id).catch(fail);
  }, REFRESH_MS);
  return list();
}).catch(fail);
</script>
</body>
</html>
