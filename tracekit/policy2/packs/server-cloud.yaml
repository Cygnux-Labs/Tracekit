# Server cloud pack (policy v2): cloud CLIs (aws, gcloud, gsutil, az, kubectl, terraform, pulumi, helm, doctl) and
# cloud tools reached over MCP. Composed by server.yaml.
#
# The rules have no class. On a shell tool they match each command the line runs (argv, with wrappers and paths
# resolved); on any other tool, the call as sorted-key JSON, where a CLI line counts only as the value of a
# `cli_command` (`cliCommand`), `command` or `cmd` argument (the AWS API MCP server's call_aws takes `cli_command`). A
# web search for the same words is not a command. In that value, as TK-A036 reads one, any run of spaces or of escaped
# tabs, newlines or returns separates words (before the program too), and a scan for a later word ends with the value,
# so many values each rescan only their own text; aws reads a long option's unique prefix (--rec is --recursive).

version: '2026.10-server-cloud-12'
description: server-hosted agents, cloud CLIs and cloud MCP tools
unknown_tools: ask

deny:
  - id: TK-C001
    # an access key only when turned back on (--status Active); a snapshot only when shared with `all` (an EC2 one
    # with --operation-type add), so making one private isn't held
    # lean: those options are read within eight or sixteen words of each other and of the command, so the fallback
    # engine stays linear; widen the bounds if a longer command shows up
    pattern: '(?:(?:^aws (?:.*? )?(iam (attach-(user|role|group)-policy|put-(user|role|group)-policy|create-(user|role|access-key|login-profile|policy-version)|add-user-to-group|update-assume-role-policy|update-login-profile|set-default-policy-version|put-(user|role)-permissions-boundary|update-access-key ([^ ]+ ){0,8}?--status[ =]Active|create-service-specific-credential|(create|update)-saml-provider|create-open-id-connect-provider|update-open-id-connect-provider-thumbprint|add-client-id-to-open-id-connect-provider)|s3api put-bucket-(policy|acl)|s3api put-public-access-block|organizations (attach-policy|create-account|invite-account-to-organization)|sso-admin (create-account-assignment|attach-[a-z-]+)|kms (put-key-policy|create-grant)|lambda add-permission|ec2 modify-image-attribute|ecr set-repository-policy|secretsmanager put-resource-policy|(sns|sqs) add-permission|ec2 modify-snapshot-attribute ([^ ]+ ){0,16}?(--operation-type[ =]add ([^ ]+ ){0,16}?--group-names[ =]all|--group-names[ =]all ([^ ]+ ){0,16}?--operation-type[ =]add|--create-volume-permission[ =]Add=[^ ]*Group=all)|rds modify-db(-cluster)?-snapshot-attribute ([^ ]+ ){0,16}?--values-to-add[ =]([^ -][^ ]* ){0,16}?[^ ]*\ball)|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?aws(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?(iam(?: |\\[tnr])+?(attach-(user|role|group)-policy|put-(user|role|group)-policy|create-(user|role|access-key|login-profile|policy-version)|add-user-to-group|update-assume-role-policy|update-login-profile|set-default-policy-version|put-(user|role)-permissions-boundary|update-access-key(?: |\\[tnr])+?((?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?){0,8}?--status(?:=|(?: |\\[tnr])+?)Active|create-service-specific-credential|(create|update)-saml-provider|create-open-id-connect-provider|update-open-id-connect-provider-thumbprint|add-client-id-to-open-id-connect-provider)|s3api(?: |\\[tnr])+?put-bucket-(policy|acl)|s3api(?: |\\[tnr])+?put-public-access-block|organizations(?: |\\[tnr])+?(attach-policy|create-account|invite-account-to-organization)|sso-admin(?: |\\[tnr])+?(create-account-assignment|attach-[a-z-]+)|kms(?: |\\[tnr])+?(put-key-policy|create-grant)|lambda(?: |\\[tnr])+?add-permission|ec2(?: |\\[tnr])+?modify-image-attribute|ecr(?: |\\[tnr])+?set-repository-policy|secretsmanager(?: |\\[tnr])+?put-resource-policy|(sns|sqs)(?: |\\[tnr])+?add-permission|ec2(?: |\\[tnr])+?modify-snapshot-attribute(?: |\\[tnr])+?((?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?){0,16}?(--operation-type(?:=|(?: |\\[tnr])+?)add(?: |\\[tnr])+?((?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?){0,16}?--group-names(?:=|(?: |\\[tnr])+?)all|--group-names(?:=|(?: |\\[tnr])+?)all(?: |\\[tnr])+?((?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?){0,16}?--operation-type(?:=|(?: |\\[tnr])+?)add|--create-volume-permission(?:=|(?: |\\[tnr])+?)Add=(?:[^ "\\]|\\[^tnr])*?Group=all)|rds(?: |\\[tnr])+?modify-db(-cluster)?-snapshot-attribute(?: |\\[tnr])+?((?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?){0,16}?--values-to-add(?:=|(?: |\\[tnr])+?)((?:[^ "\\-]|\\[^tnr])(?:[^ "\\]|\\[^tnr])*(?: |\\[tnr])+?){0,16}?(?:[^ "\\]|\\[^tnr])*?\ball))|(?:^gcloud (?:.*? )?((projects|organizations|folders|iam service-accounts|storage buckets) (add-iam-policy-binding|set-iam-policy)|iam service-accounts keys create|iam roles (create|update))|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?gcloud(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?((projects|organizations|folders|iam(?: |\\[tnr])+?service-accounts|storage(?: |\\[tnr])+?buckets)(?: |\\[tnr])+?(add-iam-policy-binding|set-iam-policy)|iam(?: |\\[tnr])+?service-accounts(?: |\\[tnr])+?keys(?: |\\[tnr])+?create|iam(?: |\\[tnr])+?roles(?: |\\[tnr])+?(create|update)))|(?:^gsutil (?:.*? )?(iam (ch|set)|acl (ch|set))|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?gsutil(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?(iam(?: |\\[tnr])+?(ch|set)|acl(?: |\\[tnr])+?(ch|set)))|(?:^az (?:.*? )?(role (assignment|definition) create|ad (sp create-for-rbac|sp credential reset|app credential reset|user create|group member add))|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?az(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?(role(?: |\\[tnr])+?(assignment|definition)(?: |\\[tnr])+?create|ad(?: |\\[tnr])+?(sp(?: |\\[tnr])+?create-for-rbac|sp(?: |\\[tnr])+?credential(?: |\\[tnr])+?reset|app(?: |\\[tnr])+?credential(?: |\\[tnr])+?reset|user(?: |\\[tnr])+?create|group(?: |\\[tnr])+?member(?: |\\[tnr])+?add)))|(?:^kubectl (?:.*? )?create (clusterrolebinding|rolebinding|clusterrole|token)|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?kubectl(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?create(?: |\\[tnr])+?(clusterrolebinding|rolebinding|clusterrole|token)))\b'
    reason: changing cloud identity or access
    rationale: IAM policies, role bindings, access keys and public bucket policies decide who can reach every other resource; an agent must not grant access, least of all to itself.
  - id: TK-C002
    # over MCP as TK-C011 names it; in the `__` forms the word follows a `_` or `-`, so one `.*` per branch keeps the
    # fallback engine linear on a name of underscores. The words in any case, in snake_case, kebab-case, camelCase or
    # PascalCase (AttachUserPolicy, setIamPolicy, attach-user-policy, create_cluster_role_binding): a word between
    # them starts after a `_` or `-` or with a capital, so attachment_policy isn't attach…policy. A grant names what
    # it grants (role, permission, access, privilege, iam, admin, owner), so grant_reviewers_list isn't one; a version
    # suffix may follow (create_access_key_v2)
    tool: 'mcp(:[^/]+/.*|__.*[_-])([Aa][Tt][Tt][Aa][Cc][Hh](([_-]|[A-Z])[A-Za-z_-]*)?[_-]?[Pp][Oo][Ll][Ii][Cc][Yy]|[Pp][Uu][Tt](([_-]|[A-Z])[A-Za-z_-]*)?[_-]?[Pp][Oo][Ll][Ii][Cc][Yy]|[Ii][Aa][Mm][_-]?[Pp][Oo][Ll][Ii][Cc][Yy][_-]?[Bb][Ii][Nn][Dd][Ii][Nn][Gg]|[Ss][Ee][Tt][_-]?[Ii][Aa][Mm][_-]?[Pp][Oo][Ll][Ii][Cc][Yy]|[Cc][Rr][Ee][Aa][Tt][Ee][_-]?[Aa][Cc][Cc][Ee][Ss][Ss][_-]?[Kk][Ee][Yy]|[Cc][Rr][Ee][Aa][Tt][Ee][_-]?[Ss][Ee][Rr][Vv][Ii][Cc][Ee][_-]?[Aa][Cc][Cc][Oo][Uu][Nn][Tt][_-]?[Kk][Ee][Yy]|[Rr][Oo][Ll][Ee][_-]?[Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt]|[Cc][Rr][Ee][Aa][Tt][Ee](([_-]|[A-Z])[A-Za-z_-]*)?[_-]?[Rr][Oo][Ll][Ee][_-]?[Bb][Ii][Nn][Dd][Ii][Nn][Gg]|[Gg][Rr][Aa][Nn][Tt]((([_-]|[A-Z])[A-Za-z_-]*)?[_-]?([Rr][Oo][Ll][Ee]|[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]|[Aa][Cc][Cc][Ee][Ss][Ss]|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]|[Ii][Aa][Mm]|[Aa][Dd][Mm][Ii][Nn]|[Oo][Ww][Nn][Ee][Rr])[A-Za-z_-]*)?)([_-][Vv][0-9]+)?'
    pattern: '^'
    reason: changing cloud identity or access through an MCP tool
    rationale: The MCP twin of TK-C001.

ask:
  - id: TK-C010
    # terraform, tofu and pulumi on a shell tool are the coding pack's TK-A001; here only as another tool's argument,
    # read as TK-A001 reads them, each scan stopping at the end of its value
    # kubectl reads a resource type in any case, by its short name, with its API group and as TYPE/NAME, with up to eight
    # options before it and any after it, also as one of a list (pod,ns) or a later TYPE/NAME (pod/a ns/b, within
    # sixteen words); -f, -k, -l, -n, -o, -s and -v (and --filename, --kustomize) take the next word as their value,
    # so a file a delete reads (-f ns.yaml, -k deploy) isn't a type. Its own alternative: an option after the type
    # ends no word for the `\b` the others end with. helm uninstall is also del or un, with up to eight options
    # before it
    # aws also holds the commands that switch off audit recording or detection (cloudtrail, guardduty, config,
    # securityhub, access analyzer); the CLI names the services configservice and accessanalyzer, and guardduty's
    # master account command is the older name of its administrator account one
    pattern: '(?:(?:^aws (?:.*? )?(ec2 (terminate-instances|delete-[a-z-]+)|rds delete-db-[a-z-]+|s3 rb|s3 rm (?:.*? )?--rec(u(r(s(i(v(e)?)?)?)?)?)?|s3api delete-(bucket|objects)|dynamodb delete-table|lambda delete-function|cloudformation delete-stack|(eks|ecs|elasticache|backup) delete-[a-z-]+|redshift delete-[a-z-]+|(docdb|neptune) delete-db-[a-z-]+|(opensearch|es) delete-[a-z-]*domain|cognito-idp delete-user-pool|rds delete-global-cluster|organizations close-account|iam delete-[a-z-]+|kms (schedule-key-deletion|disable-key)|route53 delete-hosted-zone|logs delete-log-group|ecr delete-repository|secretsmanager delete-secret|sqs delete-queue|sns delete-topic|efs delete-file-system|cloudtrail (stop-logging|delete-trail|put-event-selectors)|guardduty (delete-detector|disassociate-from-(master|administrator)-account)|config(service)? (stop|delete)-configuration-recorder|securityhub disable-security-hub|access-?analyzer delete-analyzer)|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?aws(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?(ec2(?: |\\[tnr])+?(terminate-instances|delete-[a-z-]+)|rds(?: |\\[tnr])+?delete-db-[a-z-]+|s3(?: |\\[tnr])+?rb|s3(?: |\\[tnr])+?rm(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?--rec(u(r(s(i(v(e)?)?)?)?)?)?|s3api(?: |\\[tnr])+?delete-(bucket|objects)|dynamodb(?: |\\[tnr])+?delete-table|lambda(?: |\\[tnr])+?delete-function|cloudformation(?: |\\[tnr])+?delete-stack|(eks|ecs|elasticache|backup)(?: |\\[tnr])+?delete-[a-z-]+|redshift(?: |\\[tnr])+?delete-[a-z-]+|(docdb|neptune)(?: |\\[tnr])+?delete-db-[a-z-]+|(opensearch|es)(?: |\\[tnr])+?delete-[a-z-]*domain|cognito-idp(?: |\\[tnr])+?delete-user-pool|rds(?: |\\[tnr])+?delete-global-cluster|organizations(?: |\\[tnr])+?close-account|iam(?: |\\[tnr])+?delete-[a-z-]+|kms(?: |\\[tnr])+?(schedule-key-deletion|disable-key)|route53(?: |\\[tnr])+?delete-hosted-zone|logs(?: |\\[tnr])+?delete-log-group|ecr(?: |\\[tnr])+?delete-repository|secretsmanager(?: |\\[tnr])+?delete-secret|sqs(?: |\\[tnr])+?delete-queue|sns(?: |\\[tnr])+?delete-topic|efs(?: |\\[tnr])+?delete-file-system|cloudtrail(?: |\\[tnr])+?(stop-logging|delete-trail|put-event-selectors)|guardduty(?: |\\[tnr])+?(delete-detector|disassociate-from-(master|administrator)-account)|config(service)?(?: |\\[tnr])+?(stop|delete)-configuration-recorder|securityhub(?: |\\[tnr])+?disable-security-hub|access-?analyzer(?: |\\[tnr])+?delete-analyzer))|(?:^gcloud (?:.*? )?(delete|storage rm)|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?gcloud(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?(delete|storage(?: |\\[tnr])+?rm))|(?:^gsutil (?:.*? )?(rb|rm -[A-Za-z]*r)|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?gsutil(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?(rb|rm(?: |\\[tnr])+?-[A-Za-z]*r))|(?:^az (?:.*? )?delete|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?az(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?delete)|(?:^helm (-[^ ]+ +([^- ][^ ]* +)?){0,8}|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?helm(?: |\\[tnr])+?(-(?:[^ \\]|\\[^tnr])+(?: |\\[tnr])+?((?:[^- \\]|\\[^tnr])(?:[^ \\]|\\[^tnr])*(?: |\\[tnr])+?)?){0,8})(uninstall|delete|del|un)|(?:^doctl (?:.*? )?delete|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?doctl(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?delete))\b|(?:^kubectl (?:.*? )?|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?kubectl(?: |\\[tnr])(?:(?:[^"\\]|\\.)*?(?: |\\[tnr]))?)delete ((?:-[^ ]+ +[^- ][^ ]* +|(?:-[^- =]*(?:[^- =fklnosv]|=[^ ]*)|--(?:[^ =]*=[^ ]*|(?:[^ =fk][^ =]*|f(?:[^ =i][^ =]*|i(?:[^ =l][^ =]*|l(?:[^ =e][^ =]*|e(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?|k(?:[^ =u][^ =]*|u(?:[^ =s][^ =]*|s(?:[^ =t][^ =]*|t(?:[^ =o][^ =]*|o(?:[^ =m][^ =]*|m(?:[^ =i][^ =]*|i(?:[^ =z][^ =]*|z(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)?)) +){0,8}(?:[^- ,/][^ ,/]*,){0,8}([Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]|[Nn][Ss]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee][Cc][Ll][Aa][Ii][Mm]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee]|[Pp][Vv][Cc]|[Pp][Vv]|[Ss][Tt][Aa][Tt][Ee][Ff][Uu][Ll][Ss][Ee][Tt]|[Ss][Tt][Ss]|[Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt]|[Dd][Ee][Pp][Ll][Oo][Yy]|[Cc][Uu][Ss][Tt][Oo][Mm][Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn]|[Cc][Rr][Dd]|[Nn][Oo][Dd][Ee]|[Nn][Oo])[Ss]?(\.[A-Za-z0-9.-]+)?( |$|/|,)|(?:(?:-[^- =]*[fk]|--(?:filename|kustomize)) +[^ ]* +|(?:[^- ][^ ]*|-(?:[^- =]*(?:[^- =fk]|=[^ ]*))?|--(?:[^ =]*=[^ ]*|(?:[^ =fk][^ =]*|f(?:[^ =i][^ =]*|i(?:[^ =l][^ =]*|l(?:[^ =e][^ =]*|e(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?|k(?:[^ =u][^ =]*|u(?:[^ =s][^ =]*|s(?:[^ =t][^ =]*|t(?:[^ =o][^ =]*|o(?:[^ =m][^ =]*|m(?:[^ =i][^ =]*|i(?:[^ =z][^ =]*|z(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)?)) +){0,16}([Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]|[Nn][Ss]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee][Cc][Ll][Aa][Ii][Mm]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee]|[Pp][Vv][Cc]|[Pp][Vv]|[Ss][Tt][Aa][Tt][Ee][Ff][Uu][Ll][Ss][Ee][Tt]|[Ss][Tt][Ss]|[Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt]|[Dd][Ee][Pp][Ll][Oo][Yy]|[Cc][Uu][Ss][Tt][Oo][Mm][Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn]|[Cc][Rr][Dd]|[Nn][Oo][Dd][Ee]|[Nn][Oo])[Ss]?(\.[A-Za-z0-9.-]+)?/|(.*? )?--all\b)|"(?:cli[_-]?[Cc]ommand|command|cmd)":"(?: |\\[tnr])*?((terraform|tofu)(?: |\\[tnr])+?(-(?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?){0,4}(destroy|apply(?: |\\[tnr])((?:[^"\\]|\\.)*(?: |\\[tnr]))?--?destroy)|pulumi(?: |\\[tnr])+?(-(?:[^ "\\]|\\[^tnr])+(?: |\\[tnr])+?((?:[^- "\\]|\\[^tnr])(?:[^ "\\]|\\[^tnr])*(?: |\\[tnr])+?)?)*(destroy|down|dn))([ ="]|\\[tnr])'
    reason: deleting cloud resources, or turning off audit logging and threat detection
    rationale: Deleting instances, databases, buckets, clusters or whole stacks is the kind of step a person confirms, and so is switching off the audit trail or threat detection that would record what comes next; reading and creating are allowed.
  - id: TK-C011
    # as `mcp:<server>/<tool>`, `mcp__<server>__<tool>` or Crush's joined `mcp__<server>_<tool>` (whose server and
    # tool can't be told apart: the word counts after a `_` or `-`, never as the name's first word), in snake_case,
    # kebab-case (delete-file), camelCase or PascalCase (deleteProject, DeleteBucket, bulkDelete). Also wipe, truncate
    # alone or of a table or collection (not truncate_text), a reset of a branch, database, schema, data, project or
    # table (not reset_password) and migrate-reset, each of which drops data. One `.*` per branch, as TK-A037
    tool: 'mcp(:[^/]+/(.*[_-])?|__.*[_-])(([Dd]elete|[Dd]estroy|[Tt]erminate|[Dd]rop|[Pp]urge|[Rr]emove|[Ww]ipe)([_A-Z-].*)?|[Tt]runcate([_-]?([Tt]ables?|[Cc]ollections?)([_A-Z-].*)?)?|[Rr]eset[_-]?([Bb]ranch|[Dd]atabase|[Dd]b|[Ss]chema|[Dd]ata|[Pp]roject|[Tt]ables?)([_A-Z-].*)?|[Mm]igrate[_-]?[Rr]eset([_A-Z-].*)?)|mcp(:[^/]+/|__.*[_-])[^_/-]*[a-z0-9]((Delete|Destroy|Terminate|Drop|Purge|Remove|Wipe)([_A-Z-].*)?|Truncate([_-]?([Tt]ables?|[Cc]ollections?)([_A-Z-].*)?)?|Reset[_-]?([Bb]ranch|[Dd]atabase|[Dd]b|[Ss]chema|[Dd]ata|[Pp]roject|[Tt]ables?)([_A-Z-].*)?|Migrate[_-]?[Rr]eset([_A-Z-].*)?)'
    pattern: '^'
    reason: deleting through an MCP tool
    rationale: The MCP twin of TK-C010, for any tool whose name says it deletes.
