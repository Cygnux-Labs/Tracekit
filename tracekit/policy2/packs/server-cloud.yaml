# Server cloud pack (policy v2): cloud CLIs (aws, gcloud, gsutil, az, kubectl, terraform, pulumi, helm, doctl) and
# cloud tools reached over MCP. Composed by server.yaml.
#
# The rules have no class. On a shell tool they match each command the line runs (argv, with wrappers and paths
# resolved); on any other tool, the call as sorted-key JSON, where a CLI line counts only as the value of a
# `cli_command`, `command` or `cmd` argument (the AWS API MCP server's call_aws takes `cli_command`). A web search for
# the same words is not a command.

version: '2026.10-server-cloud-10'
description: server-hosted agents, cloud CLIs and cloud MCP tools
unknown_tools: ask

deny:
  - id: TK-C001
    # an access key only when turned back on (--status Active); a snapshot only when shared with `all` (an EC2 one
    # with --operation-type add), so making one private isn't held
    # lean: those options are read within eight or sixteen words of each other and of the command, so the fallback
    # engine stays linear; widen the bounds if a longer command shows up
    pattern: '(^|"(cli_command|command|cmd)":")(aws (.*? )?(iam (attach-(user|role|group)-policy|put-(user|role|group)-policy|create-(user|role|access-key|login-profile|policy-version)|add-user-to-group|update-assume-role-policy|update-login-profile|set-default-policy-version|put-(user|role)-permissions-boundary|update-access-key ([^ ]+ ){0,8}?--status[ =]Active|create-service-specific-credential|(create|update)-saml-provider|create-open-id-connect-provider|update-open-id-connect-provider-thumbprint|add-client-id-to-open-id-connect-provider)|s3api put-bucket-(policy|acl)|s3api put-public-access-block|organizations (attach-policy|create-account|invite-account-to-organization)|sso-admin (create-account-assignment|attach-[a-z-]+)|kms (put-key-policy|create-grant)|lambda add-permission|ec2 modify-image-attribute|ecr set-repository-policy|secretsmanager put-resource-policy|(sns|sqs) add-permission|ec2 modify-snapshot-attribute ([^ ]+ ){0,16}?(--operation-type[ =]add ([^ ]+ ){0,16}?--group-names[ =]all|--group-names[ =]all ([^ ]+ ){0,16}?--operation-type[ =]add|--create-volume-permission[ =]Add=[^ ]*Group=all)|rds modify-db(-cluster)?-snapshot-attribute ([^ ]+ ){0,16}?--values-to-add[ =]([^ -][^ ]* ){0,16}?[^ ]*\ball)|gcloud (.*? )?((projects|organizations|folders|iam service-accounts|storage buckets) (add-iam-policy-binding|set-iam-policy)|iam service-accounts keys create|iam roles (create|update))|gsutil (.*? )?(iam (ch|set)|acl (ch|set))|az (.*? )?(role (assignment|definition) create|ad (sp create-for-rbac|sp credential reset|app credential reset|user create|group member add))|kubectl (.*? )?create (clusterrolebinding|rolebinding|clusterrole|token))\b'
    reason: changing cloud identity or access
    rationale: IAM policies, role bindings, access keys and public bucket policies decide who can reach every other resource; an agent must not grant access, least of all to itself.
  - id: TK-C002
    # over MCP as TK-C011 names it; in the `__` forms the word follows a `_` or `-`, so one `.*` per branch keeps the
    # fallback engine linear on a name of underscores. The words in any case, in snake_case, kebab-case, camelCase or
    # PascalCase (AttachUserPolicy, setIamPolicy, attach-user-policy, create_cluster_role_binding): a word between
    # them starts after a `_` or `-` or with a capital, so attachment_policy isn't attach…policy. A grant names what
    # it grants (role, permission, access, privilege, iam, admin, owner), so grant_reviewers_list isn't one; a version
    # suffix may follow (create_access_key_v2)
    tool: 'mcp(:[^/]+/.*|__.*[_-])([Aa][Tt][Tt][Aa][Cc][Hh](([_-]|[A-Z])[A-Za-z_-]*)?[_-]?[Pp][Oo][Ll][Ii][Cc][Yy]|[Pp][Uu][Tt](([_-]|[A-Z])[A-Za-z_-]*)?[_-]?[Pp][Oo][Ll][Ii][Cc][Yy]|[Ii][Aa][Mm][_-]?[Pp][Oo][Ll][Ii][Cc][Yy][_-]?[Bb][Ii][Nn][Dd][Ii][Nn][Gg]|[Ss][Ee][Tt][_-]?[Ii][Aa][Mm][_-]?[Pp][Oo][Ll][Ii][Cc][Yy]|[Cc][Rr][Ee][Aa][Tt][Ee][_-]?[Aa][Cc][Cc][Ee][Ss][Ss][_-]?[Kk][Ee][Yy]|[Cc][Rr][Ee][Aa][Tt][Ee][_-]?[Ss][Ee][Rr][Vv][Ii][Cc][Ee][_-]?[Aa][Cc][Cc][Oo][Uu][Nn][Tt][_-]?[Kk][Ee][Yy]|[Rr][Oo][Ll][Ee][_-]?[Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt]|[Cc][Rr][Ee][Aa][Tt][Ee](([_-]|[A-Z])[A-Za-z_-]*)?[_-]?[Rr][Oo][Ll][Ee][_-]?[Bb][Ii][Nn][Dd][Ii][Nn][Gg]|[Gg][Rr][Aa][Nn][Tt]((([_-]|[A-Z])[A-Za-z_-]*)?[_-]?([Rr][Oo][Ll][Ee]|[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]|[Aa][Cc][Cc][Ee][Ss][Ss]|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]|[Ii][Aa][Mm]|[Aa][Dd][Mm][Ii][Nn]|[Oo][Ww][Nn][Ee][Rr])[A-Za-z_-]*)?)([_-][Vv][0-9]+)?'
    pattern: '^'
    reason: changing cloud identity or access through an MCP tool
    rationale: The MCP twin of TK-C001.

ask:
  - id: TK-C010
    # terraform, tofu and pulumi on a shell tool are the coding pack's TK-A001; here only as another tool's argument,
    # read as TK-A001 reads them, each scan stopping at the end of its value
    # kubectl reads a resource type in any case, by its short name, with its API group and as TYPE/NAME, with up to eight
    # options before it and any after it, also as one of a list (pod,ns) or a later TYPE/NAME (pod/a ns/b, within
    # sixteen words); -f, -k, -l, -n, -o, -s and -v (and --filename, --kustomize) take the next word as their value,
    # so a file a delete reads (-f ns.yaml, -k deploy) isn't a type. Its own alternative: an option after the type
    # ends no word for the `\b` the others end with. helm uninstall is also del or un, with up to eight options
    # before it
    # aws also holds the commands that switch off audit recording or detection (cloudtrail, guardduty, config,
    # securityhub, access analyzer); the CLI names the services configservice and accessanalyzer, and guardduty's
    # master account command is the older name of its administrator account one
    pattern: '(^|"(cli_command|command|cmd)":")(aws (.*? )?(ec2 (terminate-instances|delete-[a-z-]+)|rds delete-db-[a-z-]+|s3 rb|s3 rm (.*? )?--recursive|s3api delete-(bucket|objects)|dynamodb delete-table|lambda delete-function|cloudformation delete-stack|(eks|ecs|elasticache|backup) delete-[a-z-]+|iam delete-[a-z-]+|kms (schedule-key-deletion|disable-key)|route53 delete-hosted-zone|logs delete-log-group|ecr delete-repository|secretsmanager delete-secret|sqs delete-queue|sns delete-topic|efs delete-file-system|cloudtrail (stop-logging|delete-trail|put-event-selectors)|guardduty (delete-detector|disassociate-from-(master|administrator)-account)|config(service)? (stop|delete)-configuration-recorder|securityhub disable-security-hub|access-?analyzer delete-analyzer)|gcloud (.*? )?(delete|storage rm)|gsutil (.*? )?(rb|rm -[A-Za-z]*r)|az (.*? )?delete|helm (-[^ ]+ +([^- ][^ ]* +)?){0,8}(uninstall|delete|del|un)|doctl (.*? )?delete)\b|(^|"(cli_command|command|cmd)":")kubectl (.*? )?delete ((?:-[^ ]+ +[^- ][^ ]* +|(?:-[^- =]*(?:[^- =fklnosv]|=[^ ]*)|--(?:[^ =]*=[^ ]*|(?:[^ =fk][^ =]*|f(?:[^ =i][^ =]*|i(?:[^ =l][^ =]*|l(?:[^ =e][^ =]*|e(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?|k(?:[^ =u][^ =]*|u(?:[^ =s][^ =]*|s(?:[^ =t][^ =]*|t(?:[^ =o][^ =]*|o(?:[^ =m][^ =]*|m(?:[^ =i][^ =]*|i(?:[^ =z][^ =]*|z(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)?)) +){0,8}(?:[^- ,/][^ ,/]*,){0,8}([Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]|[Nn][Ss]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee][Cc][Ll][Aa][Ii][Mm]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee]|[Pp][Vv][Cc]|[Pp][Vv]|[Ss][Tt][Aa][Tt][Ee][Ff][Uu][Ll][Ss][Ee][Tt]|[Ss][Tt][Ss]|[Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt]|[Dd][Ee][Pp][Ll][Oo][Yy]|[Cc][Uu][Ss][Tt][Oo][Mm][Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn]|[Cc][Rr][Dd]|[Nn][Oo][Dd][Ee]|[Nn][Oo])[Ss]?(\.[A-Za-z0-9.-]+)?( |$|/|,)|(?:(?:-[^- =]*[fk]|--(?:filename|kustomize)) +[^ ]* +|(?:[^- ][^ ]*|-(?:[^- =]*(?:[^- =fk]|=[^ ]*))?|--(?:[^ =]*=[^ ]*|(?:[^ =fk][^ =]*|f(?:[^ =i][^ =]*|i(?:[^ =l][^ =]*|l(?:[^ =e][^ =]*|e(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?|k(?:[^ =u][^ =]*|u(?:[^ =s][^ =]*|s(?:[^ =t][^ =]*|t(?:[^ =o][^ =]*|o(?:[^ =m][^ =]*|m(?:[^ =i][^ =]*|i(?:[^ =z][^ =]*|z(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)?)) +){0,16}([Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]|[Nn][Ss]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee][Cc][Ll][Aa][Ii][Mm]|[Pp][Ee][Rr][Ss][Ii][Ss][Tt][Ee][Nn][Tt][Vv][Oo][Ll][Uu][Mm][Ee]|[Pp][Vv][Cc]|[Pp][Vv]|[Ss][Tt][Aa][Tt][Ee][Ff][Uu][Ll][Ss][Ee][Tt]|[Ss][Tt][Ss]|[Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt]|[Dd][Ee][Pp][Ll][Oo][Yy]|[Cc][Uu][Ss][Tt][Oo][Mm][Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn]|[Cc][Rr][Dd]|[Nn][Oo][Dd][Ee]|[Nn][Oo])[Ss]?(\.[A-Za-z0-9.-]+)?/|(.*? )?--all\b)|"(cli_command|command|cmd)":"((terraform|tofu) (-[^ "]+ ){0,4}(destroy|apply (([^"\\]|\\.)* )?--?destroy)|pulumi (-[^ "]+ ([^- "][^ "]* )?)*(destroy|down|dn))[ ="]'
    reason: deleting cloud resources, or turning off audit logging and threat detection
    rationale: Deleting instances, databases, buckets, clusters or whole stacks is the kind of step a person confirms, and so is switching off the audit trail or threat detection that would record what comes next; reading and creating are allowed.
  - id: TK-C011
    # as `mcp:<server>/<tool>`, `mcp__<server>__<tool>` or Crush's joined `mcp__<server>_<tool>` (whose server and
    # tool can't be told apart: the word counts after a `_` or `-`, never as the name's first word), in snake_case,
    # kebab-case (delete-file), camelCase or PascalCase (deleteProject, DeleteBucket, bulkDelete). Also wipe, truncate
    # alone or of a table or collection (not truncate_text), a reset of a branch, database, schema, data, project or
    # table (not reset_password) and migrate-reset, each of which drops data. One `.*` per branch, as TK-A037
    tool: 'mcp(:[^/]+/(.*[_-])?|__.*[_-])(([Dd]elete|[Dd]estroy|[Tt]erminate|[Dd]rop|[Pp]urge|[Rr]emove|[Ww]ipe)([_A-Z-].*)?|[Tt]runcate([_-]?([Tt]ables?|[Cc]ollections?)([_A-Z-].*)?)?|[Rr]eset[_-]?([Bb]ranch|[Dd]atabase|[Dd]b|[Ss]chema|[Dd]ata|[Pp]roject|[Tt]ables?)([_A-Z-].*)?|[Mm]igrate[_-]?[Rr]eset([_A-Z-].*)?)|mcp(:[^/]+/|__.*[_-])[^_/-]*[a-z0-9]((Delete|Destroy|Terminate|Drop|Purge|Remove|Wipe)([_A-Z-].*)?|Truncate([_-]?([Tt]ables?|[Cc]ollections?)([_A-Z-].*)?)?|Reset[_-]?([Bb]ranch|[Dd]atabase|[Dd]b|[Ss]chema|[Dd]ata|[Pp]roject|[Tt]ables?)([_A-Z-].*)?|Migrate[_-]?[Rr]eset([_A-Z-].*)?)'
    pattern: '^'
    reason: deleting through an MCP tool
    rationale: The MCP twin of TK-C010, for any tool whose name says it deletes.
