# Server pack (policy v2): everything a server-hosted agent needs, composed from the coding, browser and server-*
# packs, and server-core.yaml's rules that apply to every tool. A tool the policy does not map waits for a person
# (ask), and detection runs in shadow (below). The laptop default, dev.yaml, composes the same packs without either.
#
# A deployment extends this pack, maps its own tool names under `tools` (a business tool no class fits to `app`: known,
# so not held as unknown; rules reach it by `tool`), and redefines a rule by id to change it (the egress allowlist
# TK-N002, for one). docs/policy-v2.md lists every rule.

extends: [coding.yaml, browser.yaml, server-data.yaml, server-net.yaml, server-cloud.yaml, server-comms.yaml,
          server-core.yaml]
version: '2026.11-server-17'
description: server-hosted agents (coding, browser and server packs; unmapped tools ask)
unknown_tools: ask

# untrusted content: web pages and HTTP responses, browser pages and MCP tools' results (the packs above add WebFetch
# and WebSearch). The packs map no tool that reads mail, tickets or documents; a deployment lists its own (read_inbox,
# get_ticket, ...). SQL results stay trusted: the deployment's own data.
untrusted: [http, browser, mcp]

# Detection (signer/detect.py), all in shadow: incidents are recorded, nothing is held. The labels come from
# coding.yaml: secrets_access (TK-F005), destructive (TK-F003), egress (TK-F012 a URL, TK-F013 a network command).
# Thresholds: docs/policy-v2.md#choosing-thresholds.
sequences:
  - id: TK-Q001
    # a secret read, then egress (a URL or a network command), within ten minutes of the same session (subagents
    # included, via parent_run); one command that does both counts as both.
    # Notify only: data that leaves through a host untrusted content named is TK-P003's (provenance)
    steps: [secrets_access, egress]
    scope: session
    window: 600

limits:
  - id: TK-L001
    # a runaway loop: more calls in one minute of a session than an agent makes working
    match: '*'
    count: true
    max: 300
    window: 60
    scope: session
  - id: TK-L002
    # a delete burst: rm, mv, chmod, dd, truncate and the like
    match: destructive
    count: true
    max: 30
    window: 60
    scope: session

respond:
  - {trigger: TK-Q001, mode: shadow, action: notify}
  # a call that ran after a deny or an unapproved ask: it never counts as a step, so it is recorded on its own
  - {trigger: executed_against_policy, mode: shadow, action: notify}
  - {trigger: TK-L001, mode: shadow, action: hold}
  - {trigger: TK-L002, mode: shadow, action: hold}
  # a host an egress observer saw a run reach that no http or model call nor explains entry covers (docs/egress.md):
  # notify only until the deployment's explains list is tuned
  - {trigger: unexplained_effect, mode: shadow, action: notify}
