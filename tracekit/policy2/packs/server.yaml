# Server pack (policy v2): everything a server-hosted agent needs, composed from the coding, browser and server-*
# packs, plus the rules that apply to every tool. A tool the policy does not map waits for a person (ask).
#
# A deployment extends this pack, maps its own tool names under `tools`, and redefines a rule by id to change it (the
# egress allowlist TK-N002, for one). docs/policy-v2.md lists every rule.

extends: [coding.yaml, browser.yaml, server-data.yaml, server-net.yaml, server-cloud.yaml, server-comms.yaml]
version: '2026.10-server-2'
description: server-hosted agents (coding, browser and server packs; unmapped tools ask)
unknown_tools: ask

tools:
  bash: shell                  # Anthropic bash tool

deny:
  - id: TK-S001
    # AWS, Azure, GCP, Oracle and DigitalOcean (169.254.169.254, also in decimal, hex and octal), AWS IPv6, ECS task
    # credentials, Alibaba
    pattern: '169\.254\.169\.254|169\.254\.170\.2|\b2852039166\b|\b0[Xx][Aa]9[Ff][Ee][Aa]9[Ff][Ee]\b|\b0251\.0376\.0251\.0376\b|\[?[Ff][Dd]00:[Ee][Cc]2::254\b|[Mm][Ee][Tt][Aa][Dd][Aa][Tt][Aa]\.[Gg][Oo][Oo][Gg][Ll][Ee]\.[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll]|100\.100\.100\.200'
    reason: cloud metadata service
    rationale: The metadata service hands out the server's own cloud credentials; no tool call of an agent has a reason to reach it.
  - id: TK-S002
    # private keys and the token formats of AWS, GitHub, GitLab, Slack, Stripe, Anthropic, OpenAI, Google, npm, JWTs,
    # and URLs with a password in them
    pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----|\b(AKIA|ASIA)[0-9A-Z]{16}\b|\bgh[pousr]_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{22,}|\bglpat-[A-Za-z0-9_-]{20}|\bxox[abprs]-[A-Za-z0-9-]{10,}|\b[rs]k_live_[A-Za-z0-9]{16,}|\bsk-ant-[A-Za-z0-9_-]{20,}|\bsk-(proj|svcacct|admin)-[A-Za-z0-9_-]{20,}|\bAIza[0-9A-Za-z_-]{35}|\bnpm_[A-Za-z0-9]{36}\b|\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|\b[A-Za-z][A-Za-z0-9+.-]*://[^/\s:@"]*:[^/\s@"]+@'
    reason: a secret in the arguments
    rationale: A credential in a tool call is on its way somewhere it should not be, and lands in the evidence log too; tools should get their credentials from the deployment, not from the model.
  - id: TK-S003
    class: shell
    field: line
    pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----|\b(AKIA|ASIA)[0-9A-Z]{16}\b|\bgh[pousr]_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{22,}|\bglpat-[A-Za-z0-9_-]{20}|\bxox[abprs]-[A-Za-z0-9-]{10,}|\b[rs]k_live_[A-Za-z0-9]{16,}|\bsk-ant-[A-Za-z0-9_-]{20,}|\bsk-(proj|svcacct|admin)-[A-Za-z0-9_-]{20,}|\bAIza[0-9A-Za-z_-]{35}|\bnpm_[A-Za-z0-9]{36}\b|\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|\b[A-Za-z][A-Za-z0-9+.-]*://[^/\s:@"]*:[^/\s@"]+@'
    reason: a secret in a shell command
    rationale: TK-S002 for the whole command line, where a secret can sit in a VAR= prefix, a redirection or a heredoc.
  - id: TK-S004
    # on a shell tool each command's argv, elsewhere the whole call (a file path, an MCP argument)
    pattern: '\.aws/credentials|\.kube/config\b|\.docker/config\.json|\.config/gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db|legacy_credentials)|\.azure/(accessTokens\.json|msal_token_cache)|/var/run/secrets/|/run/secrets/|\.pgpass\b|\.netrc\b|\.git-credentials\b|\.vault-token\b|/etc/shadow\b|\.ssh/id_[a-z0-9]+($|[^.a-z0-9_])|/proc/(self|[0-9]+)/environ\b'
    reason: reading or touching a credentials file
    rationale: Cloud, cluster, registry and database credentials and the service account token on a server are the keys to everything else; the agent's tools get access through the deployment, not these files.
  - id: TK-S005
    class: shell
    field: line
    pattern: '\.aws/credentials|\.kube/config\b|\.docker/config\.json|\.config/gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db|legacy_credentials)|\.azure/(accessTokens\.json|msal_token_cache)|/var/run/secrets/|/run/secrets/|\.pgpass\b|\.netrc\b|\.git-credentials\b|\.vault-token\b|/etc/shadow\b|\.ssh/id_[a-z0-9]+($|[^.a-z0-9_])|/proc/(self|[0-9]+)/environ\b'
    reason: a credentials file in a shell command
    rationale: TK-S004 for the whole command line, where the file can be a redirection (< ~/.aws/credentials).
  - id: TK-S006
    class: shell
    # options that make a non-shell command run another command
    pattern: '^tar .*(--to-command|--checkpoint-action=exec|--use-compress-program|-I )|^git .*(-c [^ ]*\.(sshcommand|sshCommand|pager|editor|fsmonitor|hooksPath|askpass|askPass)=|--upload-pack|--receive-pack|--exec=|ext::)|^ssh .*(ProxyCommand|LocalCommand|PermitLocalCommand)|^scp .*-S |^zip .*(-TT|--unzip-command)|^rsync .*--rsync-path|^(vim?|nvim|less|man) .*(-c ?!|\+!)'
    reason: running a command through another command's options
    rationale: tar, git, ssh, zip and rsync options that run a program are a way to run what the shell rules would stop.

ask:
  - id: TK-S010
    class: mcp
    pattern: '"(command|cmd|script|shell_command)":["\[]'
    reason: a command through an MCP tool
    rationale: An MCP tool that takes a command (exec in a pod or container, a remote shell) runs it outside the shell rules; a person checks it.
