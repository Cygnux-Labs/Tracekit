# Browser pack (policy v2): Browser Use actions, as tracekit.integrations.browser_use records them
# (`browser_use:<action>`, with the URL of the page the action ran on as `page_url`). Rules stay tripwires.
#
# To allow a host TK-B002 or TK-B003 denies, or to set the domains typing is allowed on (TK-B011), extend this pack and redefine
# the rule with the same id: a rule in the extending file replaces the parent's.

version: '2026.10-browser-3'
description: browser agents (Browser Use)
unknown_tools: ask

tools:
  'browser_use:*': browser

# a page's content is untrusted
untrusted: [browser]

deny:
  - id: TK-B001
    class: browser
    field: scheme
    # the scheme as the browser reads it (controls, tabs and newlines dropped, view-source: and blob: peeled)
    pattern: '^file$'
    reason: local file navigation
    rationale: A file:// page shows the agent's own disk to the model, and from there to any site it visits.
  - id: TK-B002
    class: browser
    field: internal
    # loopback, private, link-local (cloud metadata), unspecified and other non-global addresses in any notation, as
    # TK-N001 reads them
    pattern: '^true$'
    reason: internal network navigation
    rationale: A browser on a server reaches what the server reaches; internal services and cloud metadata are not the web.
  - id: TK-B003
    class: browser
    field: host
    pattern: '^(localhost|[^.:\[]+|kubernetes\.default|.*\.(localhost|internal|local|lan|corp|intranet|svc|home\.arpa))\.?$'
    reason: internal name navigation
    rationale: The name twin of TK-B002 (TK-N003 for the browser).

ask:
  - id: TK-B010
    tool: '^browser_use:upload_file$'
    pattern: '^'
    reason: file upload
    rationale: An upload sends a local file to a site; a person checks which file and where.
  - id: TK-B011
    tool: '^browser_use:input$'
    field: page_url
    pattern: '^'
    # the allowlist: replace example.com with the domains the agent may type into without asking
    unless: '^https://([A-Za-z0-9.-]*\.)?example\.com\.?(:[0-9]+)?([/?#]|$)'
    reason: typing on a site outside the allowlist
    rationale: Typed text (credentials, personal data, messages) is what a browser agent can leak or send.
  - id: TK-P003
    # data sent (a method other than GET or HEAD, a body, or typing and uploads in a browser) to a host that only
    # untrusted content (`untrusted` tools' results, observed untrusted input) brought into the run
    field: sends_to
    pattern: '.'
    from: untrusted
    reason: sending data to a host that came from untrusted content
    rationale: A host the agent read in a page, a mail or a ticket, and in nothing the caller observed as trusted (the task), is where injected instructions send data; a person checks it.
