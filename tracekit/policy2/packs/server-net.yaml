# Server network pack (policy v2): HTTP tools. Composed by server.yaml.
#
# The egress allowlist is example.com in TK-N002: a deployment extends this pack and redefines TK-N002 with its own
# hosts (a rule in the extending file replaces the parent's). Cloud metadata addresses are denied for every tool by
# TK-S001 in server.yaml.

version: '2026.10-server-net-3'
description: server-hosted agents, HTTP egress
unknown_tools: ask

tools:
  http_request: http
  http_get: http
  http_post: http
  requests_get: http          # LangChain RequestsToolkit
  requests_post: http
  requests_put: http
  requests_patch: http
  requests_delete: http
  fetch: http
  web_fetch: http
  'mcp:fetch/fetch': http     # MCP reference fetch server

# web content is untrusted
untrusted: [http]

deny:
  - id: TK-N001
    class: http
    field: internal
    # the signer's reading of the host (classes.url_info): a loopback, private, link-local, shared (CGNAT), reserved,
    # multicast or unspecified address in any notation (decimal, hex, octal, IPv6, IPv4 inside IPv6), a host that looks
    # like an address and is none, or a URL that a browser and Python's urllib read as different hosts
    pattern: '^true$'
    reason: request to an internal address
    rationale: A server-hosted agent reaches what its server reaches; internal services, admin ports and cloud metadata are not part of the web it was given.
  - id: TK-N003
    class: http
    field: host
    # internal names: localhost, a name without a dot (resolved through the server's search domains, as metadata is),
    # and internal suffixes; the host is canonical (lowercase, fullwidth letters folded, no port)
    pattern: '^(localhost|[^.:\[]+|kubernetes\.default|.*\.(localhost|internal|local|lan|corp|intranet|svc|home\.arpa))\.?$'
    reason: request to an internal name
    rationale: The name twin of TK-N001; a deployment that calls an internal service by name redefines this rule with an unless.
  - id: TK-N002
    class: http
    # a body or a body-carrying method, to a URL outside the allowlist. The subject is the whole call as sorted-key
    # JSON: `url` must be its last key, so an allowlisted URL nested in the body exempts nothing
    pattern: '"method":"([Pp][Oo][Ss][Tt]|[Pp][Uu][Tt]|[Pp][Aa][Tt][Cc][Hh])"|"(body|data|json|files|form|content)":'
    # the allowlist: replace example.com with the hosts the agent may send data to
    unless: '"url":"https://([A-Za-z0-9.-]*\.)?example\.com\.?(:[0-9]+)?([/?#][^"\\]*)?"}$'
    reason: sending data to a host outside the allowlist
    rationale: A request with a body is how data leaves; a server agent sends data only to the hosts its deployment names.

ask:
  - id: TK-P003
    # data sent (a method other than GET or HEAD, a body, or typing and uploads in a browser) to a host that only
    # untrusted content (`untrusted` tools' results, observed untrusted input) brought into the run
    field: sends_to
    pattern: '.'
    from: untrusted
    reason: sending data to a host that came from untrusted content
    rationale: A host the agent read in a page, a mail or a ticket, and in nothing the task or a trusted tool gave it, is where injected instructions send data; a person checks it.
