# Strict pack (policy v2): server.yaml with no new patterns, only stricter tiers. Rules named here are redefined by
# id with the coding pack's own patterns, moved from flag to ask; `on_parse_error: deny` denies a shell command the
# parser can't read (TK-SHELL-PARSE) instead of holding it. Two flags stay flags: TK-F007 (background processes)
# matches `crontab -l`, which only lists, and TK-F012 (any URL a call acts on) would hold every web request and
# navigation (a fifth of E17's benign calls). Expect more holds than the server pack:
# docs/evaluation.md#e21-policy-robustness gives the false-positive rate measured on E17's and E21's benign calls.

extends: server.yaml
version: '2026.11-strict-11'
description: server-hosted agents where installs, pushes, network commands, uploads and environment changes wait for a person
on_parse_error: deny

ask:
  - id: TK-F004
    class: shell
    field: line
    pattern: '\b((?:git|hub)\s+(-[Cc] [^ ]* |--(git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(=[^ ]*)? ){0,8}(push|send-pack|reset\s+--hard|clean)|(npm|pnpm|yarn|bun)\s+(publish|install|i|ci|add)|pip[0-9.]*\s+install|uv\s+(add|sync|publish|tool\s+install)|pipx\s+(install|inject)|poetry\s+(add|install|publish)|(conda|mamba)\s+install|cargo\s+(install|add|publish)|gem\s+(install|push)|bundle\s+(install|add)|go\s+(install|get)|brew\s+install|(apt|apt-get|dnf|yum)\s+install|apk\s+add|twine\s+upload|(docker|podman)(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+((container\s+)?run|(image\s+)?push)|(terraform|tofu)\s+apply|pulumi\s+up|helm(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(install|upgrade|push)|kubectl(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(apply|delete))\b'
    label: side_effect
    reason: a push, publish, install or apply
    remedy: Have a person approve the held call; the strict profile holds every change that leaves the workspace.
  - id: TK-F011
    class: shell
    field: command
    pattern: '\b(export\s+)?(PATH|LD_PRELOAD|LD_LIBRARY_PATH|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH|BASH_ENV|ENV|PROMPT_COMMAND|PYTHONPATH|PYTHONSTARTUP|NODE_OPTIONS|GIT_SSH_COMMAND)\+?=|\bunset\s+(ANTHROPIC_([A-Z]+_)?BASE_URL|HTTPS?_PROXY)\b|(>>?|\btee(\s+-[^\s]+){0,8}\s)\s*~?/?[^\s>]*?\.(bashrc|profile|zshrc|zprofile|zshenv|zlogin|bash_profile|bash_login)\b'
    label: env_tamper
    reason: changing the environment the next commands run in
    remedy: Have a person approve the held call, or pass the setting to the one command that needs it.
  - id: TK-F013
    class: shell
    pattern: '^(curl|wget|ssh|scp|sftp|rsync|nc|ncat|netcat|socat|telnet|ftp|dig|nslookup|host|http|https|xh|xhs|aria2c)( |$)|^openssl s_client( |$)'
    label: egress
    reason: a network command
    remedy: Have a person approve the held call, or work from files already in the workspace.
  - id: TK-F024
    tool: LibraryUpload
    pattern: '^'
    label: egress
    reason: an upload tool sending a file off the machine
    remedy: Have a person approve the held call, or keep the file in the workspace.
