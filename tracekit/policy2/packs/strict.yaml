# Strict pack (policy v2): server.yaml with no new patterns, only stricter tiers. Rules named here are redefined by
# id with the coding pack's own patterns, moved from flag to ask; `on_parse_error: deny` denies a shell command the
# parser can't read (TK-SHELL-PARSE) instead of holding it. Two flags stay flags: TK-F007 (background processes)
# matches `crontab -l`, which only lists, and TK-F012 (any URL a call acts on) would hold every web request and
# navigation (a fifth of E17's benign calls). TK-F006 keeps the coding pack's earlier, wider flag (every MCP call),
# and TK-F003, TK-F005 and TK-F012 keep theirs through server.yaml (every destructive word on a line, every
# secrets-file name, every URL), where the laptop packs narrowed them. Expect more holds than the server pack:
# docs/evaluation.md#e21-policy-robustness gives the false-positive rate measured on E17's and E21's benign calls.

extends: server.yaml
version: '2026.11-strict-19'
description: server-hosted agents where installs, pushes, network commands, uploads and environment changes wait for a person
on_parse_error: deny

ask:
  - id: TK-F004
    class: shell
    field: line
    pattern: '\b((?:git|hub)\s+(-[Cc] [^ ]* |--(git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(=[^ ]*)? ){0,8}(push|send-pack|reset\s+--hard|clean)|npm(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(publish|install|i|ci|add|pu(b(l(is?)?)?)?)|(pnpm|yarn|bun)(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(publish|install|i|ci|add)|(uv|poetry|cargo)(\s+-[^\s]+(\s+[^-\s][^\s]*)?){1,8}?\s+publish|pip[0-9.]*\s+install|uv(\s+--(cache-dir|python-preference|python-fetch|color|allow-insecure-host|trusted-host|directory|project|config-file|preview-features?)\s+[^\s]+|\s+-[^\s]+){0,8}?\s+(add|sync|publish|(tool|pip)(\s+--(cache-dir|python-preference|python-fetch|color|allow-insecure-host|trusted-host|directory|project|config-file|preview-features?)\s+[^\s]+|\s+-[^\s]+){0,8}?\s+install)|pipx\s+(install|inject)|poetry\s+(add|install|publish)|(conda|mamba)\s+install|cargo\s+(install|add|publish)|gem\s+(install|push)|bundle\s+(install|add)|go\s+(install|get)|brew\s+install|(apt|apt-get|dnf|yum)\s+install|apk\s+add|twine\s+upload|(docker|podman)(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+((container\s+)?run|(image\s+)?push)|(terraform|tofu)\s+apply|pulumi\s+up|helm(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(install|upgrade|push)|(kubectl|oc)(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(apply|delete))\b'
    label: side_effect
    reason: a push, publish, install or apply
    remedy: Have a person approve the held call; the strict profile holds every change that leaves the workspace.
  - id: TK-F011
    class: shell
    field: command
    pattern: '\b(export\s+)?(PATH|LD_PRELOAD|LD_LIBRARY_PATH|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH|BASH_ENV|ENV|PROMPT_COMMAND|PYTHONPATH|PYTHONSTARTUP|NODE_OPTIONS|GIT_SSH_COMMAND)\+?=|\bunset\s+(ANTHROPIC_([A-Z]+_)?BASE_URL|HTTPS?_PROXY)\b|(>>?|\btee(\s+-[^\s]+){0,8}\s)\s*~?/?[^\s>]*?\.(bashrc|profile|zshrc|zprofile|zshenv|zlogin|bash_profile|bash_login)\b'
    label: env_tamper
    reason: changing the environment the next commands run in
    remedy: Have a person approve the held call, or pass the setting to the one command that needs it.
  - id: TK-F025
    class: shell
    field: effects
    pattern: '^WRITE_TARGET:(?:[\w\W]*?/)?\.(?:bashrc|bash_profile|bash_login|bash_logout|profile|zshenv|zshrc|zprofile|zlogin|zlogout)$'
    label: env_tamper
    reason: changing the environment the next commands run in
    remedy: Have a person approve the held call, or pass the setting to the one command that needs it.
  - id: TK-F013
    class: shell
    pattern: '^(curl|wget|ssh|scp|sftp|rsync|nc|ncat|netcat|socat|telnet|ftp|dig|nslookup|host|http|https|xh|xhs|aria2c)( |$)|^openssl s_client( |$)'
    label: egress
    reason: a network command
    remedy: Have a person approve the held call, or work from files already in the workspace.
  - id: TK-F024
    tool: LibraryUpload
    pattern: '^'
    label: egress
    reason: an upload tool sending a file off the machine
    remedy: Have a person approve the held call, or keep the file in the workspace.
  - id: TK-F030
    class: shell
    field: publish
    pattern: '^PUSH:(?:release|image|subtree|config|verb|tag) |^(?:gh|hub)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} release create(?: |$)'
    label: side_effect
    reason: a release created or published, an image pushed, a tag made through the API, a subtree push or a change to where pushes go
    remedy: Have a person approve the held call; the strict profile holds every change that leaves the workspace.
  - id: TK-F048
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)([^/]*\.git/(modules/([^/]+/){1,8}|worktrees/[^/]+/)?config(\.worktree)?|([^/.]*[.-])?git(config|alias(es)?)([.-][^/]*)?|git/config|\.?cargo/config(\.toml)?|(bin|scripts)/activate(\.[a-z0-9]+)?)$'
    label: side_effect
    reason: writing a Git or cargo config file or a virtualenv's activate script, which can change where a push goes or what a command publishes
    remedy: Have a person approve the held call, or set the one setting the task needs with `git config` or on the command line.
  - id: TK-F049
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: git_config
    pattern: '(?:^|\n)[ \t\f\v\r]*\[[ \t]*(?:[Aa][Ll][Ii][Aa][Ss][ \t]*\]|(?:[Rr][Ee][Mm][Oo][Tt][Ee]|[Uu][Rr][Ll]|[Ii][Nn][Cc][Ll][Uu][Dd][Ee][Ii][Ff])[ \t]+"|[Ii][Nn][Cc][Ll][Uu][Dd][Ee][ \t]*\])'
    label: side_effect
    reason: writing a Git config section (an alias, a remote, a URL rewrite or an include) into a file a Git config may include
    remedy: Have a person approve the held call, or set the one setting the task needs with `git config` or on the command line.
  - id: TK-F029
    tool: '^(?:artifact_create|artifact_update)$'
    pattern: '^'
    label: egress
    reason: publishing an artifact sends its files off the machine
    remedy: Have a person approve the held call, or keep the files in the workspace.

flag:
  - id: TK-F006
    class: mcp
    pattern: '.*'
    label: external_tool
