_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][Jj][Ss][Oo][Nn]\([ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss]|[Gg][Ii][Tt][Hh][Uu][Bb]|[Ee][Nn][Vv])[ \t]*\))[ \t]*\}\})(?:[^"\\\r\n;|&#]|\\.){0,96}"|[^\s"\x27@;|&#]{0,96}\$(?:[A-Za-z_][A-Za-z0-9_]*|\{!?[A-Za-z_][A-Za-z0-9_]*(?:[:=+?#%/^,@\[-][^}\r\n;|&#]{0,48})?\}|\([A-Za-z_][A-Za-z0-9_]*\)|\{env\.[A-Za-z_][A-Za-z0-9_]*\}|[Ee][Nn][Vv]:[A-Za-z_][A-Za-z0-9_]*|\{\{[ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][Jj][Ss][Oo][Nn]\([ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss]|[Gg][Ii][Tt][Hh][Uu][Bb]|[Ee][Nn][Vv])[ \t]*\))[ \t]*\}\})[^\s"\x27;|&#]{0,96})|\\"[^"@\r\n;|&#]{0,96}\$(?:[A-Za-z_][A-Za-z0-9_]*|\{!?[A-Za-z_][A-Za-z0-9_]*(?:[:=+?#%/^,@\[-][^}\r\n;|&#]{0,48})?\}|\([A-Za-z_][A-Za-z0-9_]*\)|\{env\.[A-Za-z_][A-Za-z0-9_]*\}|[Ee][Nn][Vv]:[A-Za-z_][A-Za-z0-9_]*|\{\{[ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][Jj][Ss][Oo][Nn]\([ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss]|[Gg][Ii][Tt][Hh][Uu][Bb]|[Ee][Nn][Vv])[ \t]*\))[ \t]*\}\})[^"\r\n;|&#]{0,96}\\"|\x27[^\x27@\r\n;|&#]{0,96}\$(?:[A-Za-z_][A-Za-z0-9_]*|\{!?[A-Za-z_][A-Za-z0-9_]*(?:[:=+?#%/^,@\[-][^}\r\n;|&#]{0,48})?\}|\([A-Za-z_][A-Za-z0-9_]*\)|\{env\.[A-Za-z_][A-Za-z0-9_]*\}|[Ee][Nn][Vv]:[A-Za-z_][A-Za-z0-9_]*|\{\{[ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][Jj][Ss][Oo][Nn]\([ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss]|[Gg][Ii][Tt][Hh][Uu][Bb]|[Ee][Nn][Vv])[ \t]*\))[ \t]*\}\})[^\x27\r\n;|&#]{0,96}\x27))|(?:(?:echo|printf|cat)[ \t]+[^;\r\n|&#]{0,128}\$(?:[A-Za-z_][A-Za-z0-9_]*|\{!?[A-Za-z_][A-Za-z0-9_]*(?:[:=+?#%/^,@\[-][^}\r\n;|&#]{0,48})?\}|\([A-Za-z_][A-Za-z0-9_]*\)|\{env\.[A-Za-z_][A-Za-z0-9_]*\}|[Ee][Nn][Vv]:[A-Za-z_][A-Za-z0-9_]*|\{\{[ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][Jj][Ss][Oo][Nn]\([ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss]|[Gg][Ii][Tt][Hh][Uu][Bb]|[Ee][Nn][Vv])[ \t]*\))[ \t]*\}\})[^;\r\n|&#]{0,128}|(?:printenv|env|set|export|declare)(?:[ \t]+[-A-Za-z0-9_]+){0,2})[ \t]*\|[ \t]*(?:base64(?:[ \t]+[-A-Za-z0-9=]+){0,3}[ \t]*\|[ \t]*)?(?:[./a-zA-Z0-9_-]*/curl|[./a-zA-Z0-9_-]*/wget|curl|wget)\b[^;\r\n|&#]{0,128}(?:(?:(?:-[a-zA-Z]*[dF]|--(?:data(?:-[a-z-]+)?|form(?:-string)?|json|post-data|body-data))(?:[ \t]+|=)?@-|(?:-T|--upload-file)(?:[ \t]+|=)-)[^;\r\n|&#]{0,128}https?://|https?://[^;\r\n|&#]{0,128}(?:(?:-[a-zA-Z]*[dF]|--(?:data(?:-[a-z-]+)?|form(?:-string)?|json|post-data|body-data))(?:[ \t]+|=)?@-|(?:-T|--upload-file)(?:[ \t]+|=)-)))'
    reason: a CI command sends a secret to a URL
    remedy: Check the workflow command and its destination before approving the write; keep secrets out of network request data.
    rationale: A workflow can leak a CI secret when the runner executes it, after the agent's write has finished.

flag:
  - id: TK-F001
    class: shell
    field: line
    pattern: '\b(curl|wget|ssh|scp|rsync|nc|ncat|telnet|ftp)\b'
    label: network
  - id: TK-F002
    class: http
    pattern: '.*'
    label: network
  - id: TK-F003
    class: shell
    field: line
    pattern: '\b(rm|mv|chmod|chown|dd|truncate|shred|unlink)\b'
    label: destructive
  - id: TK-F004
    class: shell
    field: line
    # git's push (send-pack, hub push too), reset --hard and clean after up to eight global options, as TK-D003 reads
    # `push` (git -C dir push); a package install or publish (npm, pnpm, yarn, bun, pip of any version, uv, pipx, poetry, conda, cargo, gem,
    # bundle, go, brew, apt, dnf, yum, apk, twine), a docker or podman run or push (container run, image push, after
    # up to eight options), terraform or tofu apply, pulumi up, helm install, upgrade or push and kubectl apply or
    # delete (both after up to eight options). The strict pack holds it, so its list is what "every install" means there
    pattern: '\b((?:git|hub)\s+(-[Cc] [^ ]* |--(git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(=[^ ]*)? ){0,8}(push|send-pack|reset\s+--hard|clean)|(npm|pnpm|yarn|bun)\s+(publish|install|i|ci|add)|pip[0-9.]*\s+install|uv\s+(add|sync|publish|tool\s+install)|pipx\s+(install|inject)|poetry\s+(add|install|publish)|(conda|mamba)\s+install|cargo\s+(install|add|publish)|gem\s+(install|push)|bundle\s+(install|add)|go\s+(install|get)|brew\s+install|(apt|apt-get|dnf|yum)\s+install|apk\s+add|twine\s+upload|(docker|podman)(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+((container\s+)?run|(image\s+)?push)|(terraform|tofu)\s+apply|pulumi\s+up|helm(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(install|upgrade|push)|kubectl(\s+-[^\s]+(\s+[^-\s][^\s]*)?){0,8}?\s+(apply|delete))\b'
    label: side_effect
  - id: TK-F005
    # what any call acts on (a command's argv and redirections, a file path, an MCP tool's arguments, a URL), so every
    # shell, file and MCP tool counts, not only the coding agents' own; writes included. A target that is one env
    # template path (no space: never a whole command) is exempt
    field: target
    pattern: '\.env\b|id_rsa|\.ssh/|credentials|\.aws/|\.netrc'
    unless: '^([^ ]*?/)?\.[Ee][Nn][Vv]\.([Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])$'
    label: secrets_access
  - id: TK-F006
    class: mcp
    pattern: '.*'
    label: external_tool
  - id: TK-F007
    class: shell
    field: line
    # lean: tmux's -d within 200 characters of `new`, so each tmux on a long line scans a bounded stretch on the
    # fallback engine; widen it if a real command puts more before -d
    pattern: '\bnohup\b|\bsetsid\b|\bdisown\b|\bcrontab\b|\bat\s+now\b|\bsystemd-run\b|\bscreen\s+-[a-zA-Z]*d|\btmux\s+new(-session)?\s+[^\n]{0,200}?-d|\bdaemonize\b|\bwhile\s+(true|:)'
    label: background_spawn
  - id: TK-F014
    class: shell
    field: command
    # a trailing `&`: the raw command, where a quoted `&` (`echo 'x &'`) is still quoted
    pattern: '&\s*$|&\s*;'
    label: background_spawn
  - id: TK-F008
    tool: '[Bb]ash'   # bash too, as TK-A014
    field: run_in_background
    pattern: '^[Tt][Rr][Uu][Ee]$'
    label: background_spawn
  - id: TK-F016
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    # ANTHROPIC_BASE_URL (where the agent's model calls go; ANTHROPIC_BEDROCK_BASE_URL, ANTHROPIC_VERTEX_BASE_URL and
    # any other ANTHROPIC_<provider>_BASE_URL too) anywhere in a Write, Edit, MultiEdit or NotebookEdit call's
    # arguments, in any case: Windows reads an environment variable's name in any case (`set anthropic_base_url=…`).
    # A mention is flagged with a setting: the ways to set or remove it are too many to list (an assignment, a settings
    # key, os.Setenv, set_var, reg add, a value on the next line, …), and a flag only marks the call
    pattern: '[Aa][Nn][Tt][Hh][Rr][Oo][Pp][Ii][Cc]_([A-Za-z]+_)?[Bb][Aa][Ss][Ee]_[Uu][Rr][Ll]'
    label: harness_config
  - id: TK-F017
    class: shell
    field: line
    # TK-F016 on each shell line, as typed and as the parser normalised it, from every shell tool: the line holds what
    # the argv doesn't (an assignment prefix, `ANTHROPIC_BASE_URL=x claude`, and the text a heredoc or echo writes)
    pattern: '[Aa][Nn][Tt][Hh][Rr][Oo][Pp][Ii][Cc]_([A-Za-z]+_)?[Bb][Aa][Ss][Ee]_[Uu][Rr][Ll]'
    label: harness_config
  - id: TK-F010
    class: shell
    field: command
    pattern: '(^|[;&|\s])(function\s+)?(ls|cat|rm|git|curl|wget|python3?|node|echo|grep|sudo|tracekit|claude|pytest|npm|cd|test|printf)\s*\(\s*\)\s*\{|\balias\s+(ls|cat|rm|git|curl|python3?|echo|grep|pytest|npm|claude|tracekit)='
    label: shell_shadowing
  - id: TK-F011
    class: shell
    field: command
    # a variable that changes what the next commands run or load (PATH, its += too, the loaders' preload and library
    # paths, Python's startup file, git's ssh command), unsetting the model URL or a proxy, and appending to or teeing
    # into a bash or zsh startup file
    pattern: '\b(export\s+)?(PATH|LD_PRELOAD|LD_LIBRARY_PATH|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH|BASH_ENV|ENV|PROMPT_COMMAND|PYTHONPATH|PYTHONSTARTUP|NODE_OPTIONS|GIT_SSH_COMMAND)\+?=|\bunset\s+(ANTHROPIC_([A-Z]+_)?BASE_URL|HTTPS?_PROXY)\b|(>>?|\btee(\s+-[^\s]+){0,8}\s)\s*~?/?[^\s>]*?\.(bashrc|profile|zshrc|zprofile|zshenv|zlogin|bash_profile|bash_login)\b'
    label: env_tamper
  - id: TK-F012
    # any URL a call acts on: an http or browser call, a URL in a command's argv, an MCP tool's arguments. A GET with
    # a query string sends data too, so egress is not only what TK-P003's sends_to reads
    field: target
    pattern: '\b([Hh][Tt][Tt][Pp][Ss]?|[Ww][Ss][Ss]?|[Ff][Tt][Pp])://'
    label: egress
  - id: TK-F013
    # a network command, whatever it names: `curl host/?k=v` and `nslookup data.example` send data without a URL;
    # HTTPie (http, https), xh, socat, sftp, aria2c and openssl s_client too
    class: shell
    pattern: '^(curl|wget|ssh|scp|sftp|rsync|nc|ncat|netcat|socat|telnet|ftp|dig|nslookup|host|http|https|xh|xhs|aria2c)( |$)|^openssl s_client( |$)'
    label: egress
  - id: TK-F024
    # every call of an upload tool (CodeBuddy Code's LibraryUpload): its file leaves the machine, as one a network
    # command sends (TK-F013); a secrets file is TK-D022's deny
    tool: LibraryUpload
    pattern: '^'
    label: egress
