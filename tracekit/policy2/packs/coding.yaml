    reason: reading a secret's value from a cloud secret store through an MCP tool
    remedy: Have a person approve the held call, or ask the person for the one value the task needs.
    rationale: The MCP twin of TK-A035 for a tool that runs a CLI command; the same commands are held, listing and describing stay allowed.
  - id: TK-A037
    class: mcp
    # a tool whose name ends in a word for reading a secret, as `mcp__<server>__<tool>` or `mcp:<server>/<tool>`, with
    # `_` or `-` between words, or in CamelCase. One `.*` per branch: `__.*__(.*_)?` backtracked over runs of `_`
    tool: 'mcp(:[^/]+/(.*[_-])?|__.*[_-])(([Bb]atch[_-]?)?([Gg]et|[Rr]ead|[Ff]etch|[Rr]etrieve|[Rr]eveal|[Ss]how)[_-]?([Kk]ey[_-]?[Vv]ault[_-]?)?[Ss]ecret([_-]?[Vv]alue)?|[Aa]ccess[_-]?[Ss]ecret[_-]?[Vv]ersion|[Kk]ey[_-]?[Vv]ault[_-]?[Ss]ecret[_-]?([Gg]et|[Ss]how|[Rr]ead))|mcp(:[^/]+/|__).*((Batch)?(Get|Read|Fetch|Retrieve|Reveal|Show)(Key[_-]?Vault)?Secret(Value)?|AccessSecretVersion|KeyVaultSecret(Get|Show|Read))'
    pattern: '^'
    reason: reading a secret's value through an MCP tool
    remedy: Have a person approve the held call, or ask the person for the one value the task needs.
    rationale: The MCP twin of TK-A035, for a tool whose name says it returns a secret (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault); a tool that lists or describes secrets is not held.
  - id: TK-A038
    class: mcp
    tool: 'mcp(:[^/]+/(.*[_-])?|__.*[_-])[Gg]et[_-]?[Pp]arameters?([_-]?[Bb]y[_-]?[Pp]ath|[_-]?[Hh]istory)?|mcp(:[^/]+/|__).*Get(Parameters?)(ByPath|History)?'
    pattern: '"([Ww]ith_?[Dd]ecrypt(ion)?|with-decryption|[Dd]ecrypt(ion)?)":(true|"true"|"True"|"TRUE"|1)'
    reason: reading a decrypted parameter through an MCP tool
    remedy: Have a person approve the held call, or read the parameter without decryption.
    rationale: SSM Parameter Store returns a SecureString's plaintext only when asked to decrypt it; the call that asks is the one a person confirms.
  - id: TK-A052
    class: shell
    # each command's argv: kubectl's or oc's `get` of a secret with an output that prints it (any -o or --output but
    # name and wide, or a --template), `oc extract` of a secret (to files or to stdout), `view-secret` (the plugin by
    # either name) and `create token`, with up to eight options before the command. get's type is its first word
    # after up to eight options or earlier TYPE/NAMEs, in any case, with its API group, as TYPE/NAME or one of a list
    # (cm,secrets); the output may come before it or within sixteen words after it. -f, -k, -l, -L, -n, -o, -s, -v
    # and --namespace take the next word as their value (`-n secrets` names a namespace), any other option either
    # way; a word ends the type only at a space, `/` or `,` (secret-reader is a name)
    pattern: '^(?:kubectl|oc)(?: (?:-[^ ]+ [^- ][^ ]*|-[^- =]*(?:[^- =fklLnosv]|=[^ ]*)|-[AwRh]*[fklLnosv][^ ]+|--(?:[^ =]*=[^ ]*|(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e(?:[^ =s][^ =]*|s(?:[^ =p][^ =]*|p(?:[^ =a][^ =]*|a(?:[^ =c][^ =]*|c(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)))){0,8} (?:get(?: (?:(?:-[^ ]+ [^- ][^ ]*|-[^- =]*(?:[^- =fklLnosv]|=[^ ]*)|-[AwRh]*[fklLnosv][^ ]+|--(?:[^ =]*=[^ ]*|(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e(?:[^ =s][^ =]*|s(?:[^ =p][^ =]*|p(?:[^ =a][^ =]*|a(?:[^ =c][^ =]*|c(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)))|[^- /][^ /]*/[^ ]*)){0,8} (?:(?:[^- ,/][^ ,/]*,){0,8}[Ss][Ee][Cc][Rr][Ee][Tt][Ss]?(?:\.[^ ,/]*)?(?:[,/][^ ]*)?(?: [^ ]+){0,16}? (?:(?:-[AwRh]*o[ =]?|--output[ =])(?:[^ nw=][^ ]*|n(?:[^ a][^ ]*|a(?:[^ m][^ ]*|m(?:[^ e][^ ]*|e[^ ]+)?)?)?|w(?:[^ i][^ ]*|i(?:[^ d][^ ]*|d(?:[^ e][^ ]*|e[^ ]+)?)?)?)|--template[ =][^ ]*)|(?:(?:-[AwRh]*o[ =]?|--output[ =])(?:[^ nw=][^ ]*|n(?:[^ a][^ ]*|a(?:[^ m][^ ]*|m(?:[^ e][^ ]*|e[^ ]+)?)?)?|w(?:[^ i][^ ]*|i(?:[^ d][^ ]*|d(?:[^ e][^ ]*|e[^ ]+)?)?)?)|--template[ =][^ ]*)(?: (?:(?:-[^ ]+ [^- ][^ ]*|-[^- =]*(?:[^- =fklLnosv]|=[^ ]*)|-[AwRh]*[fklLnosv][^ ]+|--(?:[^ =]*=[^ ]*|(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e(?:[^ =s][^ =]*|s(?:[^ =p][^ =]*|p(?:[^ =a][^ =]*|a(?:[^ =c][^ =]*|c(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)))|[^- /][^ /]*/[^ ]*)){0,8} (?:[^- ,/][^ ,/]*,){0,8}[Ss][Ee][Cc][Rr][Ee][Tt][Ss]?(?:\.[^ ,/]*)?(?:[,/][^ ]*)?)|view-secret|create(?: (?:-[^ ]+ [^- ][^ ]*|-[^- =]*(?:[^- =fklLnosv]|=[^ ]*)|-[AwRh]*[fklLnosv][^ ]+|--(?:[^ =]*=[^ ]*|(?:[^ =n][^ =]*|n(?:[^ =a][^ =]*|a(?:[^ =m][^ =]*|m(?:[^ =e][^ =]*|e(?:[^ =s][^ =]*|s(?:[^ =p][^ =]*|p(?:[^ =a][^ =]*|a(?:[^ =c][^ =]*|c(?:[^ =e][^ =]*|e[^ =]+)?)?)?)?)?)?)?)?)))){0,8} token|extract(?: [^ ]+){0,16}? [Ss][Ee][Cc][Rr][Ee][Tt][Ss]?(?:\.[^ ,/]*)?/[^ ]*)(?: |$)|^kubectl-view-secret(?: |$)'
    reason: reading a Kubernetes secret's value or creating a token
    remedy: Have a person approve the held call, or list secrets by name (kubectl get secrets) or describe one, which shows only sizes.
    rationale: A live secret or a new service account token is a cluster credential the agent can use or send anywhere; listing names and describing sizes stay allowed.
  - id: TK-A053
    class: shell
    # each command's argv: vault's (or OpenBao's bao) `kv get`, `read` (it prints secrets from any engine), `unwrap`,
    # `print token`, `token create` and a `write` to auth/token/create (create-orphan, create/<role> too), with up to
