|--post-(?:data|file))[^ ]*)|(?:https?|xhs?) (?:[\w\W]*? )?(?:(?:[Pp][Oo][Ss][Tt]|--raw[^ ]*)(?: (?:(?:[^Pp -][^ ]*|[Pp](?:[^Oo ][^ ]*)?|[Pp][Oo](?:[^Ss ][^ ]*)?|[Pp][Oo][Ss](?:[^Tt ][^ ]*)?|[Pp][Oo][Ss][Tt][^ ]+|-(?:[^- ][^ ]*)?|--(?:[^r ][^ ]*|r(?:[^a ][^ ]*)?|ra(?:[^w ][^ ]*)?)?))?)*? (?:https?://)?(?:api\.stripe\.com/+(?:v1/(?:refunds|payouts|transfers|topups|charges|payment_intents|treasury/outbound_(?:payments|transfers)|charges/[^/ ?#]+/(?:capture|refunds?)|payment_intents/[^/ ?#]+/(?:confirm|capture)|invoices/[^/ ?#]+/pay|transfers/[^/ ?#]+/reversals)|v2/money_management/outbound_(?:payments|transfers))|api(?:-m)?\.paypal\.com/+(?:v1/payments/payouts|v2/checkout/orders/[^/ ?#]+/capture|v2/payments/(?:authorizations/[^/ ?#]+/capture|captures/[^/ ?#]+/refund))|connect\.squareup\.com/+(?:v2/(?:payments|refunds)|v2/payments/[^/ ?#]+/complete))/?(?:[?#][^ ]*)?(?: |$)|(?:https?://)?(?:api\.stripe\.com/+(?:v1/(?:refunds|payouts|transfers|topups|charges|payment_intents|treasury/outbound_(?:payments|transfers)|charges/[^/ ?#]+/(?:capture|refunds?)|payment_intents/[^/ ?#]+/(?:confirm|capture)|invoices/[^/ ?#]+/pay|transfers/[^/ ?#]+/reversals)|v2/money_management/outbound_(?:payments|transfers))|api(?:-m)?\.paypal\.com/+(?:v1/payments/payouts|v2/checkout/orders/[^/ ?#]+/capture|v2/payments/(?:authorizations/[^/ ?#]+/capture|captures/[^/ ?#]+/refund))|connect\.squareup\.com/+(?:v2/(?:payments|refunds)|v2/payments/[^/ ?#]+/complete))/?(?:[?#][^ ]*)?(?: [^ ]*){0,16}? (?:--raw|[^ =:@-][^ =:@]*(?:=[^=]|=$|:=|@))))'
    # curl -G (first) sends its data as a query string: a GET, unless a -X or --request word (a cluster with X too)
    # sets the method. Help only as `stripe <resource> [<operation>] --help` (or -h) and nothing else: an option takes
    # the next word as its value (`--description -h`), so a -h anywhere else is no help
    unless: '^curl (?:-G|--get)(?: (?:[^- ][^ ]*|-[^-X ][^X ]*|--(?:[^r ][^ ]*|r(?:[^e ][^ ]*)?|re(?:[^q ][^ ]*)?)?|-)?)*$|^stripe(?: [a-z_]+){1,3} (?:--help|-h)$'
    reason: moving money (a Stripe, PayPal or Square charge, payout, transfer or refund)
    remedy: Check the amount, currency and payee in the command or the file it sends before approving it; a refund with no amount refunds in full, and a confirm, capture or pay moves the amount set earlier.
    rationale: A coding agent with a developer's own key moves real money in one call, and Stripe holds only agent-tagged keys' calls for approval; a person confirms each one.
  - id: TK-A044
    class: mcp
    # Stripe's MCP tools that move money (docs.stripe.com/mcp: send_money, transfer_money and convert_currency on a
    # Treasury balance) and its agent toolkit's create_refund, from any server, as `mcp__<server>__<tool>`,
    # `mcp:<server>/<tool>` or Crush's joined `mcp__<server>_<tool>`, in snake_case or camelCase (createRefund)
    tool: 'mcp(:[^/]+/|__.*[_-])([Ss]end_?[Mm]oney|[Tt]ransfer_?[Mm]oney|[Cc]onvert_?[Cc]urrency|[Cc]reate_?[Rr]efund)'
    pattern: '^'
    # a person's payment grant (docs/intent-grants.md) releases a call it can read (an amount in minor units, a
    # currency, one payee) within its limits; a refund or conversion names no payee, so it stays held
    approval: {grant: payment.send}
    reason: moving money through an MCP tool (sending, transferring or converting money, or a refund)
    remedy: Check the amount, currency and recipient in the call's arguments before approving it; a refund with no amount refunds in full.
    rationale: The MCP twin of TK-A043 for tools whose name says they move money; a person confirms each call.
  - id: TK-A045
    class: mcp
    # Stripe's generic write tool, stripe_api_write, when its arguments name a refund (the money-moving write Stripe
    # lists for it) or one of TK-A043's Stripe endpoints as a path; Crush's joined name too, as TK-A044's
    # lean: Stripe doesn't document the tool's argument names, so the whole call is read and a refund named anywhere in
    # it is held (a product described as "no refunds" too); match the method and path once Stripe documents them
    tool: 'mcp(:[^/]+/|__.*[_-])stripe_api_write'
    pattern: '[Rr][Ee][Ff][Uu][Nn][Dd]|"(?:https://api\.stripe\.com)?/?(?:v1/(?:refunds|payouts|transfers|topups|charges|payment_intents|treasury/outbound_(?:payments|transfers)|charges/[^/ ?#"]+/(?:capture|refunds?)|payment_intents/[^/ ?#"]+/(?:confirm|capture)|invoices/[^/ ?#"]+/pay|transfers/[^/ ?#"]+/reversals)|v2/money_management/outbound_(?:payments|transfers))/?(?:[?#][^"]*)?"'
    reason: moving money through Stripe's MCP write tool (a refund, charge, payout or transfer)
    remedy: Check the amount, currency and payee in the call's arguments before approving it; a refund with no amount refunds in full.
    rationale: Stripe asks a person to confirm some of these writes only when the agent acts as that person; a person confirms each one here, whatever the key.
  - id: TK-A034
    class: shell
    # each command's argv: Codex applies a patch itself when the shell runs apply_patch or applypatch (it puts both on
    # PATH, codex-rs/arg0, as .bat on Windows), or its binary under any name with --codex-run-as-apply-patch first (or
    # after the script of its npm launcher: `node codex.js`), or its binary started as apply_patch (`exec -a`, `env
    # --argv0`), so the files the patch writes reach no file rule. argv[0] is a basename in lower case without .exe
    # lean: every patch run from the shell is held, an ordinary file's too; decide Codex's own form (`[cd D &&]
