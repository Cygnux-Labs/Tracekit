# Coding pack (policy v2): the shell, files and harness self-protection rules of tracekit/policy/default.yaml,
# ported to the RE2 subset and to signer-side classes. Rule ids are kept where the meaning is the same.
#
# Shell rules without a field match each command's argv (wrappers, paths, quoting and the program name's case resolved
# by policy2/shell.py); `field: command` matches the raw command line; `field: line` matches it and each line
# policy2/shell.py normalised (quotes and escapes resolved, redirections kept), as typed and again with its program
# names in lower case; `field: code` the same without the text a command only writes into a file (echo's or printf's
# words, the heredoc or herestring cat or tee copies), and what a download runs (a process substitution read as the
# pipe it is, a saved download that a later command runs: engine._download_runs). File rules match the
# signer-normalised `path` (and, with `..`, the lexically normalised one), with `\` as `/` and also casefolded (the
# agent's file system may ignore case). Rules stay tripwires: the protection is the signer, its storage and the
# witnesses.

version: '2026.11-v2-82'
description: coding agents on a laptop (Claude Code, Codex, Cursor, Gemini)
# laptop: a tool the pack does not map is flagged, not held; server.yaml holds it for a person (ask)
unknown_tools: flag

tools:
  Bash: shell
  Monitor: shell             # Claude Code: a background command, run in the shell Bash uses
  # Claude Code's PowerShell tool stays unmapped: the signer also reads it as a shell line where bash reads it whole
  run_shell_command: shell   # Gemini CLI
  shell: shell               # Codex, OpenAI Agents ShellTool
  local_shell: shell         # OpenAI Agents LocalShellTool
  container.exec: shell      # OpenAI hosted container
  run_terminal_cmd: shell    # Cursor
  terminal: shell            # LangChain ShellTool
  Write: fs
  Edit: fs
  MultiEdit: fs
  NotebookEdit: fs
  Read: fs
  Grep: fs
  Glob: fs
  LibraryUpload: fs          # CodeBuddy Code: sends the local file at its path to its library (TK-D022, TK-F024)
  WebFetch: http
  WebSearch: http
  'srt:request': http        # a request srt-proxy asks about (tracekit srt-decider)
  'mcp__*': mcp
  'mcp:*/*': mcp
  'a2a:*': a2a               # the A2A gateway's calls (a2a:<upstream>/<method>) and run.transfer (a2a:transfer)

# tool classes and tool names whose results are untrusted content (the signer's provenance index)
untrusted: [http, mcp, WebFetch, WebSearch]

deny:
  # --- shell ---
  - id: TK-D001
    class: shell
    # sudo and its kin, systemd's run0, and su in any form (it switches to root when no user is named; -c may sit in a
    # cluster, -lc)
    pattern: '^(sudo|sudoedit|doas|pkexec|run0|su)( |$)'
    reason: privilege escalation
    remedy: Run the command as the agent's own user, without sudo; a person runs what needs root, or gives the agent a sandbox where it is root.
    rationale: An agent should never need root; escalation widens every other risk and would let it reach the signer.
  - id: TK-D002
    class: shell
    field: code
    pattern: '(curl|wget)\b[^;&\n]*\|\s*(sudo\s+)?(env\s+|nohup\s+)?(\S*/)?(sh|bash|zsh|dash)\b(?: -(?:e|x|n|v|u|a|C|f|l|i))*(?:\s+-s|\s+(?:-|/dev/stdin|/dev/fd/0|/proc/self/fd/0|<&0)\s*(?:[;&|)>\n]|$)|\s*(?:[;&|)>\n]|$))|(curl|wget)\b[^;&\n]*\|\s*(sudo\s+)?(\S*/)?(python3?|perl|ruby|node)\b(?: -(?:I|B|u|s|w|W|O|OO|x))*(?:\s+(?:-|/dev/stdin|/dev/fd/0|/proc/self/fd/0|<&0))?\s*(?:[;&|)>\n]|$)|(curl|wget)\b[^;&\n]*\|\s*(sudo\s+)?(\S*/)?[gnm]?awk\b[^\n]*?(\bsystem\s*\(|\|&?\s*")|(curl|wget)\b[^;&\n]*\|\s*xargs\b[^;&\n]*\b(sh|bash|zsh|dash)\s+-c(?:\s|[;&|)]|$)|(curl|wget)\b[^;\n]*(?:&&|;)[^\n]*\b(sh|bash|zsh|dash|python3?|node|perl|ruby)\b\s+\S+|(curl|wget)\b[^;\n]*(?:&&|;)[^\n]*(?:\bsource|\.)\s+\S+|(curl|wget)\b[^;\n]*(?:&&|;)[^\n]*(^|[;&]\s*)\./\S+|(ba|z)?sh\s+<\(\s*(curl|wget)|\$\(\s*(curl|wget)|\b(exec|eval)\(\s*[A-Za-z_.]*urlopen'
    reason: running a downloaded script
    remedy: Download the script to a file and show it for review instead of piping it into a shell; a person runs it once they have read it.
    rationale: Remote code execution without review.
  - id: TK-D003
    class: shell
    # each command's argv, as TK-A002: a later command (`git push origin main && ls -f`), a heredoc after the push or
    # a commit message naming one is not the push's arguments. `git send-pack` and `hub push` (hub runs git) push as
    # `git push` does. Global options may come before `push` (git -C dir push, git --work-tree dir push, an empty
    # value too: git --namespace '' push); -f may sit in a short-option cluster
    # before any `o` (`-uf`, `-4f`; `-of` is -o's value); --mirror may be abbreviated (`--m`: push's only option
    # starting with m); a `+` refspec forces too; so does send-pack's (git's plumbing push). A config that forces a push
    # (a mirror remote, a + push refspec) and an alias to push are read as the push they make (policy2/shell.py), and
    # so is a GitHub ref updated through its API (gh api, curl, wget, HTTPie or xh) or GraphQL's updateRef with a force
    # field or body of any value but a literal false or 0 (a PATCH without one only fast-forwards, as a plain push
    # does; one whose body the parser can't read, from a file or a variable, is held as TK-SHELL-PARSE).
    # `[\w\W]*?` crosses a newline inside an argument; anchored and lazy, so the fallback engine stays linear
    pattern: '^(?:git|hub) (-[Cc] [^ ]* |--(git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(=[^ ]*)? ){0,8}(push|send-pack)\b[\w\W]*?( --force\b| -[0-9A-Za-eg-np-z]*f| --m(i|ir|irr|irro|irror)?( |$)| \+[^ ])'
    reason: force push
    remedy: Push without --force, --mirror or a + refspec (rebase onto the remote branch, or push a new branch); a person rewrites shared history themselves.
    rationale: Rewrites shared history.
  - id: TK-D004
    class: shell
    # rm -r of root or a home (a pattern that may match each of its files or folders too, `*`, `.*`, `?*`, `/*/`,
    # `///*`: read as the folder it may empty), among up to 16 other operands and
    # with -r before or after it, as GNU rm reads options anywhere; find with -delete on root, or on a
    # home with nothing but depth and type filters (and -true or -print, which pick nothing, and a name, path or regex
    # that matches every file, `*` or `.*`, -size +0, or a negated name, path or regex, which picks all but a few)
    # before -delete, so a find there that picks files by name isn't denied (an -exec rm -r of what it finds is read
    # as -delete: policy2/shell.py). A home is ~, ~user, $HOME, /home or /Users and a user's folder in it (under
    # /var, /private or macOS's /System/Volumes/Data too), or /root (/var/root);
    # rsync --delete into one (its last word) empties it too. The
    # root or home may be any of up to nine starting points (BSD's -f before one too), after up to eight of GNU's and
    # BSD's options (-H, -L, -P, -E, -X, -d, -s, -x in a cluster, -D with its value, -O3), and spelled with extra
    # slashes, `.` or `..` (`//`, `/.`, `~/.`); a starting point past the home (~/.cache) isn't one
    pattern: '^rm [-A-Za-z ]*-[A-Za-z]*[rR][-A-Za-z ]* (/+|(~[A-Za-z0-9._-]*|\$HOME|\$\{HOME\}|(/+(System/+Volumes/+Data|private))?(/+var)?/+(home|Users)(/+[^/ ]+)?|(/+private)?(/+var)?/+root)/*)(\.?\?*\*[*?]*/+)*(\.?\?*\*[*?]*)?( |$)|^rm( [^ ]+){0,16}? (-[A-Za-z]*[rR][A-Za-z]*|--rec[a-z]*)( [^ ]+){0,16}? (/+|(~[A-Za-z0-9._-]*|\$HOME|\$\{HOME\}|(/+(System/+Volumes/+Data|private))?(/+var)?/+(home|Users)(/+[^/ ]+)?|(/+private)?(/+var)?/+root)/*)(\.?\?*\*[*?]*/+)*(\.?\?*\*[*?]*)?( |$)|^rm( [^ ]+){0,16}? (/+|(~[A-Za-z0-9._-]*|\$HOME|\$\{HOME\}|(/+(System/+Volumes/+Data|private))?(/+var)?/+(home|Users)(/+[^/ ]+)?|(/+private)?(/+var)?/+root)/*)(\.?\?*\*[*?]*/+)*(\.?\?*\*[*?]*)?( [^ ]+){0,16}? (-[A-Za-z]*[rR][A-Za-z]*|--rec[a-z]*)( |$)|^find (-[EHLPXdsx]+ |-O[0-9]* |-D( [^ ]*|[^ ]+) ){0,8}((-[EHLPXdsx]*f ?)?[^-(! ][^ ]* ){0,8}(-[EHLPXdsx]*f ?)?(/\.\.?|/)+ .*-delete( |$)|^find (-[EHLPXdsx]+ |-O[0-9]* |-D( [^ ]*|[^ ]+) ){0,8}((-[EHLPXdsx]*f ?)?[^-(! ][^ ]* ){0,8}(-[EHLPXdsx]*f ?)?(~[A-Za-z0-9._-]*|\$HOME|\$\{HOME\}|(/+(System/+Volumes/+Data|private))?(/+var)?/+(home|Users)(/+[^/ ]+)?|(/+private)?(/+var)?/+root)(/\.\.?|/)* ((-[EHLPXdsx]*f ?)?[^-(! ][^ ]* ){0,8}(-(mindepth|maxdepth) [0-9]+ |-(depth|d|xdev|mount|true|print0?) |-type [a-z,]+ |-i?(name|path|wholename) \* |-i?regex \.\* |-size \+0[bckwMG]? |(!|-not) -i?(name|path|wholename|regex) [^ ]+ )*-delete( |$)|^rsync( [^ ]+){0,16}? --del[a-z-]*( [^ ]+){0,16}? (/+|(~[A-Za-z0-9._-]*|\$HOME|\$\{HOME\}|(/+(System/+Volumes/+Data|private))?(/+var)?/+(home|Users)(/+[^/ ]+)?|(/+private)?(/+var)?/+root)/*)\.?$'
    reason: recursive delete of root or home
    remedy: Delete only the project's own paths, named in full; a person deletes anything at / or the home directory themselves.
    rationale: Irrecoverable data loss.
  - id: TK-D014
    class: shell
    # a system folder itself: /etc, /usr, /var, /bin, /sbin, /lib, /lib64, /boot, /opt, /srv, macOS's /System,
    # /Library, /Applications and /private/etc or /private/var, and C:\Windows (C:/, /c/), in any case (macOS's and
    # Windows' file systems ignore it), under a root spelled with extra slashes, `/./` or one `<folder>/../` step
    # (/usr/../etc), with a trailing / or /. or a pattern holding a `*` (`/etc/*`, `/etc/.*`, `/etc/*/*`); a folder
    # inside one (/var/tmp/x, /usr/local) isn't one. Denied: rm -r of one (the option before or after it among up to
    # 16 other words, or before it among any number of plain words, as TK-D004 reads a home); find with -delete on
    # one with no filter but depth and type or one that matches every file, as TK-D004 reads a home, so
    # `find /var -name '*.log' -delete` isn't; git clean in one (-C, --work-tree) or of one; chmod -R or chown -R of
    # one or of /. Each command on its own (sudo, env and sh -c read through), anchored, so a message or a search that
    # names `rm -rf /etc` isn't one. The ending after a folder and the plain words are each one class run, and the
    # runs before a name are lazy: the fallback engine backs off a repeated group, or a greedy run before a list of
    # names, in time that grows with the square of its length
    pattern: '^rm(( [^ ]+){0,16}?| [-A-QS-Za-qs-z ]*?) (-[A-Za-z]*[rR][A-Za-z]*|--rec[a-z]*)(( [^ ]+){0,16}?| [-A-Za-z ]*?) (/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?)( |$)|^rm( [^ ]+){0,16}? (/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?)( [^ ]+){0,16}? (-[A-Za-z]*[rR][A-Za-z]*|--rec[a-z]*)( |$)|^find (-[EHLPXdsx]+ |-O[0-9]* |-D( [^ ]*|[^ ]+) ){0,8}((-[EHLPXdsx]*f ?)?[^-(! ][^ ]* ){0,8}(-[EHLPXdsx]*f ?)?(/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?) ((-[EHLPXdsx]*f ?)?[^-(! ][^ ]* ){0,8}(-(mindepth|maxdepth) [0-9]+ |-(depth|d|xdev|mount|true|print0?) |-type [a-z,]+ |-i?(name|path|wholename) \* |-i?regex \.\* |-size \+0[bckwMG]? |(!|-not) -i?(name|path|wholename|regex) [^ ]+ )*-delete( |$)|^git( [^ ]+){0,8}? (-C |--work-tree[= ])(/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?)( [^ ]+){0,8}? clean( |$)|^git( [^ ]+){0,8}? clean( [^ ]+){0,16}? (/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?)( |$)|^ch(mod|own)( [^ ]+){0,16}? (-[A-Za-z]*R[A-Za-z]*|--rec[a-z]*)( [^ ]+){0,16}? (/([/.]*|[/.?]*\*[/.?*]*)|/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?)( |$)|^ch(mod|own)( [^ ]+){0,16}? (/([/.]*|[/.?]*\*[/.?*]*)|/(([/.]*?/)?|([/.]*?/)?[^/ .][^/ ]*/+\.\./([/.]*?/)?)(([Pp][Rr][Ii][Vv][Aa][Tt][Ee]/+)?([Ee][Tt][Cc]|[Vv][Aa][Rr])|[Uu][Ss][Rr]|[Ss]?[Bb][Ii][Nn]|[Ll][Ii][Bb](64)?|[Bb][Oo][Oo][Tt]|[Oo][Pp][Tt]|[Ss][Rr][Vv]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ll][Ii][Bb][Rr][Aa][Rr][Yy]|[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss])(/[/.]*|[/.?]*\*[/.?*]*)?|(/+[Cc]|[Cc]:)[\\/]+[Ww][Ii][Nn][Dd][Oo][Ww][Ss]([\\/][\\/.]*|[\\/.?]*\*[\\/.?*]*)?)( [^ ]+){0,16}? (-[A-Za-z]*R[A-Za-z]*|--rec[a-z]*)( |$)'
    reason: recursive delete or permission change of a system folder
    remedy: Delete or change only the project's own paths, named in full; a person changes system folders themselves.
    rationale: A system folder holds the operating system and its configuration; deleting it or locking it breaks the machine, as deleting root does.
  - id: TK-D010
    class: shell
    field: target
    # each command (a wrapper's or a nested shell's too) and each redirection target on its own, anchored and lazy, so
    # the fallback engine stays linear: cp, mv or install with a credentials file last, tee with one among its files,
    # or a redirection into one (a read redirected from one, `< .env`, too: the target doesn't say which way it goes).
    # Every .env variant, templates included: a whole command can name several files, so no `unless` here. A suffix
    # after `.env` (`.env.local`) only on a file named so: after any prefix too (`a.env.env…`), it would rescan
    pattern: '^(cp|mv|install)( [\w\W]*?)?[ /]([^ /]*?(\.env|id_rsa|id_ed25519|id_ecdsa|authorized_keys2?)|\.env\.[A-Za-z0-9._-]+|\.aws/(credentials|config)|\.ssh/(config|rc))$|^tee( [\w\W]*?)?[ /]([^ /]*?(\.env|id_rsa|id_ed25519|id_ecdsa|authorized_keys2?)|\.env\.[A-Za-z0-9._-]+|\.aws/(credentials|config)|\.ssh/(config|rc))( |$)|^([^ =]*?/)?([^ /=]*?(\.env|id_rsa|id_ed25519|id_ecdsa|authorized_keys2?)|\.env\.[A-Za-z0-9._-]+|\.aws/(credentials|config)|\.ssh/(config|rc))$'
    reason: writing to a credentials file from the shell
    remedy: Write a template with placeholders (.env.example) with the file-editing tool, not the shell, and read real values from the environment; a person fills in credential files.
    rationale: The shell twin of TK-D005. Redirects, tee, cp and mv reach the same files the file-editing tools are blocked from.
  - id: TK-D011
    class: shell
    field: line
    # a cluster, Docker, gcloud or Git credential file only as a source sent to a remote (scp or rsync with a host:
    # word after it) or a curl/wget upload or body (`@`, -T), so fetching a kubeconfig into place isn't one
    # scp, rsync, curl or wget naming the .ssh or .aws folder itself (scp -r ~/.ssh), a file in .ssh or a private key
    # (id_rsa, id_ed25519, id_rsa_work): a word that ends where a word does, and not in .pub, so a public key
    # (id_rsa.pub, id_ed25519-cert.pub) may go
    pattern: '\b(cat|tar|zip|base64|gzip|xxd)\b[^\n]*((\.ssh([*?\[][^\s''";|&)<>]*|/([^\s''";|&)<>]*([^\s''";|&)<>b]|[^\s''";|&)<>u]b|[^\s''";|&)<>p]ub|[^\s''";|&)<>.]pub)|b|ub|pub)?)?|id_(rsa|ed25519|ecdsa|dsa)([^\s''";|&)<>]*([^\s''";|&)<>b]|[^\s''";|&)<>u]b|[^\s''";|&)<>p]ub|[^\s''";|&)<>.]pub)|b|ub|pub)?)([\s''";&)<>][^\n]*)?|(\.aws|\.netrc|/etc/shadow|/proc/[^\s/]+/environ\b|/etc/passwd|\.kube/config|\.docker/config\.json|gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db|legacy_credentials)|\.git-credentials)[^\n]*)\|\s*(curl|nc|ncat|socat|wget|gh\s+gist\s+create)\b|\b(scp|rsync|curl|wget|gh\s+gist\s+create)\b[^\n]*(\.ssh([*?\[][^\s''";|&)<>]*|/([^\s''";|&)<>]*([^\s''";|&)<>b]|[^\s''";|&)<>u]b|[^\s''";|&)<>p]ub|[^\s''";|&)<>.]pub)|b|ub|pub)?)?([\s''";|&)<>]|$)|id_(rsa|ed25519|ecdsa|dsa)([^\s''";|&)<>]*([^\s''";|&)<>b]|[^\s''";|&)<>u]b|[^\s''";|&)<>p]ub|[^\s''";|&)<>.]pub)|b|ub|pub)?([\s''";|&)<>]|$)|\.aws/?([\s''";|&)<>]|$)|\.aws/credentials|\.netrc|--post-file[ =]/etc/(passwd|shadow))|\b(scp|rsync)\s[^\n]*?(\.kube/config|\.docker/config\.json|gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db|legacy_credentials)|\.git-credentials)\b[^\n]*?\s\S*:|\b(curl|wget)\s[^\n]*?(@|-T ?|--upload-file[ =]|--(post|body)-file[ =])\S*?(\.kube/config|\.docker/config\.json|gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db|legacy_credentials)|\.git-credentials)'
    reason: sending credential files off the machine
    remedy: Keep keys and cloud credentials on the machine; a person shares access through the deployment's secret store.
    rationale: Keys and cloud credentials leaving the host are exfiltration. TK-D006 covers .env files.
  - id: TK-D006
    class: shell
    field: line
    # .env in any case (macOS and Windows ignore it); a read of it piped into an upload or a new gist, sent as a
    # network command's file or body (`$(cat .env)` too), or a gist of it; the whole environment (env, printenv or
    # export -p where a command starts, or after a wrapper such as command, nohup or timeout, with flags but no
    # command) piped into an upload in the same pipeline, alone or through up to two stages that pass its text on (an
    # encoder, a compressor, a filter; not `wc`), or `$(env)` in a network command's arguments
    pattern: '(^|[;&|(!]|\b(then|do|else)\s)\s*([A-Za-z_][A-Za-z0-9_]*=[^\s;&|]*\s+)?((command|nohup|time|nice|timeout|sudo|doas|setsid|stdbuf|exec|builtin|busybox)(\s+(-[^\s;&|]*|[0-9][^\s;&|]*))?(\s+(-[^\s;&|]*|[0-9][^\s;&|]*))?\s+)?([^\s|;&(){}`]{0,256}/)?(env|printenv|export\s+-p)(\s+((-u|-C|--unset|--chdir)\s+[^\s;&|]+|[-0-9][^\s;|]*))?(\s+((-u|-C|--unset|--chdir)\s+[^\s;&|]+|[-0-9][^\s;|]*))?(\s+((-u|-C|--unset|--chdir)\s+[^\s;&|]+|[-0-9][^\s;|]*))?(\s+((-u|-C|--unset|--chdir)\s+[^\s;&|]+|[-0-9][^\s;|]*))?\s*(\|\s*([^\s|;&(){}`]{0,256}/)?(base64|gzip|bzip2|xz|zstd|xxd|od|openssl|cat|tee|sort|uniq|grep|egrep|head|tail|sed|awk|tr|cut)\b[^\n;&|]*)?(\|\s*([^\s|;&(){}`]{0,256}/)?(base64|gzip|bzip2|xz|zstd|xxd|od|openssl|cat|tee|sort|uniq|grep|egrep|head|tail|sed|awk|tr|cut)\b[^\n;&|]*)?\|\s*(command\s+|[^\s|;&(){}`]{0,256}/)?(curl|wget|nc|ncat|netcat|socat|gh\s+gist\s+(create|new))\b|\b(curl|wget|https?|nc|ncat|scp|rsync)\s[^\n;&|]*\$\(\s*([^\s|;&(){}`]{0,256}/)?(env|printenv|export\s+-p)\s*\)|\b(cat|base64|xxd|gzip)\s[^|\n]*?\.[Ee][Nn][Vv]\b[^\n]*\|\s*(curl|wget|nc|ncat|gh\s+gist\s+(create|new))\b|\b(curl|wget|https?|nc|ncat|scp|rsync)(\s[^\n]*)?(@\S*\.[Ee][Nn][Vv]\b|--data[-a-z]*[ =]@?\S*\.[Ee][Nn][Vv]\b|--upload-file\s+\S*\.[Ee][Nn][Vv]\b|--(post|body)-file[ =]\S*\.[Ee][Nn][Vv]\b|\s\S*\.[Ee][Nn][Vv]\s+\S+:|<\s*\S*\.[Ee][Nn][Vv]\b|\$\((cat\s|base64\s|<)[^)\n]*?\.[Ee][Nn][Vv]\b)|\bgh\s+gist\s+(create|new)\b[^\n]*?\s\S*\.[Ee][Nn][Vv]\b'
    reason: uploading a secrets file or the environment
    remedy: Send only the values the request needs, never the .env file; a person shares secrets through the deployment's secret store.
    rationale: Sending .env off the machine is exfiltration.
  - id: TK-D022
    class: fs
    tool: LibraryUpload
    field: path
    # an upload tool's file (CodeBuddy Code's LibraryUpload sends the local file at its path to its library), each
    # path form as the file rules read it: the files TK-D006 and TK-D011 deny sending from the shell. A .env file (any
    # name with `.env` as a word, as TK-D006 reads it), the .ssh folder or a file in it, a private key (id_rsa,
    # id_ed25519, id_ecdsa, id_dsa, and a name going on from one: id_rsa_work), the .aws folder or its credentials,
    # .netrc, and a cluster, Docker, gcloud or Git credential file; a public key (.pub) may go, as there. A key's file
    # name is read up to NAME_MAX (255) after its id_<type>, which keeps the fallback engine linear
    pattern: '\.env\b|(^|/)\.ssh(/|$)|id_(rsa|ed25519|ecdsa|dsa)[^/]{0,255}$|(^|/)\.aws/?$|\.aws/credentials|\.netrc|(^|/)\.kube/config$|(^|/)\.docker/config\.json$|gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db|legacy_credentials)|(^|/)\.git-credentials$'
    unless: '(^|/)\.ssh/[^/]{0,255}\.pub$|id_(rsa|ed25519|ecdsa|dsa)[^/]{0,255}\.pub$'
    reason: uploading a secrets file
    remedy: Upload only the files the task needs, never a credentials file; a person shares secrets through the deployment's secret store.
    rationale: The upload tool twin of TK-D006 and TK-D011. A file an upload tool sends off the machine is as gone as one curl or scp sends.
  - id: TK-D008
    class: shell
    field: effects
    # each file a command writes or deletes, as TK-F015 reads them, so a listing, a read or text that names the
    # folders isn't held: one in Claude Code's, Codex's or Gemini CLI's transcript folder, OpenCode's sessions (its
    # data folder's opencode*.db, and storage/ before it), or a delete of a home folder holding them (~/.claude,
    # ~/.local/share; a home is ~, $HOME or an absolute /home/<u>, /Users/<u> or /root, so a project's .claude, or a
    # repo's build/home/u/.claude, isn't one). MAY_WRITE: any word, herestring or heredoc on a line whose writer gets
    # its files at run time (xargs rm, rm "$f") or in code it runs (docker exec c sh -c, perl -e, osascript, at from a
    # pipe), or whose commands the parser can't read (| sh, fish -c) with a writer's name or > in it, and a link ln or
    # cp -s/-l makes; a script the line writes, then runs, is read as that inline code, and may write each word the run
    # gives it. Anchored and lazy, so the fallback engine stays linear
    pattern: '^(?:WRITE_TARGET|DELETE_TARGET|MAY_WRITE):[\w\W]*?(?:\.claude[/\\]projects|\.codex[/\\]sessions|\.gemini[/\\]tmp|(?:\.local[/\\]share|XDG_DATA_HOME\}?)[/\\](?:opencode|kilo)[/\\](?:storage(?:[/\\]|$)|(?:opencode|kilo)[^/\\]*\.db))|^DELETE_TARGET:(?:(?:~|\$\{?HOME\}?|(?:[a-z]:)?[/\\]+(?:private[/\\]+)?(?:var[/\\]+)?(?:(?:home|users)[/\\]+[^/\\]+|root))[/\\]+(?:\.claude|\.codex|\.gemini|\.local(?:[/\\]share(?:[/\\](?:opencode|kilo))?)?)|\$\{?XDG_DATA_HOME\}?(?:[/\\](?:opencode|kilo))?)[/\\]*\*?$'
    # not Claude Code's memory notes beside its transcripts (a .md file directly in a project's memory/, as TK-D009
    # reads them), which the agent writes and deletes; a link made there (MAY_WRITE) is still held
    unless: '^(?:WRITE_TARGET|DELETE_TARGET):(?:[\w\W]*?[/\\])?\.claude[/\\]projects[/\\][^/\\]+[/\\]memory[/\\][^/\\]+\.md$'
    reason: modifying the agent harness's transcripts
    remedy: Leave the harness's transcripts as they are (reading them is fine); a person removes them once the run's evidence is exported.
    rationale: Transcripts are evidence; the agent has no reason to write them. Reading them is allowed.

  # --- files ---
  - id: TK-D005
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(\.env(\.[A-Za-z0-9._-]+)?|id_rsa|id_ed25519|credentials)$|(^|/)\.ssh/|(^|/)\.aws/'
    unless: '(^|/)\.[Ee][Nn][Vv]\.([Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])$'
    reason: writing to a credentials file
    remedy: Write a template with placeholders (.env.example) instead; a person fills in the real credentials file.
    rationale: Credential files are high-value and rarely a legitimate agent target.
  - id: TK-D009
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(\.claude/projects|\.codex/sessions|\.gemini/tmp|\.config/(opencode|kilo)|\.local/share/(opencode|kilo)/storage)/|(^|/)\.local/share/(opencode|kilo)/(opencode|kilo)[^/]*\.db'
    # Claude Code keeps the agent's own memory notes beside its transcripts: those it may write
    unless: '(^|/)\.claude/projects/[^/]+/memory/[^/]+\.md$'
    reason: writing to the agent harness's transcripts
    remedy: Write notes in the project or the agent's memory folder; the harness's transcripts stay as it wrote them.
    rationale: Same as TK-D008, for the file-editing tools.

  # --- harness self-protection ---
  - id: TK-D007
    class: shell
    field: tracekit
    # what a command does to Tracekit's own files and signer (engine._tracekit), not where its names appear. ACT (a
    # command that isn't on the read or list allowlists, or a cd before one) denies on every Tracekit location: the
    # dev signer's data and runtime dirs (signer/service.py dev_data_dir, sdk/autospawn.py runtime_dir), the system
    # dirs, the client and v1 signer homes and the installed package; and stopping or starting the signer (kill,
    # pkill, systemctl, launchctl, `tracekit signer`, `python -m tracekit.signer`). Allowlists (#589), one word each:
    # a READ (cat, head, tail, grep, sed -n without -i or -I, jq printing to the terminal or a filter) only of the
    # installed package or /etc/tracekit's client.json and policy files; a DEEP read (grep -r, a pattern, output that
    # goes on to a file, a substitution, xargs or a loop, a cd before reads) only of the installed package; a LIST
    # (ls, stat, test, find without an action) of anything but a runtime dir, the homes or a keys dir. Code that
    # imports the signer's modules acts unless it reaches only the names engine._runs_signer allows, and so does code
    # that reaches the dev signer's data or lifecycle through the SDK (autospawn, dev_data_dir: engine._reaches_sdk). A
    # loop's words, a relative path after a cd or env -C, a kill of what pgrep, pidof or ps finds as the signer, and a
    # shell script the line writes, then runs, count as what the line's commands name. Not text a
    # command only writes into another file (#423). A help or version request is exempt, as `python -m tracekit.<module>
    # --help`, and so are `tracekit signer vkey` and `trust`, which only print or write the public keys (the docs' and
    # `tracekit report`'s `tracekit signer trust -o trust.json`); trust's -o is a write target of its own, denied under
    # Tracekit's dirs
    pattern: '^ACT:[\w\W]*?(?:/var/lib/tracekit|Library/Application Support/tracekit|\.local/share/tracekit|XDG_DATA_HOME\}?/tracekit|xdg_data_home\}?/tracekit|AppData[/\\]Local[/\\]tracekit|[A-Za-z]:[A-Za-z0-9._-]*appdatalocaltracekit|LOCALAPPDATA%?[/\\]?tracekit|localappdata%?[/\\]?tracekit|/run/tracekit|/run/user/[0-9]+/tracekit|/tmp/(tracekit|tk)-[0-9]+|XDG_RUNTIME_DIR\}?/tracekit|xdg_runtime_dir\}?/tracekit|Library/Application Support/tracekit/run|AppData[/\\]Local[/\\]tracekit[/\\]run|LOCALAPPDATA%?[/\\]?tracekit[/\\]run|localappdata%?[/\\]?tracekit[/\\]run|[A-Za-z]:[A-Za-z0-9._-]*appdatalocaltracekitrun|/etc/tracekit|(site|dist)-packages[/\\]tracekit([/\\ ]|$)|\.tracekit-signer|\.tracekit-client|\btracekitd\b|\btracekit\s+signer\b|-m ?tracekit\.(daemon|proxy|signer)\b|\b(pkill|killall|kill)\b[^\n]*tracekit|\bsystemctl\s+(stop|disable|kill|mask)\s+tracekit|\blaunchctl\s+(bootout|unload|stop|remove|kill|disable)\b[^\n]*tracekit)|^(?:READ|DEEP):[\w\W]*?(?:/var/lib/tracekit|Library/Application Support/tracekit|\.local/share/tracekit|XDG_DATA_HOME\}?/tracekit|xdg_data_home\}?/tracekit|AppData[/\\]Local[/\\]tracekit|[A-Za-z]:[A-Za-z0-9._-]*appdatalocaltracekit|LOCALAPPDATA%?[/\\]?tracekit|localappdata%?[/\\]?tracekit|/run/tracekit|/run/user/[0-9]+/tracekit|/tmp/(tracekit|tk)-[0-9]+|XDG_RUNTIME_DIR\}?/tracekit|xdg_runtime_dir\}?/tracekit|Library/Application Support/tracekit/run|AppData[/\\]Local[/\\]tracekit[/\\]run|LOCALAPPDATA%?[/\\]?tracekit[/\\]run|localappdata%?[/\\]?tracekit[/\\]run|[A-Za-z]:[A-Za-z0-9._-]*appdatalocaltracekitrun|/etc/tracekit|(site|dist)-packages[/\\]tracekit([/\\ ]|$)|\.tracekit-signer|\.tracekit-client)|^LIST:[\w\W]*?(?:/run/tracekit|/run/user/[0-9]+/tracekit|/tmp/(tracekit|tk)-[0-9]+|XDG_RUNTIME_DIR\}?/tracekit|xdg_runtime_dir\}?/tracekit|Library/Application Support/tracekit/run|AppData[/\\]Local[/\\]tracekit[/\\]run|LOCALAPPDATA%?[/\\]?tracekit[/\\]run|localappdata%?[/\\]?tracekit[/\\]run|[A-Za-z]:[A-Za-z0-9._-]*appdatalocaltracekitrun|\.tracekit-signer|\.tracekit-client|(?:/var/lib/tracekit|Library/Application Support/tracekit|\.local/share/tracekit|XDG_DATA_HOME\}?/tracekit|xdg_data_home\}?/tracekit|AppData[/\\]Local[/\\]tracekit|[A-Za-z]:[A-Za-z0-9._-]*appdatalocaltracekit|LOCALAPPDATA%?[/\\]?tracekit|localappdata%?[/\\]?tracekit)[^\s]*?key)|^SIGNER_MODULE:'
    unless: '^ACT:(?:tracekit|(?:pyw?|pypy|pythonw?)[0-9.]*t? (?:-[^ ]+ +)*-m ?tracekit(?:\.[a-z_.]+)?)(?: [^ ]+)* --help$|^ACT:tracekit --version$|^ACT:(?:tracekit|(?:pyw?|pypy|pythonw?)[0-9.]*t? (?:-[^ ]+ +)*-m ?tracekit) signer (?:vkey|trust)(?: [^ ]+)*$|^READ:(?:[^\s]*(?:site|dist)-packages[/\\]tracekit(?:[/\\][^\s]*)?|(?:/private)?/etc/tracekit[/\\](?:client\.json|policy[\w.-]*\.ya?ml))$|^DEEP:[^\s]*(?:site|dist)-packages[/\\]tracekit(?:[/\\][^\s]*)?$'
    reason: touching Tracekit's own files or signer
    remedy: Leave Tracekit's files, signer and policy alone; a person changes them through the signer's own configuration.
    rationale: The audit trail must not be modified by the audited agent. Ownership already blocks this in system mode; the rule makes the attempt visible and blocks it in dev mode too.
  - id: TK-D013
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(etc/tracekit|var/lib/tracekit[^/]*|run/tracekit|\.tracekit-signer|\.tracekit-client|[Ll]ibrary/[Aa]pplication [Ss]upport/tracekit|\.local/share/tracekit|run/user/[0-9]+/tracekit(-[0-9a-f]+)?|tmp/(tracekit|tk)-[0-9]+([-.][0-9a-f]+){0,2}|(site|dist)-packages/tracekit)(/|$)|/[Aa]pp[Dd]ata/[Ll]ocal/tracekit(/|$)'
    reason: writing Tracekit's own files, signer state or policy
    remedy: Leave Tracekit's files, signer state and policy alone; a person changes them through the signer's own configuration.
    rationale: The file-editing twin of TK-D007; /etc/tracekit holds the signer config and policy, the dev data dir its keys and store, the installed package the code that decides and signs.
  - id: TK-D012
    class: shell
    # each command's argv (wrappers and runners such as uvx, uv tool run, pipx run, hatch run and conda run, `sh -c`,
    # `eval` and a path to the binary resolved): `tracekit approve|reject`, `tracekit approvals [OPTIONS]
    # approve|reject` (with --grant too) and every `tracekit grant` whatever follows it: a grant releases calls like an
    # approval, and an agent needs no grant command (listing or revoking included), so its options and action aren't
    # read at all and no spelling of them (an argparse prefix of --signer, a repeated or spaced value, an action from
    # stdin or computed) gets past; also as `python -m tracekit[.cli]` (python,
    # pythonw, py, pyw or pypy, with a version and a free-threaded build's `t`; up to eight options, with a value, before -m; or -Im) or a runner's module (`uv run -m
    # tracekit.cli`), and after a `--` (Python 3.14's argparse takes one before the command); the parser also reads
    # python's argv itself (any options, a module runner: runpy, trace --module, cProfile -m; a path to the entry
    # script) and gives such a run as the tracekit command (shell.py's _python_runs). The hold line names these
    # commands for a person, and the agent reads it too: the dev signer takes the agent's own answer, labelled
    # self_approved. Listing and showing approvals aren't held. The action is the word after `approvals` and its
    # options (--signer, `--`); after an option `[\w\W]*?` crosses a --signer path with a space in it, so `approvals
    # --signer S show approve` is denied too (the joined argv can't tell it from a path with ` show` in it). An action
    # the parser can't read, as the word after tracekit or after approvals and its options (crossed so too: `--signer
    # "/tmp/a list" "$1"`), is denied too: a positional parameter it doesn't follow (into eval's or `sh -c`'s text,
    # past `set --`), an indirect expansion (${!#} is the last one, ${!1} the variable $1 names), a substitution's
    # output, a pattern (a file named approve) or an expansion with a word (one whose readings pass the parser's cap,
    # shell.MAX_READINGS, is unread) may be approve. After an option, any such word denies, as the joined argv can't
    # tell an option's value or the words after `list` or `show` from the action. So does a variable alone as the
    # word after tracekit or approvals that the line gives no value there (one the environment, read, a substitution
    # or bash itself gives: $_, $OPTARG, $REPLY; engine.UNKNOWN_WORD in argv's third subject; each literal the line
    # gave it is read too, shell.py's maybe); a loop's variable is read as its words. Anchored and lazy, so the
    # fallback engine stays linear
    # lean: a tripwire, as TK-D007: code that calls approval_decide itself (python -c, a script, a copy or link of the
    # entry script an earlier call made, run under another name; one the same call makes is read as tracekit, by
    # shell.py's _tracekit_copies) isn't read, nor an action from stdin (`xargs tracekit`), a
    # value the parser makes of a literal with an operator other than a default, alternate or replacement (`D=xapprove; tracekit ${D#x}
    # ID` is read as written and empty), a variable the line gives no literal as the action after approvals' options
    # (`--signer /tmp/s "$A"`: the joined argv can't tell it from --signer's value), an unquoted --signer value bash splits into a value and an action (`--signer
    # $1 list` with $1 `s approve`), a runner's own options before its subcommand (`uv -q run`) or a runner
    # policy2/shell.py doesn't name (`hatch env run`); when that must hold too, run system mode, whose signer
    # refuses the agent's own answer. (A wrapper's option its table doesn't know is read both ways: `uvx -qc c.txt
    # tracekit` is read.)
    # Friction: an approvals command with an option and such a word anywhere after it (`--signer "$1" list`, `--signer
    # "${S:-/tmp/s}" list`) is denied, and so is a variable as the action where the line also uses it unknown (`for c
    # in a b; do tracekit $c; done; echo $c`: the parser's unresolved names are the line's); use a literal path, or a
    # person runs it
    pattern: '^(tracekit|(pyw?|pypy|pythonw?)[0-9.]*t? (-[^ ]+ +([^- ][^ ]* +)?){0,8}-[A-Za-z]*m ?tracekit)(\.cli|\.__main__)?( --)? ((approve|reject|approvals( --[\w\W]*?)? (approve|reject)|grant)( |$)|(approvals( --[\w\W]*?)? )?([^ -][^ ]*)?(\$\{?[0-9@*]|\$\{!|\$\(|`|[*?\[]|\$\{[\w@*#?$!-]+(\[[^] ]*\])?:?[-=+/])|(approvals )?\$\x7f( |$))'
    reason: answering an approval or issuing a grant from the agent's session
    remedy: Leave answering held calls and granting calls to a person at their own terminal; `tracekit approvals list` and `show` stay allowed.
    rationale: An approval is a person's decision; an agent that answers its own held calls turns every ask into an allow.
  - id: TK-D020
    class: shell
    field: argv
    # security's global options (-q, -v, -p prompt …) may come before its command; `security export` exports every
    # item but with -t certs or pubKeys (unless), which hold no secret; `pass grep` and `gopass grep` decrypt every
    # entry
    pattern: '^security( -[hilqv]+| -p [^-\s]\S*)* (dump-keychain|export)\b|^secret-tool\s+search\b[^\n]*?--all\b|^(pass|gopass)\s+grep\b'
    unless: '^security( -[hilqv]+| -p [^-\s]\S*)* export( [^\n]*)? -t ?(certs|pubKeys)( |$)'
    reason: dumping an entire operating-system credential store
    remedy: Look up only the one credential the task needs; a person exports a whole credential store themselves.
    rationale: A whole-store export exposes credentials unrelated to the task; a person must authorize it.
  - id: TK-D021
    class: shell
    field: argv
    # a URL in any case, also as a PEP 508 direct reference (`name @ https://…`); a version-control source, npm's
    # github: shorthand among them, is TK-A028's (ask)
    pattern: '^(pip3?|python3?\s+-m\s+pip|uv(\s+pip)?|pipx|poetry|npm|pnpm|yarn|bun|gem|cargo)\s+(install|add|get)\s+(?:(--no-deps|--pre|--user|--upgrade|--force-reinstall|--editable|--save|--global|--force)\s+)*([^\s@]+\s?@\s?)?[Hh][Tt][Tt][Pp][Ss]?://'
    reason: installing a package directly from a URL
    remedy: Install the package by name from the configured index; a person adds a URL source after reviewing it.
    rationale: A URL bypasses the configured package source and can install unreviewed code.

ask:
  - id: TK-A063
    tool: '^ipython$'
    pattern: '^'
    reason: running Python in gptme's IPython kernel
    remedy: Have a person review and approve the Python code.
    rationale: Shell rules cannot determine the effects of code executed in the Python kernel.
  - id: TK-A064
    tool: '^Bash$'
    field: gptme_tmux_input
    pattern: '^true$'
    reason: sending keys to an existing gptme tmux pane
    remedy: Have a person review the input, or start a new session with the complete command.
    rationale: Existing input and the program in the pane can change what the keys do.
  - id: TK-A065
    tool: '^mcp__gptme__load$'
    pattern: '^'
    reason: loading an MCP server through gptme
    remedy: Have a person review and approve the server configuration.
    rationale: Loading a server can start a subprocess or connect to a remote server.
  - id: TK-A046
    class: shell
    field: code
    # curl or wget where a command starts (the line's start or after a separator, as TK-A040 reads its client; after
    # up to four keywords, assignments or wrappers such as then, time -p, env, nice -n 5, timeout 5, sudo; by a path
    # too), piped, through up to four more stages (base64 -d, tee), into an interpreter (a path, sudo, env and a
    # versioned python too) whose own words give it inline code (-c, -e) or a script: a word that is no option.
    # `python3 -m json.tool` only pretty-prints, so json.tool is no script (the alternatives spell every other word)
    pattern: '(^|[|;&({!`]\s*)((then|do|else|if|elif|while|until|time|exec|command|builtin|nohup|env|nice|timeout|stdbuf|sudo|doas)(\s(-[^\s]*|[0-9][^\s]*|[A-Za-z_][A-Za-z0-9_]*=[^\s]*))*\s+|[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}([^\s|;&(){}`]{0,256}/)?(curl|wget)[^|;&\n]*(\|[^|;&\n]+){0,4}?\|\s*(sudo\s+)?((?:/[A-Za-z0-9._+-]{1,64}){0,8}/?env\s+)?(?:/[A-Za-z0-9._+-]{1,64}){0,8}/?((ba|z|da)?sh|python[0-9.]*|perl|ruby|node)(\s[^\s;&|]*)*?\s((-c|-e|--eval|--execute)(\s|$)|([^-\s;&|)j][^\s;&|)]*|j([^\s;&|)s][^\s;&|)]*|s([^\s;&|)o][^\s;&|)]*|o([^\s;&|)n][^\s;&|)]*|n([^\s;&|).][^\s;&|)]*|\.([^\s;&|)t][^\s;&|)]*|t([^\s;&|)o][^\s;&|)]*|o([^\s;&|)o][^\s;&|)]*|o([^\s;&|)l][^\s;&|)]*|l[^\s;&|)]+)?)?)?)?)?)?)?)?)(\s|$))'
    reason: downloaded data passed to an interpreter
    remedy: Have a person check what the interpreter does with the downloaded input before approving it.
    rationale: Inline code and script paths can execute downloaded input in ways the policy cannot determine from the command.
  - id: TK-A054
    class: shell
    # each command's argv: removing or stopping Tracekit as a person would, `tracekit uninstall`, `down` or `up
    # --replace`, which stops the running signer first (also as `python -m tracekit`, as TK-D012 reads it), uninstalling
    # its package with pip, uv (pip, tool or a project's remove), pipx or poetry, its Claude Code plugin's uninstall or
    # disable, and a user service's stop, after any number of options. Held, not denied, so a person who means it
    # approves it; TK-D007 denies touching the signer's files or process directly
    pattern: '^(tracekit|(pyw?|pypy|pythonw?)[0-9.]*t? (-[^ ]+ +([^- ][^ ]* +)?){0,8}-[A-Za-z]*m ?tracekit)(\.cli|\.__main__)?( --)? (uninstall|down|up( [^ ]+)*? --replace)( |$)|^(pip[0-9.]*|(pyw?|pypy|pythonw?)[0-9.]*t? -m pip|uv( pip| tool)?|pipx|poetry) (-[^ ]+ +)*(uninstall|remove|rm)( [\w\W]*?)? [Tt][Rr][Aa][Cc][Ee][Kk][Ii][Tt]([-_.][Aa][Ii])?( |$)|^claude (-[^ ]+ +)*plugins? (-[^ ]+ +)*(uninstall|disable|remove|rm)( [\w\W]*?)? tracekit(@[^ ]*)?( |$)|^systemctl (-[^ ]+ +)*(stop|disable|kill|mask) ([\w\W]*? )?tracekit'
    reason: removing or stopping Tracekit
    remedy: Have a person approve the held call if they mean to remove or stop Tracekit; the agent's own work has no need to.
    rationale: Uninstalling Tracekit's hooks, package or plugin, or stopping its signer, ends the record of what the agent does next; a person confirms it, where a deny would leave a person working through the agent no way to.
  - id: TK-A057
    class: shell
    # each command's argv, as TK-A054 reads `tracekit uninstall` (also as `python -m tracekit[.cli]`): `tracekit
    # init` run by the agent, which rewrites Tracekit's hooks (`--no-hooks` takes them out of the agent's settings)
    # lean: `tracekit init --help` is held too: the joined argv can't tell a last word `--help` from a quoted value
    # ending in ` --help`, with which init still runs; exempt it if the engine ever matches argv word by word
    pattern: '^(tracekit|(pyw?|pypy|pythonw?)[0-9.]*t? (-[^ ]+ +([^- ][^ ]* +)?){0,8}-[A-Za-z]*m ?tracekit)(\.cli|\.__main__)?( --)? init( |$)'
    reason: running Tracekit's setup from the agent's session
    remedy: Have a person run tracekit init from their own terminal; it changes Tracekit's hooks.
    rationale: Init rewrites the hooks that record the agent; a person confirms it, as for removing Tracekit (TK-A054).
  - id: TK-A020
    class: fs
    tool: Read|Grep
    field: path
    # in lower case: the path is also matched casefolded, and macOS and Windows ignore case
    pattern: '(^|/)\.password-store(/|$)|(^|/)library/keychains(/|$)|(^|/)\.local/share/keyrings(/|$)|(^|/)\.gnupg/private-keys-v1\.d/[^/]+\.key$|(^|/)\.mozilla/firefox/[^/]+/(logins\.json|key4\.db|cookies\.sqlite)$|(^|/)library/application support/firefox/profiles/[^/]+/(logins\.json|key4\.db|cookies\.sqlite)$|^[a-z]:/users/[^/]+/appdata/roaming/mozilla/firefox/profiles/[^/]+/(logins\.json|key4\.db|cookies\.sqlite)$|(^|/)\.config/(google-chrome|chromium|bravesoftware/brave-browser|microsoft-edge)/[^/]+/(login data|cookies|web data|network/cookies)$|(^|/)library/application support/(google/chrome|chromium|bravesoftware/brave-browser|microsoft edge)/[^/]+/(login data|cookies|web data|network/cookies)$|^[a-z]:/users/[^/]+/appdata/local/(google/chrome|microsoft/edge|bravesoftware/brave-browser)/user data/[^/]+/(login data|cookies|web data|network/cookies)$'
    reason: reading an operating-system or browser credential store
    remedy: Wait for a person to approve the held read, or ask the person for the one credential the task needs.
    rationale: A targeted read can disclose saved logins or private keys; hold it for a person. Listing and unrelated files remain allowed.
  - id: TK-A021
    class: shell
    field: target
    # security's global options may come before its command; `pass NAME` shows NAME as `pass show NAME` does, so every
    # pass command but those that don't decrypt an entry (`unless`; grep is TK-D020's); ssh-add's -L anywhere in a
    # cluster (-qL, -Lq). Paths in lower case: the target is also matched casefolded
    pattern: '^(security( -[hilqv]+| -p [^-\s]\S*)* (find-generic-password|find-internet-password)|secret-tool\s+(lookup|search)|kwallet-query|ssh-add(\s+-[^\sL]+(\s+[^-\s]\S*)?){0,8}\s+-[A-KM-Za-z]*L[A-Za-z]*)\b|^pass\s+\S|^(cat|sqlite3)\b.*?(?:\.mozilla/firefox/[^/ ]+/(?:logins\.json|key4\.db|cookies\.sqlite)|library/application support/firefox/profiles/[^/ ]+/(?:logins\.json|key4\.db|cookies\.sqlite)|[a-z]:/users/[^/]+/appdata/roaming/mozilla/firefox/profiles/[^/ ]+/(?:logins\.json|key4\.db|cookies\.sqlite)|\.config/(?:google-chrome|chromium|bravesoftware/brave-browser|microsoft-edge)/[^/]+/(?:login data|cookies|web data|network/cookies)|library/application support/(?:google/chrome|chromium|bravesoftware/brave-browser|microsoft edge)/[^/]+/(?:login data|cookies|web data|network/cookies)|[a-z]:/users/[^/]+/appdata/local/(?:google/chrome|microsoft/edge|bravesoftware/brave-browser)/user data/[^/]+/(?:login data|cookies|web data|network/cookies))'
    unless: '^pass\s+(init|ls|list|find|search|grep|insert|add|generate|rm|remove|delete|mv|rename|cp|copy|git|help|version|--help|--version)(\s|$)'
    reason: reading credentials from an operating-system or browser store, or listing an SSH agent's keys
    remedy: Have a person approve the held call, or ask the person for the one credential or key the task needs.
    rationale: These commands can read saved credentials or list the keys an SSH agent holds; a person confirms the access.
  - id: TK-A022
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)etc/docker/daemon\.json$|(^|/)var/run/docker\.sock$|(^|/)run/docker\.sock$'
    reason: changing Docker's host-level configuration or control socket
    remedy: Wait for a person to approve the held write, or describe the Docker setting the task needs for a person to apply.
    rationale: The daemon configuration and socket can grant a container full host access; reading them is allowed.
  - id: TK-A023
    class: shell
    field: container_host_access
    pattern: '^host-access$'
    reason: starting a container with host-level privileges or mounts
    remedy: Have a person approve the held call, or run the container without --privileged, host namespaces or a root mount.
    rationale: These options expose the host disk, process space or device access to the container; a person confirms it.
  - id: TK-A024
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(\.npmrc|pip\.conf|\.pypirc)$|(^|/)etc/apt/sources\.list(\.d/[^/]+\.(list|sources))?$|(^|/)etc/yum\.repos\.d/[^/]+\.repo$'
    reason: changing a package manager's source configuration
    remedy: Wait for a person to approve the held write, or install from the package source already configured.
    rationale: Package source settings can redirect future installs to an untrusted index; reading configuration is allowed.
  - id: TK-A025
    class: shell
    field: package_index
    pattern: '^'
    reason: installing packages through an explicitly selected index
    remedy: Have a person approve the held call, or install from the package index already configured.
    rationale: The signer cannot establish whether a custom index is trusted; a person confirms the source.
  - id: TK-A026
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    # in lower case: the path is also matched casefolded (PowerShell's ConsoleHost_history.txt)
    pattern: '(^|/)(\.bash_history|\.zsh_history|fish_history|consolehost_history\.txt)$|(^|/)var/log(/|$)'
    reason: modifying shell history or system logs
    remedy: Wait for a person to approve the held write, or keep notes in the project instead of history or log files.
    rationale: These files may be evidence of earlier activity; writing to them is held while reading stays allowed.
  - id: TK-A027
    class: shell
    field: effects
    # TK-A026 for the shell: a file a command writes or deletes (a redirection, rm, mv, cp, ln, tee, truncate, dd, sed
    # -i, perl -i, find -delete or -exec rm), each also casefolded, so the pattern is in lower case; and the history
    # file by its variable, $HISTFILE (`: > "$HISTFILE"`). Anchored and lazy, so the fallback engine stays linear
    pattern: '^(?:WRITE_TARGET|DELETE_TARGET):(?:[^\n]*?/)?(?:\.bash_history|\.zsh_history|fish_history|consolehost_history\.txt)$|^(?:WRITE_TARGET|DELETE_TARGET):(?:/private)?/var/log(?:/|$)|^(?:WRITE_TARGET|DELETE_TARGET):\$(?:HISTFILE|\{HISTFILE\})$'
    reason: clearing shell history or system logs
    remedy: Have a person approve the held call, or leave shell history and system logs as they are.
    rationale: Writing or deleting a history or log file can hide earlier activity; reading those files remains allowed.
  - id: TK-A049
    class: shell
    field: effects
    # Deletion targets are also casefolded; the lazy path prefix keeps the fallback matcher fast.
    pattern: '^DELETE_TARGET:(?:[^\n]*?[/\\])?(?:\.github[/\\]workflows(?:[/\\]|$)|\.github(?:[/\\]\*?)?$|\.gitlab-ci\.yml$|\.circleci(?:[/\\](?:config\.yml|\*)?)?$|azure-pipelines\.yml$|jenkinsfile$)'
    reason: deleting a CI workflow or pipeline
    remedy: Have a person approve the held deletion, or leave the pipeline in place.
    rationale: Removing a CI pipeline can disable checks; reading and writing workflows remain allowed.
  - id: TK-A029
    class: shell
    field: target
    # history -c (alone or in a cluster, after other options) or -d, turning the history file off (unset, also with -v
    # or other names; HISTFILE set empty or to /dev/null; HISTSIZE, HISTFILESIZE or zsh's SAVEHIST set to 0, which
    # empties the file; a `*` pattern in HISTIGNORE or zsh's HISTORY_IGNORE, which keeps every command out; each also
    # after export, declare, typeset, readonly or local), vacuuming the journal
    pattern: '^history\s(?:[^\n]*?\s)?-[A-Za-z]*(?:c[A-Za-z]*(?:\s|$)|d)|^unset\s+(?:\S+\s+){0,8}?HISTFILE(?:\s|$)|^set\s+\+o\s+history(?:\s|$)|^(?:(?:export|declare|typeset|readonly|local)(?:\s+-[A-Za-z]+){0,4}\s+)?(?:HISTFILE=(?:/dev/null)?|(?:HIST(?:FILE)?SIZE|SAVEHIST)=0+|HIST(?:ORY_)?IGNORE=(?:\S*:)?\*(?::\S*)?)(?:\s|$)|^journalctl(?:[ \t\f\r]|\s*?\n)[^\n]*?--vacuum-[^\s=]+(?:=|\s|$)'
    reason: clearing shell history or system logs
    remedy: Have a person approve the held call, or leave shell history and system logs as they are.
    rationale: Clearing the history, turning it off or vacuuming the journal can hide earlier activity; a person confirms it.
  - id: TK-A030
    class: shell
    field: effects
    # TK-A024 for the shell: a file a command writes (a redirection, cp, mv, install, ln, tee, dd, sed -i …)
    pattern: '^WRITE_TARGET:(?:[^\n]*?/)?(?:\.npmrc|pip\.conf|\.pypirc)$|^WRITE_TARGET:(?:[^\n]*?/)?etc/apt/sources\.list(?:\.d/[^/]+\.(?:list|sources))?$|^WRITE_TARGET:(?:[^\n]*?/)?etc/yum\.repos\.d/[^/]+\.repo$'
    reason: changing a package manager's source configuration
    remedy: Have a person approve the held call, or install from the package source already configured.
    rationale: Package source settings can redirect future installs to an untrusted index; reading configuration is allowed.
  - id: TK-A028
    class: shell
    field: argv
    # a version-control source anywhere in an install's words (git+https, git+ssh, git+git, git+file, git://, npm's
    # github:, gitlab:, bitbucket: and gist: shorthands), after a space or a PEP 508 `name @`; npm's `i`; and cargo
    # install or add --git. Anchored and lazy, so the fallback engine stays linear
    pattern: '^(pip[0-9.]*|python[0-9.]*\s+-m\s+pip|uv(\s+pip)?|pipx|poetry|npm|pnpm|yarn|bun|gem|cargo)\s+(install|add|get|i)\s(?:[^\n]*?[\s@])?(git\+(https?|ssh|git|file)://|git://|(github|gitlab|bitbucket|gist):)|^cargo\s+(install|add)\s(?:[^\n]*?\s)?--git(\s|=|$)'
    reason: installing a package directly from a version-control source
    remedy: Have a person approve the held call, or install a released version from the configured index.
    rationale: Version-control installs are common but their source and revision need human review.
  - id: TK-A001
    class: shell
    # each command's argv, so `echo terraform destroy`, a grep for it or a commit message naming it don't match. The
    # CLIs' own aliases count (railway and fly rm/remove, pulumi down/dn, heroku apps:delete); the verb sits in the
    # subcommand position and ends a word, so `--service delete-worker`, `fly logs -a delete-me`, `pulumi up -m 'tear
    # down'` or `railway run rm -rf dist` (railway's one word before the verb is never run) don't match; any number of
    # options (with a value) may come before it for pulumi and `railway`/`heroku run`, up to four for terraform,
    # terragrunt (also after run, run-all or stack run, and its older destroy-all and apply-all), fly, cdk (also as
    # aws-cdk or with an @version), `state rm` for terraform, tofu and terragrunt, pulumi's `stack rm` and the npx-style
    # launchers; a mutation needs its call parenthesis, so a URL or file named serviceDelete.json doesn't. `[\w\W]*?`
    # crosses a newline inside an argument before `apply -destroy`; lazy, so the fallback engine stays linear.
    pattern: '^((((railway|heroku) run(:detached)? (-[^ ]+ +([^- ][^ ]* +)?)*)?((terraform|tofu)(\.exe)? (-[^ ]+ ){0,4}(destroy|apply ([\w\W]*? )?--?destroy|state rm)|terragrunt(\.exe)? (-[^ ]+ +([^- ][^ ]* +)?){0,4}((run-all|stack (-[^ ]+ +([^- ][^ ]* +)?){0,4}run|run) (-[^ ]+ +([^- ][^ ]* +)?){0,4})?(destroy(-all)?|apply(-all)? ([\w\W]*? )?--?destroy|state rm)|pulumi(\.exe)? (-[^ ]+ +([^- ][^ ]* +)?)*(destroy|down|dn|stack (-[^ ]+ +([^- ][^ ]* +)?){0,4}rm)|dropdb)|((npx|bunx|pnpm dlx|yarn dlx|npm exec) (-[^ ]+ +([^- ][^ ]* +)?){0,4})?((@railway/cli|railway) (([a-qs-z]|r[a-tv-z])[a-z]* )?(delete|remove|rm|down)|(aws-)?cdk(@[^ ]+)?(\.exe)? (-[^ ]+ +([^- ][^ ]* +)?){0,4}destroy)|(fly|flyctl) (-[^ ]+ +([^- ][^ ]* +)?){0,4}([a-z]+ )?(destroy|delete|remove|rm)|heroku ((apps|addons):(destroy|delete|remove)|destroy|pg:reset))([ =]|$)|(curl|wget|https?|xhs?|railway api) [\w\W]*?\b(volume|service|environment|project|database)Delete\s*\()'
    # each of these CLIs prints its help and exits on --help (-h is dropdb's host). Only a last `--help` after at most
    # two short lower-case words counts: the subject joins argv with spaces, so `-m ' --help'` must not read as one
    unless: '^[a-z]{1,16}( [a-z:]{1,32}){0,2} --help$'
    reason: destroying a deployment, database or volume
    remedy: Have a person approve the held call, or plan the change without applying it (terraform plan); run teardowns in a disposable environment.
    rationale: Wipes whole environments or production data in one step (the 2026 PocketOS and DataTalks.Club wipes); a person confirms it.
  - id: TK-A048
    class: shell
    # each command's argv, as TK-A001 reads it, so `echo docker volume rm x` or a grep for it doesn't match: docker's and
    # podman's (podman-remote's too) `volume rm`, `volume remove` and `volume prune` (up to eight options, each with its
    # value or not, may sit before the verb: podman's global options also go there), `system prune` with
    # --volumes (up to eight options before `prune` too), and `compose down` (also docker-compose and podman-compose) with -v or --volumes (also =1, =t, =T, =true, =TRUE and =True, the spellings
    # of true Go's flag parser reads; not =false), with up to six options before the subcommand (Docker's remote TLS
    # form takes five; eight before `down`, for -f and -p) and sixteen words between `prune` or `down` and the flag.
    # docker-compose 1.x and podman-compose (which `podman compose` may run) are Python and take any prefix of
    # --volumes (`--vol`); every compose is read so.
    # Listing and inspecting volumes, `system prune` without --volumes, `compose down` without -v and `image prune`
    # aren't held, nor is a command that only asks for help: --help or -h as the last word after the program and at most
    # two short lower-case words (a volume name there would be a third), or podman's `volume prune help`
    pattern: '^(?:(?:docker|podman(?:-remote)?) (?:-[^ ]+ (?:[^- ][^ ]* )?){0,6}(?:volume(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:rm|remove|prune)|system(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} prune(?: [^ ]+){0,16}? --volumes(?:=(?:1|t|T|true|TRUE|True))?|compose (?:-[^ ]+ (?:[^- ][^ ]* )?){0,8}down(?: [^ ]+){0,16}? (?:-v(?:t[^ ]*)?|--v(?:o(?:l(?:u(?:m(?:es?)?)?)?)?)?)(?:=(?:1|t|T|true|TRUE|True))?)|(?:docker|podman)-compose (?:-[^ ]+ (?:[^- ][^ ]* )?){0,8}down(?: [^ ]+){0,16}? (?:-v(?:t[^ ]*)?|--v(?:o(?:l(?:u(?:m(?:es?)?)?)?)?)?)(?:=(?:1|t|T|true|TRUE|True))?)(?: |$)'
    unless: '^[a-z]{1,16}(-remote)?( [a-z]{1,16}){1,2} (--help|-h)$|^(docker|podman(-remote)?) volume prune help$'
    reason: deleting Docker or Podman volumes
    remedy: Wait for a person to approve the held call, or remove containers and images and leave the volumes, where the data lives.
    rationale: A volume usually holds a project's database or cache; deleting it can't be undone, and a person confirms it.
  - id: TK-A055
    class: shell
    # each command's argv, as TK-A048 reads it; a program may carry up to four options before its subcommand where noted
    # Prisma: `migrate reset` and `db push --force-reset` (bare, or through npx, bunx, pnpm, yarn or npm exec with up to
    #   four options before the program; an @version too)
    # Rails: `db:drop`, `db:reset`, `db:purge`, `db:truncate_all`, `db:migrate:reset` and `db:seed:replant` (also `db:drop:all` and the like;
    #   rails or rake, also after `bundle exec`)
    # Django: `flush` (`manage.py`, also after python's options, `python -m django` or `django-admin`)
    # Sequelize: `db:drop` (also `sequelize-cli`, through the launchers as Prisma)
    # Laravel: `migrate:fresh`, `migrate:reset`, `migrate:refresh` and `db:wipe` (`artisan`, also after php's options or `sail`)
    # Supabase: `db reset` (through the launchers as Prisma)
    # TypeORM: `schema:drop` (also `typeorm-ts-node-commonjs` and `-esm`, through the launchers as Prisma)
    # Ecto: `ecto.drop` and `ecto.reset` (`mix`)
    # EF Core: `database drop` (`dotnet ef`, `dotnet-ef`)
    # Migrating, seeding, diffing (`prisma migrate dev`, `rails db:seed`, `supabase db diff`), `manage.py sqlflush` (it
    # only prints SQL) and text that names a command aren't held, nor is a command that only asks for help: --help or -h
    # as the last word after the program and at most two short words
    pattern: '^(?:(?:(?:npx|bunx|bun x|pnpm dlx|pnpm exec|pnpm|yarn dlx|yarn|npm exec) (?:-[^ ]+ (?:[^- ][^ ]* )?){0,4})?(?:prisma(?:@[^ ]+)? (?:migrate reset|db push(?: [^ ]+){0,8}? --force-reset)|sequelize(?:-cli)?(?:@[^ ]+)? db:drop|supabase(?:@[^ ]+)? db reset|typeorm(?:-ts-node-(?:commonjs|esm))?(?:@[^ ]+)? schema:drop)|(?:bundle exec (?:[^ ]*/)?)?(?:rails|rake) db:(?:drop|reset|purge|truncate_all|migrate:reset|seed:replant)(?::\w+)*|(?:(?:python[\d.]*|py) (?:-[^ ]+ (?:[^- ][^ ]* )?){0,4}(?:(?:[^ ]*/)?manage\.py|-m django)|django-admin|manage\.py) flush|(?:(?:php[\d.]*|sail) (?:-[^ ]+ (?:[^- ][^ ]* )?){0,4})?artisan (?:migrate:(?:fresh|reset|refresh)|db:wipe)|mix ecto\.(?:drop|reset)|dotnet(?: ef|-ef) database drop)(?: |$)'
    unless: '^[a-z]{1,16}( [a-z:]{1,32}){0,2} (--help|-h)$'
    reason: dropping or resetting a database through a framework command
    remedy: Wait for a person to approve the held call, or reset a disposable copy of the database and leave the real one.
    rationale: A framework's reset or drop command wipes the database its configuration points at, which may not be a throwaway one; a person confirms it.
  - id: TK-A067
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    # a .pth file written directly into a site-packages or dist-packages folder: Python's site module reads
    # every one at each interpreter start and runs its import lines, so it isn't a model weights file
    pattern: '(?:^|[/\\])(?:[Ss][Ii][Tt][Ee]|[Dd][Ii][Ss][Tt])-[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss][/\\][^/\\]*\.pth$'
    reason: writing a Python .pth file, which runs at every Python start
    remedy: Have a person approve the held call.
    rationale: A .pth file in site-packages or dist-packages runs at every Python start, so a person confirms the write.
  - id: TK-A068
    class: shell
    field: effects
    # each file a command writes (redirections, cp, mv, tee …), as TK-D008 reads them, directly in a
    # site-packages or dist-packages folder and ending in .pth; TK-A067's shell twin
    pattern: '^WRITE_TARGET:(?:[\w\W]*?[/\\])?(?:[Ss][Ii][Tt][Ee]|[Dd][Ii][Ss][Tt])-[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss][/\\][^/\\]*\.pth$'
    reason: writing a Python .pth file, which runs at every Python start
    remedy: Have a person approve the held call.
    rationale: A .pth file in site-packages or dist-packages runs at every Python start, so a person confirms the write.
  - id: TK-A058
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    # model weights files (.safetensors, .gguf, .pt, .pth, .ckpt) written or edited through file tools; reads are allowed
    pattern: '\.(safetensors|gguf|pt|pth|ckpt)$'
    # a .pth directly in site-packages or dist-packages is TK-A067's, not a weights file
    unless: '(?:^|[/\\])(?:[Ss][Ii][Tt][Ee]|[Dd][Ii][Ss][Tt])-[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss][/\\][^/\\]*\.pth$'
    reason: writing a model weights file
    remedy: Have a person approve the held call.
    rationale: Writing a model weights file changes what every user of that model gets; a person confirms it.
  - id: TK-A059
    class: shell
    field: effects
    # each file a command writes (redirections, cp, mv, tee …), as TK-D008 reads them, ending in model weights
    # extensions (.safetensors, .gguf, .pt, .pth, .ckpt); reads, listings and non-weights files aren't held
    pattern: '^WRITE_TARGET:[\w\W]*?\.(?:safetensors|gguf|pt|pth|ckpt)$'
    # a .pth directly in site-packages or dist-packages is TK-A068's, not a weights file
    unless: '^WRITE_TARGET:(?:[\w\W]*?[/\\])?(?:[Ss][Ii][Tt][Ee]|[Dd][Ii][Ss][Tt])-[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss][/\\][^/\\]*\.pth$'
    reason: writing a model weights file
    remedy: Have a person approve the held call.
    rationale: Writing a model weights file changes what every user of that model gets; a person confirms it.
  - id: TK-A060
    class: shell
    field: argv
    # publishing model weights to a hub or registry: huggingface-cli upload, hf upload, ollama push, after up to eight
    # options; downloads (download, pull) aren't held
    pattern: '^(?:(?:huggingface-cli|hf)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} upload(?:-large-folder)?|ollama(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} push)(?: |$)'
    reason: publishing model weights to a model hub
    remedy: Have a person approve the held call, or work with local models and leave the hub''s copy as it is.
    rationale: Publishing model weights to a model hub changes what every user of that model gets; a person confirms it.
  - id: TK-A071
    class: shell
    field: argv
    # each command's argv: curl, wget, socat, nc, ncat or netcat, then any words, one that names docker.sock or
    # podman.sock (`--unix-socket /var/run/docker.sock`, `UNIX-CONNECT:/run/podman/podman.sock`, `nc -U`, an
