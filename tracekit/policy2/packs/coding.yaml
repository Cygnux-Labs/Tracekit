  - id: TK-A043
    class: shell
    # moving money through Stripe, PayPal or Square from the shell, each command's argv: the Stripe CLI's refunds,
    # payouts, transfers, topups and transfer_reversals create, charges create or capture, payment_intents create,
    # confirm or capture, invoices pay and treasury outbound_payments or outbound_transfers create, with up to eight
    # options (with a value) before the resource and again before its operation; `stripe post` to one of those
    # endpoints (also a charge's refund or capture and a transfer's reversals, and the v2 money_management outbound
    # payments and transfers); and a POST to one of them on api.stripe.com, or to a PayPal payout, order or
    # authorization capture or capture refund on api.paypal.com or api-m.paypal.com, or to a Square payment, refund or
    # payment completion on connect.squareup.com, through curl, wget, HTTPie or xh (any number of slashes after the
    # host). A POST is each client's own: curl's -X/--request POST or a body option (-d, -F, --data*, --form*,
    # --json); wget's --method POST, --post-data or --post-file; HTTPie's and xh's POST method word, --raw, or a data
    # item after the URL (k=v, k:=v, k@file; not a k==v query). Before the URL, the POST reaches it across any words
    # that can't start another POST of that client (an empty word and a body's spaces too), so each stretch of the
    # command is crossed once and the fallback engine stays linear with no bound; after the URL, within sixteen
    # space-separated pieces. Stripe's mode isn't read (a sandbox call is held too: the key, not --live, can make it
    # live); PayPal's and Square's sandbox hosts aren't these. Amount-less calls (a full refund, a confirm, capture or
    # invoice pay) are held as any other. Not held: listing, retrieving or cancelling, stripe listen, trigger, logs tail
    # and login, a GET (Stripe's docs list with `curl -G … -d limit=3`), and `stripe <resource> <operation> --help`.
