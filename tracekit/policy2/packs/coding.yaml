ory/(?:(?:branches|tags)/[^/ ?#]+|merged_branches)|(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+(?:/api/v3)?/repos/(?:[^/ ?#]+/[^/ ?#]+|[^/ ?#$]*\$[^/ ?#]*)/git/refs/(?:[^/ ?#]+/){0,8}[^/ ?#]+|(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+/api/v4|\$\{?CI_API_V4_URL\}?)/projects/[^/ ?#]+/repository/(?:(?:branches|tags)/[^/ ?#]+|merged_branches)))/?(?:[?#][^ ]*)?(?: |$)(?:[^ ]* ){0,16}(?:-[^ =-]*X|--method|--request)(?:[ =]?[Dd][Ee][Ll][Ee][Tt][Ee]|[ =]?[$\x60][^ ]*|[ =][^ $\x60]*[$\x60][^ ]*)(?: |$)|(?:curl|wget|https?|xhs?) (?:[^ ]* ){0,16}(?:-[^ =-]*X|--method|--request)(?:[ =]?[Dd][Ee][Ll][Ee][Tt][Ee]|[ =]?[$\x60][^ ]*|[ =][^ $\x60]*[$\x60][^ ]*) (?:[^ ]* ){0,16}(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+(?:/api/v3)?/repos/(?:[^/ ?#]+/[^/ ?#]+|[^/ ?#$]*\$[^/ ?#]*)/git/refs/(?:[^/ ?#]+/){0,8}[^/ ?#]+|(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+/api/v4|\$\{?CI_API_V4_URL\}?)/projects/[^/ ?#]+/repository/(?:(?:branches|tags)/[^/ ?#]+|merged_branches))/?(?:[?#][^ ]*)?(?: |$)|(?:curl|wget|https?|xhs?) (?:[^ ]* ){0,16}(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+(?:/api/v3)?/repos/(?:[^/ ?#]+/[^/ ?#]+|[^/ ?#$]*\$[^/ ?#]*)/git/refs/(?:[^/ ?#]+/){0,8}[^/ ?#]+|(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+/api/v4|\$\{?CI_API_V4_URL\}?)/projects/[^/ ?#]+/repository/(?:(?:branches|tags)/[^/ ?#]+|merged_branches))/?(?:[?#][^ ]*)?(?: |$)(?:[^ ]* ){0,16}(?:-[^ =-]*X|--method|--request)(?:[ =]?[Dd][Ee][Ll][Ee][Tt][Ee]|[ =]?[$\x60][^ ]*|[ =][^ $\x60]*[$\x60][^ ]*)(?: |$)|(?:https?|xhs?) (?:[^ ]* ){0,16}[Dd][Ee][Ll][Ee][Tt][Ee] (?:[^ ]* ){0,16}(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+(?:/api/v3)?/repos/(?:[^/ ?#]+/[^/ ?#]+|[^/ ?#$]*\$[^/ ?#]*)/git/refs/(?:[^/ ?#]+/){0,8}[^/ ?#]+|(?:(?:[Hh][Tt][Tt][Pp][Ss]?://)?[^/ ?#]+/api/v4|\$\{?CI_API_V4_URL\}?)/projects/[^/ ?#]+/repository/(?:(?:branches|tags)/[^/ ?#]+|merged_branches))/?(?:[?#][^ ]*)?(?: |$)|(?:(?:gh|glab|hub) api|curl|wget|https?|xhs?) [\w\W]*?deleteRef\b)'
    reason: deleting a remote Git ref
    remedy: Have a person approve the held call, or delete only the local branch (git branch -d) and leave the remote one.
    rationale: Deleting a remote branch or tag changes shared state and can remove work; a person confirms it.
  - id: TK-A033
    class: shell
    # a public incident: an agent merged eight pull requests with no human review, past branch protection, with an admin
    # identity. Held: gh pr merge (--auto and --admin too) and glab mr merge or accept, with up to four options before
    # each word; a merge endpoint (GitHub's pulls/N/merge, GitLab's merge_requests/N/merge, the number possibly a
    # variable) or GitHub's GraphQL merge, auto-merge or merge-queue mutation, or GitLab's mergeRequestAccept, through
    # gh, glab or hub api, curl, wget, HTTPie or xh. A local `git merge` isn't held. No --help exemption: gh and glab
    # take the next word as an option's value, so `gh pr merge 42 --body --help` merges. `[\w\W]*?` crosses a newline
    # inside an argument (a multi-line GraphQL query); lazy, so the fallback engine stays linear
    # lean: any request to a merge endpoint is held, a status check (GET) too; match the method when one gets in the way
    pattern: '^(?:gh (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,4}pr (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,4}merge(?: |$)|glab (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,4}mr (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,4}(?:merge|accept)(?: |$)|(?:(?:gh|glab|hub) api|curl|wget|https?|xhs?) [\w\W]*?(?:/(?:pulls|merge_requests)/[^/ ]+/merge(?:[ ?#/]|$)|(?:mergePullRequest|enablePullRequestAutoMerge|enqueuePullRequest|mergeRequestAccept)\b))'
    reason: merging a pull request
    remedy: Have a person approve the held call, or leave the pull request open for a person to review and merge.
    rationale: A merge lands code on a shared branch, often with a deploy behind it; a person confirms it.
  - id: TK-A042
    class: shell
    # deleting a whole repository, project, organization or group through a platform's API: a DELETE request to
    # GitHub's /repos/<owner>/<repo> or /orgs/<org>, GitLab's /api/v4/projects/<id> or /api/v4/groups/<id> or Vercel's
    # /v9/projects/<name> (the path ends at the repository, project, organization or group, so a DELETE of one issue
    # comment, member or another sub-resource isn't held), through gh, glab or hub api, curl, wget, HTTPie or xh, with
    # the method before or after the URL; gh repo delete, glab repo delete, glab project delete, hub delete and
    # vercel remove, rm or project(s) remove or rm, with up to four options before each word (an empty or space-edged
    # value too), as TK-A047 reads them; a bare repos/<owner>/<repo> or orgs/<org> path as a gh or hub api argument, or a
    # bare projects/<id> or groups/<id> path as a glab api argument; or a GraphQL deleteRepository mutation, also after an argument with a
    # newline in it (a multi-line query). As TK-A047 reads the API: up to sixteen words (empty ones too) before the method
    # flag or the path and sixteen between them; the method in any case, also after -X ending a cluster of short
    # options (-iX, -sSX), or a method word with a $ or a backquote in it (-X "$M", -X $(echo DELETE)); the URL with or
    # without a scheme in any case, its host a variable too, the owner and repository also as one variable
    # (repos/$GITHUB_REPOSITORY) and GitLab's $CI_API_V4_URL for its /api/v4. A path that runs past the repository or
    # project (a branch or file under it) isn't held, nor a GET of the same URLs. No --help exemption, as TK-A033: gh
    # and glab take the next word as an option's value. A URL's repos/ follows its host or /api/v3 directly, so a
    # repos/ deeper in a path (removing a repository from a team) isn't held. Every gap but the GraphQL branch's is
