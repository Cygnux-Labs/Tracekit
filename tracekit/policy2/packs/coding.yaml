    # a cache flush fed into redis-cli or valkey-cli: piped (`echo FLUSHDB | redis-cli`), as a herestring
    # (`redis-cli <<< FLUSHALL`) or in a heredoc. argv reads each pipeline stage on its own, so the flush word and the
    # client never share one, and the whole line does. The stage before the pipe must itself be the flush: echo (with
    # up to four flags) or printf, printing exactly FLUSHALL or FLUSHDB (or with ASYNC/SYNC, or a trailing newline),
    # also in a subshell or a { } group, optionally through tee stages that pass stdin through. A herestring must be
    # exactly the flush; a heredoc holds it as a line of its own in its first nine (where the heredoc ends isn't read),
    # its delimiter quoted any way, also as `bash -c` re-quotes it (<<'"'"'EOF'"'"'). The client fed one may follow
    # any word (a wrapper: `timeout 5 redis-cli <<< FLUSHALL`, `bash -c 'redis-cli <<EOF …'`, whose line holds the
    # heredoc). Only options (up to eight, each with at most one value) may come between the client and its
    # herestring or heredoc, so a command that takes stdin as a value (`redis-cli -x SET k <<< FLUSHALL`) isn't held.
    # Up to two of command, builtin and env, and a directory, may come before echo, printf and the piped-into client.
    # A flush word that merely appears in the piped text (a grep hit, a sentence, a file piped in with cat) is not held: the rule is
    # anchored on the client invocation, not on the keyword. A flush after the pipe, a pipe into another program,
    # printf with a separate format string, env with options or assignments, or a pipe into redis-cli through another
    # wrapper isn't read. The directory before a name is bounded, so the fallback engine stays linear
    pattern: '(^|[|;&({]\s*)((command|builtin|env)\s+){0,2}([^\s|;&(){}]{0,256}/)?((echo(\s+-[a-zA-Z]+){0,4}\s+|printf\s+)\W{0,1}([Ff][Ll][Uu][Ss][Hh][Aa][Ll][Ll]|[Ff][Ll][Uu][Ss][Hh][Dd][Bb])(\s+([Aa][Ss][Yy][Nn][Cc]|[Ss][Yy][Nn][Cc]))?((\\r)?\\n)?\W{0,1}(\s*[;)}]){0,4}\s*(?:\|\s*tee\b[^|]*){0,4}\|\s*((command|env)\s+){0,2}([^\s|;&(){}]{0,256}/)?(redis-cli|valkey-cli)\b)|(^|[\s|;&({''"])([^\s|;&(){}''"]{0,256}/)?(redis-cli|valkey-cli)(\s+-[^\s|;&()<>]*(\s+[^-\s|;&()<>][^\s|;&()<>]*)?){0,8}\s*(<<<\s*(\$?[''"])?([Ff][Ll][Uu][Ss][Hh][Aa][Ll][Ll]|[Ff][Ll][Uu][Ss][Hh][Dd][Bb])(\s+([Aa][Ss][Yy][Nn][Cc]|[Ss][Yy][Nn][Cc]))?((\\r)?\\n)?[''"]?[ \t]*($|[\n|;&)}])|<<-?[ \t]*[''"\\]{0,8}[A-Za-z_][^\n]{0,256}\n([^\n]*\n){0,8}?[ \t]*([Ff][Ll][Uu][Ss][Hh][Aa][Ll][Ll]|[Ff][Ll][Uu][Ss][Hh][Dd][Bb])([ \t]+([Aa][Ss][Yy][Nn][Cc]|[Ss][Yy][Nn][Cc]))?[ \t]*(\n|$))'
    reason: flushing a cache with a command fed into redis-cli
    remedy: Have a person approve the held call, or flush only the keys the change needs.
    rationale: FLUSHALL and FLUSHDB piped or fed into redis-cli empty the whole cache or database; a person confirms it.
  - id: TK-A041
    tool: .*([^a-zA-Z]|^)(sql|postgres|postgresql|mysql|maria|sqlite|clickhouse|mongo|database|duckdb|snowflake|bigquery|redshift|psql|pg|oracle|mssql|sqlserver|db)([^a-zA-Z]|$).*
    # a destructive SQL statement in an MCP tool's sql, query or statement argument, but only for SQL-like tools
    # (the tool name carries sql, postgres, mysql, sqlite, database, db as a whole word, and kin; a search tool's query
    # text is not a call), in any class: also where a pack maps the tool to class sql (the server parts map
    # mcp:postgres/query and kin, which TK-DB001..003 read too, so the dev pack keeps this reading of them). The
    # statement is read as TK-A039 reads a client's: up to eight statements may come first, where a statement ends
    # at `;` only (an escape counts as one character, so a quoted or escaped keyword cannot hide the
    # destructive one), and a comment may come before the keyword; a comment ends with its argument's text (another
    # argument isn't run), so many open ones read linearly. A DELETE counts only without a WHERE
    # or with an always-true one. DROP
    # needs the object word after it (TABLE, DATABASE, SCHEMA, and kin), so `drop down menu` or `drop support for
    # node 16` doesn't match. There is no ROLLBACK exemption: a destructive statement in one argument isn't undone
    # by a transaction in another. A list-valued argument isn't read. Its whitespace runs are lazy, as TK-A039's are.
    pattern: '"(sql|query|statement)":"((?:[^;\"\\]|\\.)*;){0,8}(?:\s|\\[ntrf]|\\u000[bB]|--[^\\\n"]*(?:\n|\\n)|/\*(?:[^!M*"\\]|\\.|M(?:[^!*"\\]|\\.)|M?\*[^/"\\]|M?\*\\.)(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/|/\*M?\*/|/\*M?![0-9]*)*?([Dd][Rr][Oo][Pp](?:(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+?[Tt][Ee][Mm][Pp](?:[Oo][Rr][Aa][Rr][Yy])?)?(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+?([Tt][Aa][Bb][Ll][Ee]|[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]|[Ss][Cc][Hh][Ee][Mm][Aa]|[Ii][Nn][Dd][Ee][Xx]|[Vv][Ii][Ee][Ww]|[Tt][Rr][Ii][Gg][Gg][Ee][Rr]|[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Cc][Ee][Dd][Uu][Rr][Ee]|[Ss][Ee][Qq][Uu][Ee][Nn][Cc][Ee]|[Tt][Aa][Bb][Ll][Ee][Ss][Pp][Aa][Cc][Ee]|[Rr][Oo][Ll][Ee]|[Uu][Ss][Ee][Rr]|[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn]|[Mm][Aa][Tt][Ee][Rr][Ii][Aa][Ll][Ii][Zz][Ee][Dd](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+[Vv][Ii][Ee][Ww]|[Ff][Oo][Rr][Ee][Ii][Gg][Nn](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+[Tt][Aa][Bb][Ll][Ee]|[Dd][Oo][Mm][Aa][Ii][Nn]|[Tt][Yy][Pp][Ee]|[Ss][Ee][Rr][Vv][Ee][Rr]|[Pp][Uu][Bb][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]|[Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn]|[Pp][Oo][Ll][Ii][Cc][Yy]|[Cc][Aa][Ss][Tt]|[Cc][Oo][Ll][Ll][Aa][Tt][Ii][Oo][Nn]|[Oo][Ww][Nn][Ee][Dd](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+[Bb][Yy])|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee](?:\s|\\[ntrf]|\\u000[bB]|/\*|;|")|[Dd][Ee][Ll][Ee][Tt][Ee](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+[Ff][Rr][Oo][Mm](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)(?:\s*[^\s;"]+(?:\s(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)*?(?:[Aa][Ss](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+)?[A-Za-z_][A-Za-z0-9_]*(?:(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+[Rr][Ee][Tt][Uu][Rr][Nn][Ii][Nn][Gg](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)[^;"]*|(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)*?)|(?:\s(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)*?|\\n)[Rr][Ee][Tt][Uu][Rr][Nn][Ii][Nn][Gg](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)[^;"]*|(?:\s(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)*?)?)|[^;"]*[Ww][Hh][Ee][Rr][Ee](?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)+?(1\s*=\s*1|(''''|"")\s*=\s*(''''|"")|[Tt][Rr][Uu][Ee]|1)(?:\s|\\[ntrf]|\\u000[bB]|/\*(?:[^*"\\]|\\.|\*[^/"\\]|\*\\.)*\*/)*?)(;|"|\*/))'
    reason: a destructive SQL statement through an MCP database tool
    remedy: Have a person approve the held call, or run the change as a reviewed migration.
    rationale: An MCP tool whose sql, query or statement argument drops, truncates or deletes without a WHERE destroys data the same way a SQL tool call does; a person confirms it.
  - id: TK-A031
    class: shell
    # each command's argv: a version purge (gsutil rm -a, gcloud storage rm --all-versions, an S3 object version), a
    # recursive or wildcard (`*`) delete, a batch delete or a bucket delete in GCS, S3, Azure Blob, Azure Files or Data
    # Lake, or through rclone or s3cmd; up to eight options (with a value) before the service and again before its verb.
    # One object's delete is left to TK-F003's flag: server agents clear their own objects routinely. `[\w\W]*?` crosses
    # a newline inside an argument; lazy, so the fallback engine stays linear
    pattern: '^(?:gsutil (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:rb(?: |$)|rm(?:(?: [\w\W]*?)?(?: -[A-HJ-QS-Zb-qs-z]*[aIrR][A-Za-z]*| --read-paths-from-stdin)(?: |$)| [\w\W]*?[*]))|gcloud (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:(?:alpha|beta) )?storage (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:buckets (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}delete(?: |$)|rm(?:(?: [\w\W]*?)?(?: --all-versions| --recursive)(?: |=|$)|(?: [\w\W]*?)?(?: -[A-HJ-QS-Zb-qs-z]*[aIrR][A-Za-z]*| --read-paths-from-stdin)(?: |$)| [\w\W]*?[*]))|aws (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:s3 (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:rb(?: |$)|rm(?: [\w\W]*?)? --rec(?:u(?:r(?:s(?:i(?:v(?:e)?)?)?)?)?)?(?: |=|$))|s3api (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:(?:delete-objects|delete-bucket)(?: |$)|delete-object(?: [\w\W]*?)? --version-id(?: |=|$)))|az storage (?:(?:blob|file) delete-batch|container delete|fs delete|fs directory delete)(?: |$)|az storage remove(?: [\w\W]*?)? (?:-r|--recursive)(?: |$)|rclone (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:purge|delete|rmdirs|cleanup)(?: |$)|s3cmd (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:rb(?: |$)|(?:del|rm)(?:(?: [\w\W]*?)? (?:-[A-Za-qs-z]*r[A-Za-z]*|--recursive)(?: |$)| [\w\W]*?[*]))|s3cmd (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,7}(?:-[A-Za-qs-z]*r[A-Za-z]*|--recursive) (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,7}(?:del|rm)(?: |$))'
    reason: destroying cloud storage data (a version purge, a bulk or wildcard delete, or a bucket)
    remedy: Have a person approve the held call; a person deletes bucket data or its version history themselves.
    rationale: Bulk deletes and version purges in object storage can't be undone, and a bucket's version history is often the only copy left.
  - id: TK-A002
    class: shell
    # deleting a remote ref rewrites shared state; ordinary pushes remain unheld. A push is also `git send-pack` or
    # `hub push`, as TK-D003 reads one. No dry-run exemption: `-o` takes the next
    # word as its value, so `git push -d origin main -o --dry-run` deletes main. Also held: a long-option prefix (`--del`,
    # `--pru`), `d` in a short-option cluster before any `o` (`-4d`, `-doci.skip`; the class leaves `d` out so a long word
    # can't backtrack) and an all-zero source object id (SHA-1 or SHA-256). `[\w\W]*?` crosses a newline inside an
    # argument (`--repo=$'x\ny'`) but never reaches another command, which is its own subject; lazy, so the fallback
    # engine stays linear. A remote branch or tag deleted through a platform's API is held too, read as TK-A042 reads
    # a repository's deletion: a DELETE of GitHub's /repos/<owner>/<repo>/git/refs/<ref> or GitLab's
    # /api/v4/projects/<id>/repository/branches/<name>, tags/<name> or merged_branches (bare paths through gh, hub or
    # glab api too; GitLab's name URL-encoded, as it takes one), or a GraphQL deleteRef mutation.
    # lean: a GitHub ref of up to nine `/`-separated parts (refs/heads/a/b/…), so the fallback engine doesn't back off
    # over a long path one character at a time; read more parts if a real branch name has them
