    reason: applying a patch through the shell
    remedy: Have a person approve the held call, or edit files with the apply_patch tool, which Tracekit decides file by file.
    rationale: A patch applied from the shell writes files that no file rule reads; a person confirms it.
  - id: TK-A035
    class: shell
    # each command's argv: AWS Secrets Manager's get-secret-value, SSM Parameter Store's reads with --with-decryption
    # (a word of its own or any prefix of it: --no-with-decryption is not it), gcloud's `secrets versions access` and
