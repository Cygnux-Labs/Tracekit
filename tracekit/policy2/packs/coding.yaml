  - id: TK-A047
    class: shell
    # taking a repository's protections apart through GitHub, as TK-A042 reads gh api and curl: gh secret or
    # variable delete (or remove), with up to four options before each word as TK-A042 reads them (an empty or
    # space-edged value too); gh repo edit turning secret scanning, its push protection or advanced security off
    # (--enable-…=false, or a value with a $ or a backquote in it, set at run time); a DELETE, PUT or PATCH (or a
    # method word with a $ or a backquote in it: -X "$M", -X $(echo DELETE)) through gh or hub api or curl, or a
    # curl upload (-T or --upload-file, which sends a PUT), on a branch's protection or a path under it, a
    # repository's or organization's rulesets, their Actions, Dependabot or Codespaces secrets and variables, an
    # environment or a path under it, or the user's Codespaces secrets; a DELETE of a repository's
    # vulnerability-alerts or automated-security-fixes (a PUT turns them on); each path bare or after a host, with or
    # without a scheme in any case, or after a variable for the API URL (and /api/v3), the owner and repository also
    # as one variable (repos/$GITHUB_REPOSITORY/…); up to sixteen words (empty ones too) before the method flag or
    # the path and sixteen between them; the method in any case, also after -X ending a cluster of short options
    # (-iX, -sSX); a PATCH whose arguments set a security_and_analysis feature's status to disabled; and a gh or hub
    # api DELETE with a $ or a backquote in an argument, whose path is built at run time. A GET of the same paths,
    # gh secret list and gh secret set aren't held. Every gap is bounded, a branch name to 250 characters, a run
    # before a $ or a backquote stops at the first one, and a run-time method joined to its flag (-X$M) starts with
    # one, so the fallback engine stays linear.
    # lean: a gh api DELETE with any variable in its arguments is held, a workflow run's or an issue comment's by a
    # variable id too: a variable before the path's last segment can hide a protected path (a ? or # in it ends the
