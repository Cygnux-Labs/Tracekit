    pattern: '^(aws (-[^ ]+ +([^- ][^ ]* +)?){0,8}(secretsmanager (-[^ ]+ +([^- ][^ ]* +)?){0,8}(get-secret-value|batch-get-secret-value)(["]| |$)|ssm (-[^ ]+ +([^- ][^ ]* +)?){0,8}(get-parameters-by-path|get-parameters?|get-parameter-history)( [\w\W]*?)? --w(i(t(h(-(d(e(c(r(y(p(t(i(o(n)?)?)?)?)?)?)?)?)?)?)?)?)?)?(["]| |$))|gcloud (-[^ ]+ +([^- ][^ ]* +)?){0,8}((alpha|beta) (-[^ ]+ +([^- ][^ ]* +)?){0,8})?secrets (-[^ ]+ +([^- ][^ ]* +)?){0,8}versions (-[^ ]+ +([^- ][^ ]* +)?){0,8}access(["]| |$)|az (-[^ ]+ +([^- ][^ ]* +)?){0,8}keyvault (-[^ ]+ +([^- ][^ ]* +)?){0,8}secret (-[^ ]+ +([^- ][^ ]* +)?){0,8}(show|show-deleted|download)(["]| |$))'
    reason: reading a secret's value from a cloud secret store
    remedy: Have a person approve the held call, or ask the person for the one value the task needs.
    rationale: An agent that can read a live password or key can use it or send it anywhere; listing secrets, describing one and reading a parameter without decryption stay allowed.
  - id: TK-A036
    class: mcp
    # TK-A035's commands as the cli_command, command or cmd argument of an MCP tool (the AWS API MCP server's
    # call_aws), starting with the program. The argument is JSON text, so any run of spaces, or of escaped tabs,
    # newlines or returns, separates its words, and an escaped quote stays in its word: a word can't hold a
    # separator, so each text reads one way. The scan for the decryption flag
    # stops at the end of that value, so each occurrence rescans only it. Only for a tool named for running a
