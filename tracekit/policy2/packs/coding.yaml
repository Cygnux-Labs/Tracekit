    # `status` stay allowed
    pattern: '^(?:vault|bao)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:kv(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} get|read|unwrap|print(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} token|token(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} create|write(?: [^ ]+){0,16}? /?auth/token/create(?:[-/][^ ]*)?)(?: |$)'
    reason: reading a Vault secret or creating a Vault token
    remedy: Have a person approve the held call, or list paths and metadata (vault kv list, vault kv metadata get), which show no values.
    rationale: A Vault secret or a new token is a live credential the agent can use or send anywhere; listing engines, policies and paths stays allowed.
  - id: TK-A003
    # Claude Code's escape hatch: a Bash call with dangerouslyDisableSandbox runs with none of its sandbox's limits, and
    # in bypassPermissions mode or under a matching allow rule nobody is asked
    # (docs/integrations/claude-code-sandbox.md); true in any case, as JSON or as a string, as TK-F008 reads it
    field: dangerouslyDisableSandbox
    pattern: '^[Tt][Rr][Uu][Ee]$'
    reason: running a command outside Claude Code's sandbox
    remedy: Have a person approve the held call, or run the command inside the sandbox, without dangerouslyDisableSandbox.
    rationale: The sandbox limits what a command can read, write and reach; a person confirms each command that leaves it.
  - id: TK-A014
    # TK-A003's twin for Claude Code's auto mode: a Bash, PowerShell or Monitor call's allowed_domains opens those hosts
    # to that one command inside the sandbox. Matched as canonical JSON: any list with an entry (or a value that isn't
    # a list); an empty list opens nothing and isn't held. WebSearch's allowed_domains only narrows its results. `bash`
    # too: the server parts map that name (Anthropic's bash tool) to the shell class as Bash
    tool: '[Bb]ash|PowerShell|Monitor'
    field: allowed_domains
    pattern: '^(\[[^\]]|[^\[])'
    reason: opening network hosts beyond Claude Code's sandbox for one command
    remedy: Have a person approve the held call, or run the command with the sandbox's own network allow list, without allowed_domains.
    rationale: The sandbox limits which hosts a command can reach; a person confirms each command that asks for more.
  - id: TK-A004
    # Gemini CLI's sandbox expansion: with security.toolSandboxing on, a run_shell_command call's additional_permissions
    # gives the command network access or more paths to read or write, and in YOLO mode Gemini asks nobody
    # (docs/integrations/gemini-sandbox.md). Matched as canonical JSON, or as the JSON text a string holds (spaces
    # allowed); a request that turns nothing on isn't held.
    field: additional_permissions
    pattern: '"network":\s*true|"(read|write)":\s*\[\s*"'
    reason: running a command with more than Gemini CLI's sandbox allows
    remedy: Have a person approve the held call, or run the command with the sandbox's own permissions, without additional_permissions.
    rationale: The sandbox limits what a command can read, write and reach; a person confirms each command that asks for more.

  # --- autostart locations: what runs at every login or boot ---
  - id: TK-A010
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    # shell start and end files: bash's, zsh's (a home's and /etc's, Debian's /etc/zsh/) and fish's
    pattern: '(^|/)library/launch(agents|daemons)/|(^|/)\.config/(systemd/user|autostart)/|(^|/)etc/(systemd/system|init(\.d)?|rc\.local|xdg/autostart|profile\.d)(/|$)|(^|/)etc/(cron[^/]*|profile|bash\.bashrc|bashrc|zshenv|zshrc|zprofile|zlogin|zlogout|zsh|rc[^/]*\.d)(/|$)|(^|/)var/spool/cron(/|$)|(^|/)(\.bashrc|\.bash_profile|\.bash_login|\.bash_logout|\.profile|\.zshenv|\.zshrc|\.zprofile|\.zlogin|\.zlogout)(/|$)|(^|/)(\.config|etc)/fish/(config\.fish$|conf\.d/)|(^|/)(usr/)?lib/systemd/(system|user)/'
    reason: adding something that runs at every login or boot
    remedy: Have a person approve the held call, or keep the file in the project and start the program when it is needed.
    rationale: Startup items and service definitions outlive the agent's session; a person confirms each one.
  - id: TK-A011
    class: shell
    field: target
    # the TK-A010 locations (cron's /etc/cron* and its spool, /var/spool/cron, two parts deep for a copy's last word:
    # Debian's crontabs/<user>) as where a command writes, copies or links to (cp, install, mv or ln: the last word, or
    # -t's directory; tee, sed -i, dd of=: any of its files) or as a redirection target, and turning a startup item on
    # (systemctl enable, reenable, preset or add-wants after any options); each command and target on its own,
    # anchored and lazy, as TK-D010, and casefolded (lower-case places). Listing them, copying out of them and reading
    # them stay unheld (but for a read redirected with `<`), and so does managing an existing service (`systemctl
    # restart`)
    pattern: '^(cp|install|mv|ln) ([\w\W]*? )?[^ ]*?(library/launch(agents|daemons)|\.config/(systemd/user|autostart)|/(etc/(systemd/system|init\.d|rc\.local|xdg/autostart|cron[^/ ]*)|var/spool/cron(/[^/ ]+)?)|/lib/systemd/(system|user))(/[^/]*)?$|^(cp|install|mv|ln) ([\w\W]*? )?(-[a-z]*t ?|--target-directory[= ])[^ ]*?(library/launch(agents|daemons)|\.config/(systemd/user|autostart)|/(etc/(systemd/system|init\.d|rc\.local|xdg/autostart|cron[^/ ]*)|var/spool/cron)|/lib/systemd/(system|user))(/| |$)|^tee [\w\W]*?(library/launch(agents|daemons)|\.config/(systemd/user|autostart)|/(etc/(systemd/system|init\.d|rc\.local|xdg/autostart|cron[^/ ]*)|var/spool/cron)|/lib/systemd/(system|user))(/| |$)|^sed( -[a-hj-zA-Z][a-zA-Z]*)* -i[\w\W]*?(library/launch(agents|daemons)|\.config/(systemd/user|autostart)|/(etc/(systemd/system|init\.d|rc\.local|xdg/autostart|cron[^/ ]*)|var/spool/cron)|/lib/systemd/(system|user))(/| |$)|^dd ([\w\W]*? )?of=[^ ]*?(library/launch(agents|daemons)|\.config/(systemd/user|autostart)|/(etc/(systemd/system|init\.d|rc\.local|xdg/autostart|cron[^/ ]*)|var/spool/cron)|/lib/systemd/(system|user))(/| |$)|^[^ =]*?(library/launch(agents|daemons)|\.config/(systemd/user|autostart)|/(etc/(systemd/system|init\.d|rc\.local|xdg/autostart|cron[^/ ]*)|var/spool/cron)|/lib/systemd/(system|user))(/| |$)|^launchctl (load|bootstrap|enable)\b|^systemctl (-[^ ]+ +([^- ][^ ]* +)?)*(enable|reenable|preset|preset-all|add-wants|add-requires)( |$)'
    reason: adding something that runs at every login or boot
    remedy: Have a person approve the held call, or run the program directly for this session; a person installs and enables services.
    rationale: TK-A010 for the shell, plus turning a startup item on; a person confirms it.

  # --- Git hooks: code that runs on every commit, checkout or push in the repository (a submodule's under
  # .git/modules/<name>/hooks/). lean: a submodule's name and nesting of up to eight parts, so the fallback engine
  # doesn't rescan a long path from each .git/modules/; read more if a real one is deeper ---
  - id: TK-A012
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)\.git/(modules/([^/]+/){1,8})?hooks/'
    reason: writing a Git hook
    remedy: Have a person approve the held call, or put the script in the project and run it as an ordinary command.
    rationale: A hook runs on every developer's commit or push in this clone; a person confirms it.
  - id: TK-A013
    class: shell
    field: target
    # as TK-A011 (chmod too: any of its files); `git config` after at most eight global options, as TK-A002 reads
    # `push`, setting core.hooksPath (the key and a value) or unsetting it; reading it (`--get`, the key alone) is not
    # held
    pattern: '^(cp|install|mv|ln) [\w\W]*?\.git/(?:modules/(?:[^/ ]+/){1,8})?hooks(/[^/]*)?$|^(cp|install|mv|ln) ([\w\W]*? )?(-[a-z]*t ?|--target-directory[= ])([^ ]*?[^ ])?\.git/(?:modules/(?:[^/ ]+/){1,8})?hooks(/| |$)|^(tee|chmod) [\w\W]*?\.git/(?:modules/(?:[^/ ]+/){1,8})?hooks(/| |$)|^sed( -[a-hj-zA-Z][a-zA-Z]*)* -i[\w\W]*?\.git/(?:modules/(?:[^/ ]+/){1,8})?hooks(/| |$)|^[^ =]*?\.git/(?:modules/(?:[^/ ]+/){1,8})?hooks(/| |$)|^git (-[Cc] [^ ]* |--(git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(=[^ ]*)? ){0,8}config ([\w\W]*? )?(core\.hookspath[ =]|(--unset(-all)?|unset)( [^ ]+){0,4} core\.hookspath( |$))'
    reason: writing a Git hook or moving where hooks live
    remedy: Have a person approve the held call, or put the script in the project and run it as an ordinary command.
    rationale: TK-A012 for the shell, plus core.hooksPath, which points every hook at another directory; a person confirms it.

  # --- logins, setuid bits and network shells that outlive the session: held, as a person adds them (#750)
  - id: TK-A075
    class: shell
    field: argv
    # useradd and adduser of any form; usermod with a group option (-G or -g, also in a cluster or joined to its value,
    # --groups, --gid) naming sudo, wheel or admin, or making a login root (-u 0, also with -o); gpasswd adding a
    # member or an administrator to one of those groups (-a, -M, -A); macOS's dscl creating a user record under
    # /Users. lean: up to 16 words before the option, as the fallback engine backtracks a longer list slowly; read more
    # if a real call has more
    pattern: '^(?:useradd|adduser)(?: |$)|^usermod(?: [^ ]+){0,16}? (?:(?:-[a-fh-zA-FH-Z]*[Gg] ?|--(?:groups|gid)[ =])(?:[^ ]*?,)?(?:sudo|wheel|admin)(?:,| |$)|(?:-[a-tv-zA-Z]*u ?|--uid[ =])0+?(?: |$))|^gpasswd(?: [^ ]+){0,4}? (?:-[aMA]|--(?:add|members|administrators))[ =][^ ]+ (?:sudo|wheel|admin)(?: |$)|^dscl(?: [^ ]+){0,16}? -create /[Uu]sers/'
    reason: creating a login or adding a user to an administrator group
    remedy: Have a person create the account or change its groups; the task rarely needs a login.
    rationale: A new login or sudo membership grants access that outlives the session; a person confirms it.
  - id: TK-A076
    class: shell
    field: effects
    # a file a command writes (a redirection, tee, cp, mv, dd …) that is an account or sudo file: the password, shadow,
    # group and gshadow files, the sudoers file and sudoers.d's drop-ins; reads of them are not written, so they stay
    # unheld
    pattern: '^WRITE_TARGET:(?:[^\n]*?/)?etc/(?:passwd|shadow|group|gshadow|sudoers)$|^WRITE_TARGET:(?:[^\n]*?/)?etc/sudoers\.d/'
    reason: changing the system's login or sudo files
    remedy: Have a person edit the account or sudoers file; use the account tools (useradd, visudo) from a person's terminal.
    rationale: These files decide who can log in and who can run commands as root; a person confirms each change.
  - id: TK-A077
    class: shell
    field: argv
    # chmod's setuid or setgid bit in its mode, the first word after up to eight options: an s that a + or = adds, in
    # any clause of a comma list and among other letters (u+s, +sx, g+s,u+x, u=rwxs, u-x+s), or a numeric mode whose
    # setuid/setgid digit is set (4 digits starting with 2 to 7, also with leading zeros, + or =: 4755, 04755, =2755).
    # Removing it (u-s) and the sticky bit alone (1777) stay unheld. lean: eight options, as for TK-A075; read more if
    # a real call has more
    pattern: '^chmod(?: -[^ ]+){0,8}? (?:[+=]?0*?[2-7][0-7]{3}(?: |$)|[-+=,ugoarwxXst]*?[+=][rwxXtugo]*s)'
    reason: setting the setuid or setgid bit on a file
    remedy: Have a person set the bit; a program that runs as its owner or group needs a person's review.
    rationale: A setuid or setgid file runs with its owner's rights on every run; a person confirms it.
  - id: TK-A078
    class: shell
    field: line
    # a write (a redirection or tee) into a bash or zsh startup file (TK-F011's: .bashrc, .bash_profile, .bash_login,
    # .profile, .zshrc, .zprofile, .zshenv, .zlogin) whose line holds a network shell: /dev/tcp/ or /dev/udp/, socat,
    # or nc, ncat or netcat with -e, -c, --exec or --sh-exec after up to four of its words, in either order; read in
    # the raw command and in each line as the parser read it (`tee ${X}-a` is `tee -a`). An rc edit without one stays
    # unheld. lean: the shell and the write within 128 characters of each other, so the fallback engine scans a
    # bounded stretch from each; a padded line is still TK-F011's flag; read further if a real one is longer
    pattern: '(?:/dev/(?:tcp|udp)/|\bsocat\b|(?:^|[^\w-])(?:nc|ncat|netcat)(?: [^\s;|&]+){0,4}? (?:-[a-z]*[ec]|--(?:sh-)?exec)\b)[^\n]{0,128}?(?:>>?|\btee(?: -[^\s]+){0,8} )\s*[^\s>;|&]*?\.(?:bashrc|bash_profile|bash_login|profile|zshrc|zprofile|zshenv|zlogin)\b|(?:>>?|\btee(?: -[^\s]+){0,8} )\s*[^\s>;|&]*?\.(?:bashrc|bash_profile|bash_login|profile|zshrc|zprofile|zshenv|zlogin)\b[^\n]{0,128}?(?:/dev/(?:tcp|udp)/|\bsocat\b|(?:^|[^\w-])(?:nc|ncat|netcat)(?: [^\s;|&]+){0,4}? (?:-[a-z]*[ec]|--(?:sh-)?exec)\b)'
    reason: adding a network shell to a shell startup file
    remedy: Have a person add the startup line; a shell that connects out on every login is not part of the task.
    rationale: A startup file runs in every new shell, so a line that opens a connection gives a remote party access each login; a person confirms it.

  # --- the agent harness's settings: held, as changing the guardrails (#604)
  - id: TK-F009
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    # Only the normalized path, including its casefolded form, not the file's content. Antigravity CLI's project hooks
    # are .agents/hooks.json and goose's plugins are under .agents/plugins/ (the folder's skills/ is ordinary work);
    # Factory Droid keeps its hooks and settings in .factory/, goose its settings in ~/.config/goose (on Windows
    # AppData/Roaming/Block/goose/config). Crush reads crush.json, .crush.json, crushrc and .crushrc in a project or
    # home, and ~/.config/crush/. Kilo Code's are OpenCode's under its own names: .kilo, .kilocode, ~/.config/kilo and
    # kilo.json. Devin reads .devin/ in a project and ~/.config/devin (on Windows AppData/Roaming/devin), and OpenHands
    # .openhands/ (its hooks.json, agent_settings.json and mcp.json) in a project and the home folder. Claude Code
    # keeps its user settings and MCP servers in ~/.claude.json, and its skills and slash commands (which can run
    # commands with `!` lines) under .claude/ (held, as the rest of .claude/ is); Cursor its MCP servers in
    # .cursor/mcp.json. Cline runs every hook file in Documents/Cline/Hooks (wherever Documents is), ~/.cline/hooks and
    # a workspace's .cline/hooks and .clinerules/hooks, and keeps its settings, hooksEnabled among them, in ~/.cline/.
    # Copilot CLI keeps its hooks and settings in ~/.copilot, reads a repository's .github/hooks/ and
    # .github/copilot/settings*.json (whose disableAllHooks turns every hook off), and the machine's
    # /etc/github-copilot/policy.d/*.json hooks.
    # CodeBuddy Code reads its hooks from .codebuddy/settings.json and settings.local.json, and ~/.codebuddy/ (held, as
    # the rest of .codebuddy/ is, but for its worktrees: below). gptme reads ~/.config/gptme/ (its config.toml and the
    # plugins there, Tracekit's among them) and a project's gptme.toml or gptme.local.toml. Open Interpreter, a Codex
    # fork, reads its hooks.json and config.toml (where the hooks' trust is kept) from ~/.openinterpreter
    # ($INTERPRETER_HOME) and a project's .openinterpreter/.
    # PowerShell runs a profile (*profile.ps1) before a hook it starts without -NoProfile, so a profile that exits ends
    # the hook before Tracekit runs: the user's in Documents/WindowsPowerShell/ (5.1) or Documents/PowerShell/ (7),
    # OneDrive's Documents too under its localized name (OneDrive - Contoso/Dokumente/), pwsh's on Linux and macOS in
    # ~/.config/powershell/, and the machine's in $PSHOME (System32/WindowsPowerShell/v1.0/, PowerShell/7/ and
    # PowerShell/7-preview/).
    # A file inside one of Claude Code's or CodeBuddy Code's worktrees (.claude/worktrees/<name>/…,
    # .codebuddy/worktrees/<name>/…) is judged as it is in the worktree: that .claude or .codebuddy is no setting, the
    # worktree's own .claude, .codebuddy, .codex, .mcp.json and the rest are. The .claude and .codebuddy branch spells
    # out what isn't `/worktrees/<name>/…` (RE2 has no lookahead): another folder, the worktrees folder or a worktree
    # itself, and a name starting with a dot
    pattern: '(^|/)\.(codex|gemini|opencode|kilo|kilocode|qwen|factory|devin|cline|openhands|copilot|openinterpreter)(/|$)|(^|/)(\.clinerules/hooks|cline/hooks)(/|$)|(^|/)\.github/(hooks(/|$)|copilot/settings[^/]*\.json$)|(^|/)etc/github-copilot(/|$)|(^|/)\.(claude|codebuddy)($|/([^w]|w[^o]|wo[^r]|wor[^k]|work[^t]|workt[^r]|worktr[^e]|worktre[^e]|worktree[^s]|worktrees[^/]|(w(o(r(k(t(r(e(e(s)?)?)?)?)?)?)?)?)?$|worktrees/(\.|[^/]*$)))|(^|/)\.agents/(hooks\.json$|plugins(/|$))|(^|/)(\.config/goose|\.config/kilo|\.config/devin|\.config/gptme|block/goose/config|appdata/roaming/devin)(/|$)|\.cursor/(hooks|mcp)\.json|(^|/)\.claude\.json$|(^|/)(opencode|kilo)\.jsonc?$|(^|/)gptme(\.local)?\.toml$|(^|/)(crush\.json|\.crush\.json|crushrc|\.crushrc)$|(^|/)\.config/crush(/|$)|(^|/)((documents|onedrive[^/]*/[^/]+)/(windows)?powershell|windowspowershell/v1\.0|powershell/7(-preview)?|\.config/powershell)/[^/]*profile\.ps1$|managed-settings|\.mcp\.json'
    # Claude Code's memory notes (as TK-D009 reads them) are the agent's own notes, not the harness's settings
    unless: '(^|/)\.claude/projects/[^/]+/memory/[^/]+\.md$'
    label: harness_config
    reason: changing the agent harness's settings, hooks or plugins
    remedy: Have a person approve the held call; a person changes the agent's settings, hooks and plugins.
    rationale: These files decide which hooks run, Tracekit's among them, and what the agent may do without asking.
  - id: TK-F015
    class: shell
    field: effects
    # Each recognized write or delete target, including redirects and its casefolded form; a newline in the path doesn't
    # end the match. Variables are not expanded, so Qwen Code's QWEN_HOME, CodeBuddy Code's CODEBUDDY_CONFIG_DIR and
    # CODEBUDDY_PROJECT_CONFIG_DIR and Open Interpreter's INTERPRETER_HOME are matched by name. OpenCode's user config
    # (its plugins, Tracekit's too) is ~/.config/opencode; Crush's is ~/.config/crush, and its project or home config is
    # crush.json, .crush.json, crushrc or .crushrc; Kilo Code's are OpenCode's under its own names
    # (.kilo, .kilocode, ~/.config/kilo, kilo.json); Cline's are ~/.cline and its hook folders, .cline/hooks,
    # .clinerules/hooks and Documents/Cline/Hooks. $XDG_CONFIG_HOME/opencode and /kilo, and the folder
    # $XDG_CONFIG_HOME itself, are matched by the variable's name. The agy, goose, Droid and Devin paths are TK-F009's,
    # and a delete of a whole .agents folder (agy's hooks.json with it), or .clinerules or Cline folder (its hooks).
    # PowerShell's profiles are TK-F009's, and
    # $PROFILE by name (`$PROFILE`, `${PROFILE}`, `$global:PROFILE`, `$PROFILE.CurrentUserAllHosts` and the other
    # three), in any case.
    # A file inside one of Claude Code's or CodeBuddy Code's worktrees is judged as TK-F009 judges it. Targets aren't
    # normalised, so a
    # worktree path is still flagged with a `..` among its parts after the worktree, with an expansion or a glob
    # there that can make one (`$`, a backquote, `*`, `?`, `[`, `{`: `x/$D/`, `x/.{.,}/`, `x/.*/`), and when it names
    # only the worktree (`x/`, `x/.`, `x//`).
    # lean: a worktree path with more than 32 parts after the worktree is flagged, so the search for a `..` stays
    # bounded and the fallback engine linear; read deeper if a real worktree nests further
    pattern: '^(?:WRITE_TARGET|DELETE_TARGET):(?:[\w\W]*?[/\\])?(?:\.(?:codex|gemini|opencode|kilo|kilocode|qwen|factory|devin|cline|openhands|copilot|openinterpreter)(?:[/\\]|$)|(?:\.clinerules[/\\]hooks|cline[/\\]hooks)(?:[/\\]|$)|\.github[/\\](?:hooks(?:[/\\]|$)|copilot[/\\]settings[^/\\]*\.json$)|etc[/\\]github-copilot(?:[/\\]|$)|\$\{?(?:XDG_CONFIG_HOME|xdg_config_home)\}?(?:[/\\](?:opencode|kilo)(?:[/\\]|$)|[/\\]?$)|\.(?:claude|codebuddy)(?:$|[/\\](?:[^w]|w[^o]|wo[^r]|wor[^k]|work[^t]|workt[^r]|worktr[^e]|worktre[^e]|worktree[^s]|worktrees[^/\\]|(?:w(?:o(?:r(?:k(?:t(?:r(?:e(?:e(?:s)?)?)?)?)?)?)?)?)?$|worktrees[/\\](?:[./\\]|[^/\\]*$|[^/\\]*[/\\][/\\.]*$|[^/\\]*(?:[/\\][^/\\]*){0,31}?[/\\]\.\.(?:[/\\]|$)|(?:[^/\\]*[/\\]){0,32}?[^/\\$`*?\[{]*[$`*?\[{]|[^/\\]*(?:[/\\][^/\\]*){32})))|\.agents[/\\](?:hooks\.json$|plugins(?:[/\\]|$))|(?:\.config[/\\](?:opencode|kilo|goose|crush|devin|gptme)|block[/\\]goose[/\\]config|appdata[/\\]roaming[/\\]devin)(?:[/\\]|$)|(?:crush\.json|\.crush\.json|crushrc|\.crushrc)$|(?:opencode|kilo)\.jsonc?$|gptme(\.local)?\.toml$|\.claude\.json$|\$\{?(?:QWEN_HOME|CODEBUDDY_CONFIG_DIR|CODEBUDDY_PROJECT_CONFIG_DIR|INTERPRETER_HOME)\}?(?:[/\\]|$)|(?:(?:documents|onedrive[^/\\]*[/\\][^/\\]+)[/\\](?:windows)?powershell|windowspowershell[/\\]v1\.0|powershell[/\\]7(?:-preview)?|\.config[/\\]powershell)[/\\][^/\\]*profile\.ps1$)|^(?:WRITE_TARGET|DELETE_TARGET):\$\{?(?:global:)?profile\}?(?:\.(?:currentuserallhosts|currentusercurrenthost|allusersallhosts|alluserscurrenthost))?$|^DELETE_TARGET:(?:[\w\W]*?[/\\])?(?:\.agents|\.clinerules|cline)[/\\]*$|^(?:WRITE_TARGET|DELETE_TARGET):[\w\W]*?(?:\.cursor[/\\](?:hooks|mcp)\.json|managed-settings|\.mcp\.json)'
    # Claude Code's memory notes, as TK-D008 reads them
    unless: '^(?:WRITE_TARGET|DELETE_TARGET):(?:[\w\W]*?[/\\])?\.claude[/\\]projects[/\\][^/\\]+[/\\]memory[/\\][^/\\]+\.md$'
    label: harness_config
    reason: changing the agent harness's settings, hooks or plugins
    remedy: Have a person approve the held call; a person changes the agent's settings, hooks and plugins.
    rationale: TK-F009 for the shell.

  - id: TK-A061
    class: fs
    tool: Write|Edit
    field: ci_workflow
    # lean: direct Write/Edit only; not a YAML or shell parser, and not generated workflows or actions.
    # A secret must be in the upload option's own argument, or on stdin piped to @-. Two bounded
    # orderings of the URL and data flag; optional YAML quoting at the start of a command.
    # A command starts after a newline, `;`, `&` or `|`, behind up to eight wrapper words, keywords,
    # `(`, `{`, `!` or `X=$(`, each word bounded so the fallback engine stays linear. A double-quoted
    # value reads a backslash and the next character as one pair; one quoted part may come first.
    # No newline, comment or shell separator joins separate commands.
    # Executable path prefixes are unbounded so long valid paths remain covered.
    pattern: '(?:^|[\n;&|])[ \t]*(?:-[ \t]*)?(?:(?:run|script|before_script|after_script|command|bash|pwsh|powershell):[ \t]*(?:[|>][-+]?[ \t]*\r?\n[ \t]*)?|(?:sh|bat|bash|pwsh|powershell)(?:[ \t]*\([ \t]*(?:script:[ \t]*)?|[ \t]+)[\x27\"]{0,2})?[\x27\"]?(?:(?:sudo|doas|env|time|nohup|command|exec|builtin|nice|timeout|if|then|else|elif|do|while|until|[0-9][0-9.]{0,15}[smhd]?|[A-Za-z_][A-Za-z0-9_]*=[^ \t;|&#]{0,64}|-[-A-Za-z0-9]{1,32}(?:=[^ \t;|&#]{0,64})?)[ \t]+|[({!][ \t]*|(?:[A-Za-z_][A-Za-z0-9_]{0,63}=)?\"?(?:\$\(|\x60)[ \t]*){0,8}(?:(?:[./a-zA-Z0-9_-]*/curl|[./a-zA-Z0-9_-]*/wget|curl|wget)\b[^;\r\n|&#]{0,128}(?:(?:-[a-zA-Z]*[dF]|--(?:data(?:-[a-z-]+)?|form(?:-string)?|json|post-data|body-data))(?:[ \t]+|=)?(?:(?:[^\s"\x27@;|&#=]{1,48}=|\x27[^\x27@\r\n;|&#]{0,96}\x27|"(?:[^"\\@\r\n;|&#]|\\.){0,96}")?(?:"(?:[^"\\@\r\n;|&#]|\\.){0,96}\$(?:[A-Za-z_][A-Za-z0-9_]*|\{!?[A-Za-z_][A-Za-z0-9_]*(?:[:=+?#%/^,@\[-][^}\r\n;|&#]{0,48})?\}|\([A-Za-z_][A-Za-z0-9_]*\)|\{env\.[A-Za-z_][A-Za-z0-9_]*\}|[Ee][Nn][Vv]:[A-Za-z_][A-Za-z0-9_]*|\{\{[ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][Jj][Ss][Oo][Nn]\([ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss]|[Gg][Ii][Tt][Hh][Uu][Bb]|[Ee][Nn][Vv])[ \t]*\))[ \t]*\}\})(?:[^"\\\r\n;|&#]|\\.){0,96}"|[^\s"\x27@;|&#]{0,96}\$(?:[A-Za-z_][A-Za-z0-9_]*|\{!?[A-Za-z_][A-Za-z0-9_]*(?:[:=+?#%/^,@\[-][^}\r\n;|&#]{0,48})?\}|\([A-Za-z_][A-Za-z0-9_]*\)|\{env\.[A-Za-z_][A-Za-z0-9_]*\}|[Ee][Nn][Vv]:[A-Za-z_][A-Za-z0-9_]*|\{\{[ \t]*(?:[Ss][Ee][Cc][Rr][Ee][Tt][Ss](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Ee][Nn][Vv](?:\.[A-Za-z_][A-Za-z0-9_.]*|\[[\x27\"][A-Za-z_][A-Za-z0-9_.-]*[\x27\"]\])|[Gg][Ii][Tt][Hh][Uu][Bb](?:\.[Tt][Oo][Kk][Ee][Nn]|\[[\x27\"][Tt][Oo][Kk][Ee][Nn][\x27\"]\])|[Tt][Oo][J