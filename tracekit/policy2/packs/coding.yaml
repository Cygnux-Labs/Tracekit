    # a destructive statement through a database client, as TK-DB001..003 read it for SQL tools: psql -c/--command,
    # mysql/mariadb -e/--execute, mongosh/mongo --eval, clickhouse-client or clickhouse client --query/-q, sqlite3
    # with a bare SQL argument, and redis-cli/valkey-cli/keydb-cli. The flag may be a short-option cluster of up to
    # nine letters (and psql's 0 and 1) ending in c or e (psql -tAc, psql -1c, mysql -Nse) or carry its value attached
    # (-e"..."): letters after the c or e are its value (psql -cvDROP runs vDROP). A longer cluster of the client's
    # flags that take no value, ending in c or e, is held as it is, unread (no one needs one); a value attached to an
    # option that takes one (psql -dmydatabase, mysql -pdevelopment) is no cluster. Up to thirty-two
    # whitespace-separated words (options, a connection URL) may come before the flag, and a docker, podman,
    # docker-compose, kubectl or oc exec wrapper before the client: up to eight words before `exec` (kubectl -n prod,
    # docker compose -f x.yml, docker -H host) and eight after it, then a shell's -c (sh -c, bash -lc) whose string
    # keeps its own quotes, so the SQL or mongo code may open with one.
    # After the flag, up to eight statements may come before the destructive one, where a statement ends at `;` or at
    # `\G`/`\g`: an escaped newline inside a statement does not end it, and a backslash escape counts as one character, so a quoted
    # literal or a multi-line statement cannot hide the destructive one. Only whitespace (or its escaped form) and
    # comments (`--` to the end of a line, `/* */`) may come between the last statement's end and the keyword, which
    # may also follow `WITH …(` or `)` (a data-modifying CTE, or a DELETE after the CTEs) or EXPLAIN with ANALYZE
    # (which runs the statement; plain EXPLAIN doesn't). A DELETE counts only without a WHERE or with an always-true
    # one, as TK-DB003 reads it, may end at a CTE's `)` and may be followed by options (psql -c "DELETE FROM users"
    # -d prod). Literals aren't blanked on a shell line, so a keyword after `;`
    # inside a quoted literal reads as a statement.
    # There is no ROLLBACK exemption: a destructive statement is held even inside a transaction ending
    # in ROLLBACK. The exemption needed a fix every round: a comment could hide the ROLLBACK, and
    # mysql/mariadb treat `\G` and `\g` as statement terminators, so a COMMIT can run
    # inside text the exemption read as one statement. One approval for a test transaction is the price
    # of a rule with no exemption to get around. A SELECT, SHOW, EXPLAIN, a scoped DELETE, a read-only
    # mongo call or a redis read does not match, and neither does a second -c/-e/--command/--execute
