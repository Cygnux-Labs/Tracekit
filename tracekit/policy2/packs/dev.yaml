  - id: TK-F038
    class: shell
    # bash's own network files: a redirection to or from /dev/tcp/host/port or /dev/udp/host/port
    field: target
    pattern: '(?:^|[ /=<>])dev[/\\](?:tcp|udp)[/\\]'
    label: egress
  - id: TK-F039
    class: http
    # a web fetch, to any host, and a web search: a URL alone can carry data (a path or a name), as a query does,
    # where TK-F012 counts only a URL with a query or to a host not on this machine's list
    tool: WebFetch|WebSearch
    pattern: '^'
    label: egress
  - id: TK-F040
    class: mcp
    # an MCP tool whose own name says it sends: send, post, publish, reply, share, tweet, notify, dm, upload, or types
    # or fills text into a page (type, fill, submit), first or after browser_, puppeteer_, playwright_, page_,
    # preview_ or a messaging service's name (slack_, discord_, teams_, telegram_, chat_, mail_, gmail_, email_,
    # whatsapp_, signal_, matrix_, sms_, twilio_): slack_post_message, chat_postMessage, send_message, browser_type
    field: tool
    pattern: '^(?:(?:browser|puppeteer|playwright|page|preview|slack|discord|teams|telegram|chat|gmail|mail|email|whatsapp|signal|matrix|sms|twilio)[_-])?(?:[Ss]end|[Pp]ost|[Pp]ublish|[Rr]eply|[Tt]ype|[Ff]ill|[Ss]ubmit|[Uu]pload|[Ss]hare|[Tt]weet|[Nn]otify|[Dd]m)(?:$|[_A-Z-])'
    label: egress
  - id: TK-F041
    class: email
    # an email send with a recipient: the email class reads `recipients` from to, cc, bcc and recipients, so a send
    # names where the data goes (a mail-reading tool mapped to email reads none)
    field: recipients
    pattern: '.'
    label: egress
  - id: TK-F042
    # Grep (Claude Code's, read whole) over files its glob names, a secret's (`.env*`, `**/.env`, `*.env`, `.aws/**`,
    # `{.env,x}`, `*.{env,txt}`, `.e*`, `[.]env`), or of ripgrep's env type: Grep searches the files the glob or
    # type selects
    tool: Grep
    pattern: '"glob":"(?:[^"\\]{0,1000}[/{,*])?(?:\.(?:[Ss][Ss][Hh]|[Aa][Ww][Ss]|[Gg][Nn][Uu][Pp][Gg])(?:[/*]|"|$)|(?:\.(?:[Ee][Nn][Vv](?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|[Ee][Nn][Vv][Rr][Cc]|[Nn][Ee][Tt][Rr][Cc](?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|[Nn][Pp][Mm][Rr][Cc]|[Pp][Yy][Pp][Ii][Rr][Cc]|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.[Ee][Nn][Vv]~?|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss](?:\.(?:json|ya?ml|ini|toml|cfg|conf|txt|xml|properties|tfrc\.json))?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))[*?,}]?"|\*\.?[Ee][Nn][Vv][*?,}]?"|\.\{(?:[^},"]{0,60},){0,16}[Ee][Nn][Vv][,}][^"]{0,1000}"|\.(?:[Ee]|[Ee][Nn])?\*[^"]{0,1000}"|\[[^]"]{0,16}\.[^]"]{0,16}\][Ee][Nn][Vv][^"]{0,1000}")|"type":"(?:dot)?env"'
    label: secrets_access
  - id: TK-F043
    class: mcp
    # an MCP server's file read (read_file, read_text_file, read_media_file, read_multiple_files, get_file_contents,
    # view_file, open_file; the filesystem and desktop-commander servers' and their kind): any path it names, as
    # TK-F033 reads Read's (a path of its own: a path inside the call read whole, where it may be another
    # argument's text, isn't)
    tool: 'mcp(?::[^/]{1,128}/|__(?:[^_]|_[^_]){1,128}__)(?:read_(?:text_|media_|multiple_)?files?|get_file_contents?|view_file|open_file)'
    field: target
    pattern: '^(?:[^"{]*?[/\\])?(?:\.[Ss][Ss][Hh]|\.[Aa][Ww][Ss]|\.[Gg][Nn][Uu][Pp][Gg])(?:[/\\]|$)|(?:^|[/\\])(?:\.(?:[Ee][Nn][Vv](?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|[Ee][Nn][Vv][Rr][Cc]|[Nn][Ee][Tt][Rr][Cc](?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|[Nn][Pp][Mm][Rr][Cc]|[Pp][Yy][Pp][Ii][Rr][Cc]|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.[Ee][Nn][Vv]~?|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss](?:\.(?:json|ya?ml|ini|toml|cfg|conf|txt|xml|properties|tfrc\.json))?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))$'
    unless: '(?:^|[/\\])(?:\.[Ee][Nn][Vv]\.(?:[Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])|\.ssh[/\\](?:known_hosts(?:\.old)?|config|authorized_keys|[^/\\]{1,255}\.pub)|[A-Za-z0-9_.-]{0,255}(?:id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}\.pub|credentials[A-Za-z0-9_.-]{0,255}\.(?:md|rst|adoc)))$'
    label: secrets_access
  - id: TK-F044
    class: mcp
    # a write to a service's MCP server, on its own host (GitHub, GitLab, Bitbucket, Linear, Notion, Jira and
    # Confluence, Gmail and Google's, Outlook and Microsoft's, Asana, Trello, ClickUp, Monday, Todoist, Airtable,
    # HubSpot, Salesforce, Zendesk, Intercom, Figma, Canva, Dropbox, OneDrive, SharePoint, by its server's name):
    # a tool whose name starts with create, add, update, push, comment, upload, write, edit, append, insert, post,
    # send, reply, share, fork, merge or publish, after one word of its own at most (create_issue,
    # add_issue_comment, create_or_update_file, notion_create_pages, create_draft)
    tool: 'mcp(?::[^/]{0,128}?(?:[Gg][Ii][Tt][Hh][Uu][Bb]|[Gg][Ii][Tt][Ll][Aa][Bb]|[Bb][Ii][Tt][Bb][Uu][Cc][Kk][Ee][Tt]|[Ll][Ii][Nn][Ee][Aa][Rr]|[Nn][Oo][Tt][Ii][Oo][Nn]|[Jj][Ii][Rr][Aa]|[Aa][Tt][Ll][Aa][Ss][Ss][Ii][Aa][Nn]|[Cc][Oo][Nn][Ff][Ll][Uu][Ee][Nn][Cc][Ee]|[Gg][Mm][Aa][Ii][Ll]|[Gg][Oo][Oo][Gg][Ll][Ee]|[Gg][Dd][Rr][Ii][Vv][Ee]|[Dd][Rr][Ii][Vv][Ee]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]|[Aa][Ss][Aa][Nn][Aa]|[Tt][Rr][Ee][Ll][Ll][Oo]|[Cc][Ll][Ii][Cc][Kk][Uu][Pp]|[Mm][Oo][Nn][Dd][Aa][Yy]|[Tt][Oo][Dd][Oo][Ii][Ss][Tt]|[Aa][Ii][Rr][Tt][Aa][Bb][Ll][Ee]|[Hh][Uu][Bb][Ss][Pp][Oo][Tt]|[Ss][Aa][Ll][Ee][Ss][Ff][Oo][Rr][Cc][Ee]|[Zz][Ee][Nn][Dd][Ee][Ss][Kk]|[Ii][Nn][Tt][Ee][Rr][Cc][Oo][Mm]|[Ff][Ii][Gg][Mm][Aa]|[Cc][Aa][Nn][Vv][Aa]|[Dd][Rr][Oo][Pp][Bb][Oo][Xx]|[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]|[Ss][Hh][Aa][Rr][Ee][Pp][Oo][Ii][Nn][Tt])[^/]{0,128}/|__(?:[^_]|_[^_]){0,128}?(?:[Gg][Ii][Tt][Hh][Uu][Bb]|[Gg][Ii][Tt][Ll][Aa][Bb]|[Bb][Ii][Tt][Bb][Uu][Cc][Kk][Ee][Tt]|[Ll][Ii][Nn][Ee][Aa][Rr]|[Nn][Oo][Tt][Ii][Oo][Nn]|[Jj][Ii][Rr][Aa]|[Aa][Tt][Ll][Aa][Ss][Ss][Ii][Aa][Nn]|[Cc][Oo][Nn][Ff][Ll][Uu][Ee][Nn][Cc][Ee]|[Gg][Mm][Aa][Ii][Ll]|[Gg][Oo][Oo][Gg][Ll][Ee]|[Gg][Dd][Rr][Ii][Vv][Ee]|[Dd][Rr][Ii][Vv][Ee]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]|[Aa][Ss][Aa][Nn][Aa]|[Tt][Rr][Ee][Ll][Ll][Oo]|[Cc][Ll][Ii][Cc][Kk][Uu][Pp]|[Mm][Oo][Nn][Dd][Aa][Yy]|[Tt][Oo][Dd][Oo][Ii][Ss][Tt]|[Aa][Ii][Rr][Tt][Aa][Bb][Ll][Ee]|[Hh][Uu][Bb][Ss][Pp][Oo][Tt]|[Ss][Aa][Ll][Ee][Ss][Ff][Oo][Rr][Cc][Ee]|[Zz][Ee][Nn][Dd][Ee][Ss][Kk]|[Ii][Nn][Tt][Ee][Rr][Cc][Oo][Mm]|[Ff][Ii][Gg][Mm][Aa]|[Cc][Aa][Nn][Vv][Aa]|[Dd][Rr][Oo][Pp][Bb][Oo][Xx]|[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee]|[Ss][Hh][Aa][Rr][Ee][Pp][Oo][Ii][Nn][Tt])(?:[^_]|_[^_]){0,128}__).*'
    field: tool
    pattern: '^(?:[A-Za-z0-9]{1,32}[_-])?(?:[Cc]reate|[Aa]dd|[Uu]pdate|[Pp]ush|[Cc]omment|[Uu]pload|[Ww]rite|[Ee]dit|[Aa]ppend|[Ii]nsert|[Pp]ost|[Ss]end|[Rr]eply|[Ss]hare|[Ff]ork|[Mm]erge|[Pp]ublish)(?:$|[_A-Z-])'
    label: egress
  - id: TK-F045
    class: shell
    # a job macOS's launchd starts and keeps running (`launchctl submit … -- cmd`), as TK-F007 reads nohup and setsid
    pattern: '^launchctl(?: [^ ]+){0,8}? submit(?: |$)'
    label: background_spawn
  - id: TK-F013
    # the coding pack's, with a command whose every target is this machine left out: nc, ssh or telnet to it with
    # flags and port numbers (nc -z localhost 5432, ssh -p 2222 localhost; never F, J, S, X, x, c, e or f: a config
    # file, a jump host, a control socket, a proxy, a command), dig, host or nslookup of it with flags that take no
    # value (TK-F047 flags it), and curl to it with the listed options (-H 'Content-Type: …', -d '{"a": 1}', -o
    # out.json), or with no URL left (a glob that matched nothing): it sends nothing off the machine, so it is no
    # egress TK-Q001 records. lean: an option outside the listed ones keeps the label
    # a network command, whatever it names: `curl host/?k=v` and `nslookup data.example` send data without a URL;
    # HTTPie (http, https), xh, socat, sftp, aria2c and openssl s_client too. Not flagged: curl, wget, HTTPie or xh
    # whose every target is on this machine (http://127.0.0.1:8000/, localhost:3000): each other word an option
    # without `:` or `@` (no proxy URL) or a value without `.`, `:` or `@` (/dev/null, %{http_code}); a word that
    # may name another host (a variable the line doesn't give: $URL), or a file (-o out.json), keeps the flag, and
    # so does an option that reads more hosts
    # from a file: curl's -K or --config, wget's -i, --input-file, -e, --execute or --config, alone or in a cluster
    # (-sK, -qi). lean: up to 64 words on either side of the URL (a bound that keeps the fallback engine fast); a host
    # named without a dot reads as a value (`-x box`, a bare `box?k=v`: a one-label name the machine resolves), and a
    # proxy or URL the environment or a startup file gives (http_proxy, ~/.curlrc, ~/.wgetrc) isn't read
    class: shell
    pattern: '^(curl|wget|ssh|scp|sftp|rsync|nc|ncat|netcat|socat|telnet|ftp|dig|nslookup|host|http|https|xh|xhs|aria2c)( |$)|^openssl s_client( |$)'
    unless: '^(?:curl|https?|xhs?)(?: (?:-(?:[^ :@K-][^ :@K]*)?|--(?:[^ :@c][^ :@]*|c(?:[^ :@o][^ :@]*|o(?:[^ :@n][^ :@]*|n(?:[^ :@f][^ :@]*)?)?)?)?|/[^ .:@]*|[^ .:@/\x7f-][^ .:@/\x7f]*)){0,64} (?:(?:[Hh][Tt][Tt][Pp][Ss]?://(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?|(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0):[0-9]{1,5}|(?:127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?)(?:[/?#][^ ]*)?)(?: (?:-(?:[^ :@K-][^ :@K]*)?|--(?:[^ :@c][^ :@]*|c(?:[^ :@o][^ :@]*|o(?:[^ :@n][^ :@]*|n(?:[^ :@f][^ :@]*)?)?)?)?|/[^ .:@]*|[^ .:@/\x7f-][^ .:@/\x7f]*)| (?:(?:[Hh][Tt][Tt][Pp][Ss]?://(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?|(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0):[0-9]{1,5}|(?:127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?)(?:[/?#][^ ]*)?)){0,64}$|^wget(?: (?:-(?:[^ :@ie-][^ :@ie]*)?|--(?:[^ :@cei][^ :@]*|c(?:[^ :@o][^ :@]*|o(?:[^ :@n][^ :@]*|n(?:[^ :@f][^ :@]*)?)?)?|e(?:[^ :@x][^ :@]*|x(?:[^ :@e][^ :@]*)?)?|i(?:[^ :@n][^ :@]*|n(?:[^ :@p][^ :@]*)?)?)?|/[^ .:@]*|[^ .:@/\x7f-][^ .:@/\x7f]*)){0,64} (?:(?:[Hh][Tt][Tt][Pp][Ss]?://(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?|(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0):[0-9]{1,5}|(?:127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?)(?:[/?#][^ ]*)?)(?: (?:-(?:[^ :@ie-][^ :@ie]*)?|--(?:[^ :@cei][^ :@]*|c(?:[^ :@o][^ :@]*|o(?:[^ :@n][^ :@]*|n(?:[^ :@f][^ :@]*)?)?)?|e(?:[^ :@x][^ :@]*|x(?:[^ :@e][^ :@]*)?)?|i(?:[^ :@n][^ :@]*|n(?:[^ :@p][^ :@]*)?)?)?|/[^ .:@]*|[^ .:@/\x7f-][^ .:@/\x7f]*)| (?:(?:[Hh][Tt][Tt][Pp][Ss]?://(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?|(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0):[0-9]{1,5}|(?:127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?)(?:[/?#][^ ]*)?)){0,64}$|^(?:nc|ncat|netcat|ssh|telnet)(?: -[A-EG-IK-RT-WYZabdg-wyz0-9]{1,16}| [0-9]{1,5}){0,8} (?:[A-Za-z0-9_-]{1,64}@)?(?:localhost|127(?:\.[0-9]{1,3}){3}|\[?::1\]?|0\.0\.0\.0)(?: -[A-EG-IK-RT-WYZabdg-wyz0-9]{1,16}| [0-9]{1,5}){0,8}$|^(?:dig|nslookup|host)(?: -[46adlrsuvwCTU]{1,8}){0,4} (?:localhost|127(?:\.[0-9]{1,3}){3}|\[?::1\]?|0\.0\.0\.0)(?: -[46adlrsuvwCTU]{1,8}){0,4}$|^curl(?: (?:-[sSfLivIGOkgjNqRZ0-46#]{1,15}|-[sSfLivIGOkgjNqRZ0-46#]{0,15}[HXdoAmubcewFTrCDE](?:[^ ]+| [^ ]+)|--(?:silent|show-error|fail|fail-with-body|location|include|verbose|compressed|insecure|head|get|remote-name|create-dirs|no-progress-meter|globoff|no-buffer)|--(?:request|header|data|data-raw|data-binary|data-urlencode|json|form|output|user-agent|max-time|connect-timeout|retry|write-out|user|cookie|cookie-jar|referer|upload-file|dump-header) [^ ]+|[A-Za-z0-9_,;:=!?*+{}"$~^&()<>|/#][A-Za-z0-9_,;:=!?*+{}"$~^&()<>|/#-]*)?){0,64} (?:[Hh][Tt][Tt][Pp][Ss]?://)?(?:[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?(?:[/?#][^ ]*)?(?: (?:-[sSfLivIGOkgjNqRZ0-46#]{1,15}|-[sSfLivIGOkgjNqRZ0-46#]{0,15}[HXdoAmubcewFTrCDE](?:[^ ]+| [^ ]+)|--(?:silent|show-error|fail|fail-with-body|location|include|verbose|compressed|insecure|head|get|remote-name|create-dirs|no-progress-meter|globoff|no-buffer)|--(?:request|header|data|data-raw|data-binary|data-urlencode|json|form|output|user-agent|max-time|connect-timeout|retry|write-out|user|cookie|cookie-jar|referer|upload-file|dump-header) [^ ]+|[A-Za-z0-9_,;:=!?*+{}"$~^&()<>|/#][A-Za-z0-9_,;:=!?*+{}"$~^&()<>|/#-]*|(?:[Hh][Tt][Tt][Pp][Ss]?://)?(?:(?:127(?:\.[0-9]{1,3}){3}|\[::1\]|0\.0\.0\.0)(?::[0-9]{1,5})?(?:[/?#][^ ]*)?|[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt](?::[0-9]{1,5})?[/?#][^ .@%\[]*[.@%\[][^ ]*))?){0,64}$|^curl(?: (?:-[sSfLivIGOkgjNqRZ0-46#]{1,15}|-[sSfLivIGOkgjNqRZ0-46#]{0,15}[HXdoAmubcewFTrCDE](?:[^ ]+| [^ ]+)|--(?:silent|show-error|fail|fail-with-body|location|include|verbose|compressed|insecure|head|get|remote-name|create-dirs|no-progress-meter|globoff|no-buffer)|--(?:request|header|data|data-raw|data-binary|data-urlencode|json|form|output|user-agent|max-time|connect-timeout|retry|write-out|user|cookie|cookie-jar|referer|upload-file|dump-header) [^ ]+)){0,64}$'
    label: egress
  - id: TK-F046
    class: mcp
    # a web search server's MCP tool (Exa, Brave Search, Tavily, Perplexity, Kagi, Serper, SerpAPI, Jina,
    # Firecrawl, SearXNG, DuckDuckGo): its query leaves the machine, as WebSearch's does (TK-F039)
    tool: 'mcp(?::(?:[Ee][Xx][Aa]|[Bb][Rr][Aa][Vv][Ee]|[Tt][Aa][Vv][Ii][Ll][Yy]|[Pp][Ee][Rr][Pp][Ll][Ee][Xx][Ii][Tt][Yy]|[Kk][Aa][Gg][Ii]|[Ss][Ee][Rr][Pp][Ee][Rr]|[Ss][Ee][Rr][Pp][Aa][Pp][Ii]|[Jj][Ii][Nn][Aa]|[Ff][Ii][Rr][Ee][Cc][Rr][Aa][Ww][Ll]|[Ss][Ee][Aa][Rr][Xx][Nn][Gg]|[Dd][Uu][Cc][Kk][Dd][Uu][Cc][Kk][Gg][Oo]|[Dd][Dd][Gg])[^/]{0,64}/|__(?:[Ee][Xx][Aa]|[Bb][Rr][Aa][Vv][Ee]|[Tt][Aa][Vv][Ii][Ll][Yy]|[Pp][Ee][Rr][Pp][Ll][Ee][Xx][Ii][Tt][Yy]|[Kk][Aa][Gg][Ii]|[Ss][Ee][Rr][Pp][Ee][Rr]|[Ss][Ee][Rr][Pp][Aa][Pp][Ii]|[Jj][Ii][Nn][Aa]|[Ff][Ii][Rr][Ee][Cc][Rr][Aa][Ww][Ll]|[Ss][Ee][Aa][Rr][Xx][Nn][Gg]|[Dd][Uu][Cc][Kk][Dd][Uu][Cc][Kk][Gg][Oo]|[Dd][Dd][Gg])(?:[^_]|_[^_]){0,64}__).*'
    pattern: '^'
    label: egress
  - id: TK-F047
    class: shell
    # a name lookup of this machine (dig, nslookup or host localhost): flagged as TK-F013 flags any, but no egress
    pattern: '^(?:dig|nslookup|host)(?: -[46adlrsuvwCTU]{1,8}){0,4} (?:localhost|127(?:\.[0-9]{1,3}){3}|\[?::1\]?|0\.0\.0\.0)(?: -[46adlrsuvwCTU]{1,8}){0,4}$'

# Detection (signer/detect.py), recorded only: a shadow incident is kept with the run (tracekit view shows it) and
# holds nothing. Notify in enforce mode needs a webhook, which a laptop's signer has none of.
limits:
  - id: TK-L001
    # a runaway loop: more calls in one minute of a session than an agent makes working (the server pack's)
    match: '*'
    count: true
    max: 300
    window: 60
    scope: session

respond:
  - {trigger: TK-L001, mode: shadow, action: notify}
  # a call that ran after a deny or an unapproved ask: a harness that ran it anyway
  - {trigger: executed_against_policy, mode: shadow, action: notify}
