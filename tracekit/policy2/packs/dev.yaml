  - id: TK-F037
    class: shell
    # a send through a command the coding pack doesn't count as a network one: gh gist create and edit, release
    # upload, release create with an asset (a word with a `.` or `/` after the tag), a mail program (mail, mailx,
    # mutt, msmtp, swaks, sendmail), rclone's copy, sync and move, gh's secret
    # and variable set, repo create with --push, an issue or pull request's create, comment, edit or review, gh api
    # with -X/--method POST, PUT or PATCH or an --input body, a REST endpoint given a field (-f, -F, --field,
    # --raw-field: gh POSTs them) and a GraphQL mutation (a GraphQL query only reads);
    # any git push (and send-pack); PowerShell's Invoke-WebRequest, Invoke-RestMethod (iwr, irm), Send-MailMessage and
