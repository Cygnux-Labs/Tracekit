# The signer's default policy, for coding agents on a laptop: the server pack's tested rules, from the packs it is
# composed of (the coding, browser, data, network, cloud, comms and core packs: secrets, credentials files and the
# cloud metadata service among them), so a secret read or sent, a remote delete, an access or audit-logging change
# and money moved are held or denied here too (#604); plus a visible demo deny and ask, so both are easy to see. They
# also match an MCP tool of that name (mcp:<server>/<name>), which the coding pack only flags.
#
# Three things differ from the server pack. Its detection is lighter here: data sent off the machine after the run read
# a secret is a run condition (TK-Q001, below; in shadow in 1.8: recorded, not held), where the server pack records the
# pair as a sequence, and a runaway loop (TK-L001) and a call that ran against its decision are recorded as shadow
# incidents. A tool no pack maps is flagged, not held: a laptop runs tools and MCP servers no list names; one given a
# command line or a SQL statement to run is held (TK-A062). And a coding agent's messages to its own agents are class
# `harness`: Claude Code's Agent and Task prompts, SendMessage, a subagent's SubagentHandback report, its TodoWrite list
# and a Workflow's script (its agents' calls are each decided by their own hook), and what the hooks map onto those
# names (Task: Qwen Code's agent, Cursor's Task, OpenCode's and Kilo Code's task, Antigravity CLI's invoke_subagent;
# TodoWrite: Qwen Code's todo_write, OpenCode's todowrite). Every rule of no class reads them, but their `target` is
# only the URLs and network addresses they name, not the file names their prose mentions: TK-S004 (a credentials file)
# and TK-F005 (a secret-looking path) don't read them, as a prompt that names ~/.aws/credentials doesn't open it.
# TK-S002 still denies a secret's value in one, and TK-S001 the metadata service's address, as a URL or a bare IPv4
# address in any form. A harness call sets no run label and meets no run condition: it reads no file and runs nothing. A
# SendMessage can leave the machine, so it is flagged (TK-F018); an Agent or Task run remotely is held (TK-F019), as
# none of its calls are decided here. An app's own tool by one of these names (Workflow included) gets the same reading
# here. Every email, payment and database tool's call and every Browser Use action is flagged (TK-F020 to TK-F023), as
# the coding pack flags an MCP call: the server parts' rules for them hold only the harmful forms.
extends: [coding.yaml, browser.yaml, server-data.yaml, server-net.yaml, server-cloud.yaml, server-comms.yaml,
          server-core.yaml]
version: '2026.11-dev-12'
description: dev default (the server pack's rules, unmapped tools flagged, uploads to cloud storage held, a demo deny and a demo ask)
unknown_tools: flag
# a call over 64 KiB, which the policy doesn't read, waits for a person (TK-OVERSIZE as an ask) where the server pack's
# TK-S002 would deny it unread: on a laptop a large file write is ordinary work
oversize: ask

tools:
  Agent: harness             # Claude Code: a subagent's prompt
  Task: harness              # Claude Code's earlier name for Agent, and the other harnesses' (above)
  SendMessage: harness       # Claude Code: a message to a teammate or a running subagent
  SubagentHandback: harness  # Claude Code: a subagent's report to the agent that started it
  TodoWrite: harness         # Claude Code's todo list, and the other harnesses' (above)
  ToolSearch: harness        # Claude Code: loads tools' schemas by name or by a search (`select:Read,Edit`)
  Skill: harness             # Claude Code: loads a skill's instructions by its name
  SlashCommand: harness      # Claude Code: expands a slash command's prompt (`/review`)
  Workflow: harness          # Claude Code: a script that runs its agents (each of their calls has its own hook)
  # Claude Code's tools that act only inside the session (2.1.311's own descriptions): known, so not flagged as
  # unknown tools, and class app, not harness, so every rule that reads the whole call still reads theirs as it did
  # (TK-S002, TK-S004, TK-F005, TK-F012). TK-A062 no longer reads them: they run no command (StructuredOutput's fields
  # are a subagent's answer in its caller's schema), so one given a `command` or `sql` field, which TK-A062 held as an
  # unmapped tool's, isn't held. Artifact, ArtifactData and SendUserFile stay
  # unmapped: their writes publish to claude.ai or send files off the machine to the user's Claude app, so they keep the
  # unknown tool's flag. RemoteTrigger is held (TK-A081)
  TaskStop: app              # stops a background task or agent by its id
  TaskCreate: app            # the session's task list
  TaskUpdate: app
  TaskList: app
  TaskGet: app
  StructuredOutput: app      # a subagent's or workflow agent's result, as JSON in its caller's schema
  ListAgents: app            # lists the session's running agents
  CronCreate: app            # schedules a prompt that runs again in this session (/loop); its calls are decided then
  CronDelete: app
  CronList: app
  AskUserQuestion: app       # asks the person multiple-choice questions and waits
  ReadNotifications: app     # reads the session's queued notices (an agent finished, a comment came in)

deny:
  - id: TK-DEMO-DENY
    tool: '(mcp:[^/]+/)?tracekit_demo_denied'
    pattern: '^'
    reason: demo deny rule
    rationale: Shows what a signed deny looks like.

ask:
  - id: TK-A032
    class: shell
    # each command's argv: a gsutil, gcloud storage or aws s3 copy, move or sync whose destination is a bucket (gs://,
    # s3://), or an Azure blob upload. A coding agent on a laptop rarely writes to cloud storage, and it can be
    # production data; the server pack inherits from the coding pack, not this one, so server agents that publish to
    # buckets aren't held. lean: an rclone remote (name:path) can't be told from a local path cheaply, so rclone
    # uploads aren't read; upgrade: a structural argv rule. Up to eight options (with a value) before the service and
    # again before its verb; `[\w\W]*?` crosses a newline inside an argument; lazy, which halves the fallback
    # engine's rescan
    pattern: '^(?:gsutil (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:cp|mv|rsync) (?:[\w\W]*? )?gs://[^ ]*(?: -[^ ]+(?: [^- ][^ ]*)?)*$|gcloud (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:(?:alpha|beta) )?storage (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:cp|mv|rsync) (?:[\w\W]*? )?gs://[^ ]*(?: -[^ ]+(?: [^- ][^ ]*)?)*$|aws (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}s3 (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:cp|mv|sync) (?:[\w\W]*? )?s3://[^ ]*(?: -[^ ]+(?: [^- ][^ ]*)?)*$|az storage blob (?:upload|upload-batch|sync)(?: |$))'
    reason: uploading to cloud storage
    remedy: Have a person approve the held call, or write the files locally and let a person upload them.
    rationale: A bucket can hold production data or serve the public; a person confirms what a coding agent writes there.
  - id: TK-A056
    class: shell
    field: push
    # here, not in the coding pack, as TK-A032: the server pack extends the coding pack, and a server agent's deploy
    # is often its job (E17's benign corpus has them). Each command's argv, a git push read for where it goes
    # (engine._git_push: git push, git send-pack, hub push): `PUSH:<why>` for a push to main or master (`main`,
    # `HEAD:main`, `refs/heads/master`, `heads/main`), to a branch the line can't tell (no refspec, so push.default
    # picks; HEAD, @ or origin/HEAD; an expansion or a pattern), of tags (--tags, --follow-tags, a refs/tags/ or tags/
    # refspec, `tag v1.0`) or of every branch (--all, --mirror). A force push is TK-D003's deny and a delete push
    # TK-A002's ask. A push of named branches other than main and master stays flagged (TK-F004). Any other command is
    # its argv: publishing a package (npm, pnpm, yarn or bun publish, npm's pu, pub, publ or publi, which it runs as
    # publish, yarn's `npm publish`, uv, poetry or cargo
    # publish, gem push, twine upload, also as any runner's `-m twine`), pushing an image or a chart (docker or podman
    # push and image push, helm push) or deploying (terraform, tofu or terragrunt apply, pulumi up, helm install or
    # upgrade, kubectl apply or delete, but not a dry run kubectl reads as one: engine._kubectl_dry_run's `DRYRUN:`),
    # each after up to eight options with a value or not; a gh or hub api call naming main's or master's ref
    # (git/refs/heads/main, ref=refs/heads/main), merging branches (repos/<o>/<r>/merges, repositories/<id>/merges) or
    # putting or deleting a file (engine._gh_api's `PUSH:contents`, `PUSH:merges` for any form of the merges path,
    # `PUSH:merge-upstream` for a fork's merge-upstream into main or master, and `PUSH:unknown` for a write whose target
    # the line can't tell), read percent-decoded as GitHub reads its path; `gh repo sync <owner/repo>` into main or
    # master (engine._gh_repo_sync's `PUSH:repo-sync`); a GraphQL updateRef or updateRefs, mergeBranch or
    # createCommitOnBranch, read as TK-A002 reads deleteRef; Sapling's `sl push --to main`, `git town ship` (or
    # git-town), and Jujutsu's `jj git push` with no arguments,
    # --all, --tracked, a main or master bookmark (exact: too) or a glob:. And a platform CLI's production deploy, each
    # form read from the CLI's own docs (#892): `vercel --prod` or `--environment production` (`deploy` may be left
    # out) and `vercel promote`, `netlify deploy --prod` or `--prod-if-unlocked`, `fly` or `flyctl deploy`, `wrangler
    # deploy` (and the older `publish`), `firebase deploy`, `gcloud run`, `app` or `functions deploy` (alpha and beta
    # too), `railway up`, `sam`, `serverless`, `sls` or `cdk deploy`, `aws cloudformation deploy` and `gh release
    # create`. `unless` lets through the forms that don't reach production: a gh release saved as a draft (-d or
    # --draft as an option of its own: the word before it is the tag, another option's value, an option with its
    # value after `=`, or one of gh's flags that take no value; after --notes, --title, -R or any other option it is
    # that option's value, and the release is held), a gcloud run deploy with --no-traffic or app deploy with
    # --no-promote, and a wrangler --env, railway
    # --environment or serverless --stage naming a dev, staging, preview, test, qa, sandbox or local environment (any
    # other name, prod included, is held). A preview deploy stays allowed: vercel without --prod, netlify deploy
    # without --prod, wrangler dev, firebase hosting:channel:deploy.
    # A -d or --draft inside a quoted word (`--notes 'see -d'`) is no draft: an `unless` also reads each quoted word
    # as one (engine._quoted).
    # lean: a deploy CLI not named here (heroku, render, wrangler pages or versions deploy) is recorded, not held; a
    # later flag that undoes the exempting one isn't read (docs/limits.md); a gh or hub api GET of
    # main's ref, a merge into any branch and a GraphQL mutation on any ref are held as one on main would be (the
    # method, the base and the ref id aren't read: reading /merges with base=main in either order took the fallback
    # engine seconds on 64 KiB); add a verb here when one is in use
    pattern: '^PUSH:|^(?:npm|pnpm|yarn|bun)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:npm )?publish(?: |$)|^npm(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} pu(?:b(?:li?)?)?(?: |$)|^(?:uv|poetry|cargo)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} publish(?: |$)|^gem(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} push(?: |$)|^twine(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} upload(?: |$)|^[^ ]+(?: [^ ]+){0,8}? -[A-Za-z]*m ?twine(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} upload(?: |$)|^(?:docker|podman)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:image )?push(?: |$)|^helm(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:install|upgrade|push)(?: |$)|^(?:terraform|tofu)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} apply(?: |$)|^terragrunt(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:run-all |stack run |run (?:-[^ ]+ )*)?apply(?:-all)?(?: |$)|^pulumi(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} up(?: |$)|^kubectl(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:apply|delete)(?: |$)|^vercel(?: [^ ]+){0,8}? (?:--prod|--environment[ =]production)(?: |$)|^vercel(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} promote(?: |$)|^netlify(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} deploy(?: [^ ]+){0,8}? --prod(?:-if-unlocked)?(?: |$)|^fly(?:ctl)?(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} deploy(?: |$)|^wrangler(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:deploy|publish)(?: |$)|^firebase(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} deploy(?: |$)|^gcloud(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:(?:alpha|beta) )?(?:run|app|functions) deploy(?: |$)|^railway(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} up(?: |$)|^(?:sam|serverless|sls|cdk)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} deploy(?: |$)|^aws(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} cloudformation deploy(?: |$)|^gh(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} release create(?: |$)|^(?:gh|hub) api [\w\W]*?/git/refs/heads/(?:main|master)(?:[ ?#/]|$)|^(?:gh|hub) api [\w\W]*?(?: |-f|-F|=)ref=refs/heads/(?:main|master)(?: |$)|^(?:gh|hub) api [\w\W]*?\b(?:repos/[^/ ]+/[^/ ]+|repositories/[^/ ]+)/merges(?:[/?#][^ ]*)?(?: |$)|^(?:(?:gh|glab|hub) api|curl|wget|https?|xhs?) [\w\W]*?(?:updateRefs?|mergeBranch|createCommitOnBranch)\b|^sl (?:-[^ ]+(?: [^- ][^ ]*)? ){0,8}push [\w\W]*?(?:--to[ =]|-t ?)(?:remote/)?(?:main|master)(?: |$)|^(?:git (?:-[Cc] [^ ]* |--(?:git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(?:=[^ ]*)? ){0,8}town|git-town) (?:-[^ ]+ )*ship(?: |$)|^jj (?:-[^ ]+(?: [^- ][^ ]*)? ){0,8}git push(?:$| [\w\W]*?(?:(?:(?:-b ?|--(?:bookmark|branch)[ =])[''"]?(?:exact:)?(?:main|master)[''"]?|--all|--tracked)(?: |$)|glob:))'
    unless: '^gh(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} release create (?:(?:[\w\W]*? )?(?:[^- ][^ ]*|-[^ =]+=[^ ]*|-[nFtR][^ ]+|-[dp]|--(?:draft|prerelease|generate-notes|latest|verify-tag|notes-from-tag|fail-on-no-commits)) )?(?:-d|--draft(?:=true)?)(?: |$)|^gcloud(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:(?:alpha|beta) )?run deploy (?:[\w\W]*? )?--no-traffic(?: |$)|^gcloud(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:(?:alpha|beta) )?app deploy (?:[\w\W]*? )?--no-promote(?: |$)|^(?:wrangler(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:deploy|publish) (?:[\w\W]*? )?(?:--env[ =]|-e ?)|railway(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} up (?:[\w\W]*? )?(?:--environment[ =]|-e ?)|(?:serverless|sls)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} deploy (?:[\w\W]*? )?(?:--stage[ =]|-s ?))(?:dev|development|staging|stage|preview|test|testing|qa|sandbox|local)(?: |$)'
    reason: a push to the default branch or of tags, or a publish or deploy
    remedy: Have a person approve the held call, or push a named feature branch and leave the merge or release to a person.
    rationale: These reach a shared branch, a registry or a running system, where others build, install or deploy from them; a person confirms each one.
  - id: TK-A062
    class: unknown
    # every tool but two kinds: Claude Code's PowerShell (in any case), unmapped on purpose (the signer also reads its
    # command as a shell line, and holds it only where a deny or ask rule matches it as bash reads it:
    # signer/service.py), and a Claude Code or Gemini CLI MCP tool (mcp__…), which the signer reads as one too: the MCP
    # rules hold its command or its SQL (TK-S010, TK-S012, TK-A041). An MCP name in a case no pack maps (MCP:x/y) is
    # read here as TK-S010 reads an MCP tool: any value of a command argument holds it (`MCPCMD:`)
    tool: '(?:[^Ppm][\w\W]*|[Pp](?:[^Oo][\w\W]*|[Oo](?:[^Ww][\w\W]*|[Ww](?:[^Ee][\w\W]*|[Ee](?:[^Rr][\w\W]*|[Rr](?:[^Ss][\w\W]*|[Ss](?:[^Hh][\w\W]*|[Hh](?:[^Ee][\w\W]*|[Ee](?:[^Ll][\w\W]*|[Ll](?:[^Ll][\w\W]*|[Ll](?:[\w\W]+))?)?)?)?)?)?)?)?)?|m(?:[^c][\w\W]*|c(?:[^p][\w\W]*|p(?:[^_][\w\W]*|_(?:[^_][\w\W]*)?)?)?)?)?'
    field: run
    # what a tool no pack maps (unknown_tools flags it) is given to run (engine._runs): `CMD:<value>` for each argument
    # TK-S010 reads as a command (command, commands, cmd, cmds, script or shell_command, in any case, at any depth),
    # and each statement under a sql, query or statement argument as every SQL dialect lexes it (classes.sql_read:
    # comments and literals blanked, every blank run a space), `SQL;` before one a `;` ends and `SQL:` before the
    # last. A command line is any value but one plain word (`WORD:<its last /-part>`; letters, digits, `_ . : / -`: a
    # list or an object, a blank, a shell metacharacter or expansion makes one), and a plain word that changes the
    # machine on its own: reboot, shutdown, halt, poweroff or killall5 (every other program needs arguments to do harm).
    # A statement is held when it writes or changes the schema or access (INSERT, REPLACE or MERGE INTO; UPDATE x
    # [alias] SET; DELETE FROM, DELETE x FROM, DELETE x; DROP an object; TRUNCATE x; ALTER an object; CREATE USER or
    # ROLE; GRANT or REVOKE on or to something; COPY to or from a program or a file; a CTE; DO), or is a SELECT, CREATE,
    # EXEC or CALL a `;` ends. What the tool runs it on, and how, is its own, so no rule reads its effect; the server
    # pack holds every unmapped tool, the laptop these.
    # lean: a search in English shaped like one of these (`delete file from repo`, `truncate text`) is held too, and a
    # statement under another argument name (input, text, q) or behind a leading `(` or EXPLAIN is flagged, not held,
    # as is a bare SELECT; name such a tool in a policy of your own (`tools:` sql) if it runs SQL
    pattern: '^MCPCMD:|^CMD:|^WORD:(?:[Rr][Ee][Bb][Oo][Oo][Tt]|[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|[Hh][Aa][Ll][Tt]|[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|[Kk][Ii][Ll][Ll][Aa][Ll][Ll]5)$|^SQL[:;](?:[Ii][Nn][Ss][Ee][Rr][Tt]|[Rr][Ee][Pp][Ll][Aa][Cc][Ee])(?: (?:[Ii][Gg][Nn][Oo][Rr][Ee]|[Ll][Oo][Ww]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|[Dd][Ee][Ll][Aa][Yy][Ee][Dd]|[Hh][Ii][Gg][Hh]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy])| [Oo][Rr] [A-Za-z]+)* [Ii][Nn][Tt][Oo]\b|^SQL[:;][Mm][Ee][Rr][Gg][Ee] [Ii][Nn][Tt][Oo]\b|^SQL[:;][Uu][Pp][Dd][Aa][Tt][Ee](?: (?:[Oo][Nn][Ll][Yy]|[Ll][Oo][Ww]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|[Ii][Gg][Nn][Oo][Rr][Ee])| [Oo][Rr] [A-Za-z]+)* [^ ,;]+(?: (?:[Aa][Ss] )?[^ ,;]+)? [Ss][Ee][Tt]\b|^SQL[:;][Dd][Ee][Ll][Ee][Tt][Ee](?: (?:[Ll][Oo][Ww]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|[Qq][Uu][Ii][Cc][Kk]|[Ii][Gg][Nn][Oo][Rr][Ee]))* (?:[Ff][Rr][Oo][Mm]\b|[^ ,;]+(?: ?, ?[^ ,;]+)* [Ff][Rr][Oo][Mm]\b|[^ ,;]+(?: [Ww][Hh][Ee][Rr][Ee]\b|$))|^SQL[:;][Dd][Rr][Oo][Pp] (?:[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] )?(?:[Tt][Aa][Bb][Ll][Ee]|[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]|[Ss][Cc][Hh][Ee][Mm][Aa]|[Ii][Nn][Dd][Ee][Xx]|[Vv][Ii][Ee][Ww]|[Uu][Ss][Ee][Rr]|[Rr][Oo][Ll][Ee]|[Oo][Ww][Nn][Ee][Dd]|[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Cc][Ee][Dd][Uu][Rr][Ee]|[Tt][Rr][Ii][Gg][Gg][Ee][Rr]|[Ss][Ee][Qq][Uu][Ee][Nn][Cc][Ee]|[Tt][Yy][Pp][Ee]|[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn]|[Mm][Aa][Tt][Ee][Rr][Ii][Aa][Ll][Ii][Zz][Ee][Dd]|[Tt][Aa][Bb][Ll][Ee][Ss][Pp][Aa][Cc][Ee]|[Pp][Oo][Ll][Ii][Cc][Yy]|[Ee][Vv][Ee][Nn][Tt]|[Ll][Oo][Gg][Ii][Nn]|[Ii][Ff])\b|^SQL[:;][Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee] (?:[Tt][Aa][Bb][Ll][Ee] )?(?:[Oo][Nn][Ll][Yy] )?[^ ,;]+|^SQL[:;][Aa][Ll][Tt][Ee][Rr] (?:[Tt][Aa][Bb][Ll][Ee]|[Uu][Ss][Ee][Rr]|[Rr][Oo][Ll][Ee]|[Ll][Oo][Gg][Ii][Nn]|[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]|[Ss][Cc][Hh][Ee][Mm][Aa]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Dd][Ee][Ff][Aa][Uu][Ll][Tt]|[Ii][Nn][Dd][Ee][Xx]|[Vv][Ii][Ee][Ww]|[Ss][Ee][Qq][Uu][Ee][Nn][Cc][Ee]|[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Cc][Ee][Dd][Uu][Rr][Ee]|[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn]|[Pp][Oo][Ll][Ii][Cc][Yy]|[Tt][Yy][Pp][Ee]|[Ss][Ee][Rr][Vv][Ee][Rr]|[Tt][Aa][Bb][Ll][Ee][Ss][Pp][Aa][Cc][Ee])\b|^SQL[:;][Cc][Rr][Ee][Aa][Tt][Ee] (?:[Oo][Rr] [Rr][Ee][Pp][Ll][Aa][Cc][Ee] )?(?:[Uu][Ss][Ee][Rr]|[Rr][Oo][Ll][Ee]|[Ll][Oo][Gg][Ii][Nn])\b|^SQL[:;][Gg][Rr][Aa][Nn][Tt] (?:[^ ]+ ){0,16}?[Oo][Nn]\b|^SQL[:;][Gg][Rr][Aa][Nn][Tt] [^ ,;]+(?: ?, ?[^ ,;]+)* [Tt][Oo]\b|^SQL[:;][Rr][Ee][Vv][Oo][Kk][Ee] (?:[^ ]+ ){0,16}?[Oo][Nn]\b|^SQL[:;][Rr][Ee][Vv][Oo][Kk][Ee] [^ ,;]+(?: ?, ?[^ ,;]+)* [Ff][Rr][Oo][Mm]\b|^SQL[:;][Cc][Oo][Pp][Yy] (?:[^ ]+ ){0,64}?(?:[Tt][Oo]|[Ff][Rr][Oo][Mm]) (?:[Pp][Rr][Oo][Gg][Rr][Aa][Mm]\b|'''')|^SQL[:;][Ww][Ii][Tt][Hh] (?:[Rr][Ee][Cc][Uu][Rr][Ss][Ii][Vv][Ee] )?[^ ,;]+(?: ?\([^)]*\))? [Aa][Ss] ?\(|^SQL[:;][Dd][Oo] (?:[Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee] [^ ]+ )?''''|^SQL;(?:[Ss][Ee][Ll][Ee][Cc][Tt]|[Cc][Rr][Ee][Aa][Tt][Ee]|[Ee][Xx][Ee][Cc]|[Ee][Xx][Ee][Cc][Uu][Tt][Ee]|[Cc][Aa][Ll][Ll])\b'
    reason: an unmapped tool given a command or a SQL statement to run
    remedy: Have a person approve the held call, or map the tool in a policy of your own (`tools:`), to `shell` or `sql` so the rules read what it runs, or to `app` if it runs nothing.
    rationale: Tracekit can't read what an unmapped tool does with a command or a query, and the server pack holds every unmapped tool; a person confirms these.
  - id: TK-F019
    class: harness
    tool: 'Agent|Task'
    # a subagent that runs remotely: this signer decides none of its calls, so the prompt is the last thing it reads
    pattern: '"isolation":"remote"'
    reason: a subagent that runs where Tracekit doesn't decide its calls
    remedy: Have a person approve the held call, or run the subagent locally, where each of its calls is decided.
    rationale: A remote subagent's tool calls aren't decided or recorded here; a person confirms what it is sent to do.
  - id: TK-A081
    tool: RemoteTrigger
    # Claude Code's routines (/schedule): a create, update, run or webhook trigger starts or changes a cloud agent, as
    # TK-F019's remote subagent; list, get, list_runs and get_run_log only read (still flagged: an unmapped tool). The
    # whole call as sorted-key JSON, so only its own top-level action exempts it
    pattern: '^'
    unless: '^\{"action":"(?:list|get|list_runs|get_run_log)"[,}]'
    reason: a cloud routine that runs where Tracekit doesn't decide its calls
    remedy: Have a person approve the held call, or run the task in this session, where each of its calls is decided.
    rationale: A routine runs Claude Code in the cloud on a schedule or an event; none of its tool calls are decided or recorded here, so a person confirms what it is set up to do.
  - id: TK-Q001
    # a run condition (docs/policy-v2.md#run-conditions): a call labelled egress (TK-F012 a URL, TK-F013 a network
    # command, TK-F024 an upload, TK-F037 to TK-F041 below) once the run carries secrets_access (a read of a secret
    # ran in it or in another run of its requester, this call included: a command that reads a secret and sends it, or
    # a credential store read with a person's approval; below). The server pack records the same pair as its TK-Q001
    # sequence. A run that read no secret sends as before.
    # In shadow (1.8): each such call is recorded with TK-Q001 and its run_labels, as a flag, and runs; it becomes an
    # ask once a week of normal projects measures what its holds cost (docs/limits.md#run-conditions-18)
    field: labels
    pattern: '(?:^| )egress(?: |$)'
    when: {run_has: [secrets_access]}
    mode: shadow
    reason: data sent off the machine after the run read a secret
    remedy: Have a person approve the held call, or send it from a new session that has read no secret.
    rationale: A secret the agent read can leave in any request it sends afterwards; a person confirms each send in such a run.
  - id: TK-Q002
    # a send from a process left running in the background: a call labelled egress that is also labelled
    # background_spawn (TK-F007 nohup, setsid, disown and the like, TK-F014 a trailing &, TK-F008 run_in_background),
    # whatever the run carries: decided now, it may run after the run reads a secret (run labels apply in the order
    # calls are decided: docs/limits.md#run-conditions-18). In shadow with TK-Q001, and enforced with it
    field: labels
    pattern: '(?:^| )background_spawn(?: [a-z_]{1,48}){0,16} egress(?: |$)'
    mode: shadow
    reason: data sent by a command left running in the background
    remedy: Have a person approve the held call, or run the send in the foreground once its data is ready.
    rationale: A background job decided before the run reads a secret can send it afterwards; each such send is kept on the record.
  - id: TK-DEMO-ASK
    tool: '(mcp:[^/]+/)?tracekit_demo_ask'
    pattern: '^'
    reason: demo ask rule
    rationale: Shows a call held for a person's approval.

flag:
  - id: TK-F018
    class: harness
    tool: SendMessage
    # a message to another agent: a teammate or a running subagent may run elsewhere, so the message is kept on the
    # record as one that can leave the machine
    pattern: '^'
    label: agent_message
  - id: TK-F020
    class: email
    # every email tool's call: outbound mail, kept on the record (TK-M003 holds a mass email, TK-P001 a recipient that
    # came only from untrusted content)
    pattern: '^'
    label: outbound_email
  - id: TK-F021
    class: payment
    # every payment tool's call, kept on the record (TK-M001, TK-M002 and TK-M005 hold money moved)
    pattern: '^'
    label: payment
  - id: TK-F022
    class: sql
    # every database query, kept on the record as an MCP call is (TK-F006): the server-data rules read a query's
    # SQL, and a postgres or sqlite MCP tool is class sql, not mcp, once they do
    pattern: '^'
    label: database_query
  - id: TK-F023
    class: browser
    # every Browser Use action, kept on the record as a browser MCP tool's call is (TK-F006)
    pattern: '^'
    label: browser_action

  # What sets the run labels TK-Q001 reads (docs/policy-v2.md#run-conditions), and the egress it reads besides the
  # coding pack's (TK-F012 a URL, TK-F013 a network command, TK-F024 an upload). secrets_access is set by a read of
  # a secret: a file one is kept in (.env and its kind, .envrc, .netrc, a credentials file, .ssh/, .aws/, .gnupg/,
  # .npmrc, .pypirc, gh's hosts.yml, an SSH private key's id_rsa, id_dsa, id_ecdsa or id_ed25519 anywhere) read by a
  # tool that reads it (TK-F033), a command that prints or copies it (TK-F034) or a redirection into a command
  # (TK-F035); a credential store's (TK-F031, TK-F036, and the coding
  # pack's held reads: TK-A020, TK-A021, TK-A035 to TK-A038, TK-A052, TK-A053, once a person approves one). A call
  # that only names such a file (ls, git check-ignore, ssh-keygen -R, a write) is TK-F005's, which sets no run label.
  # Files never secret are left out: in .ssh/, known_hosts, config, authorized_keys and a public key (*.pub, and an
  # SSH key's .pub anywhere); a template (.env.example, .env.sample, .env.template, .env.dist); prose named for
  # credentials (*.md, *.rst, *.adoc). ~/.aws/config stays: the AWS CLI reads keys from it as from credentials. A
  # harness call (class harness) sets no label and meets no run condition.
  # lean: a path a pipe gives xargs (`echo .env | xargs cat`), one a script reads (python x.py) and a variable's value
  # aren't read as a read of it; label them in a rule of your own
  - id: TK-F031
    class: shell
    # a secret printed into the agent's context: the whole environment (env or printenv with nothing but options),
    # printenv of a name shaped like a secret's, or echo or printf of one as a variable ($X, ${X}): a name holding
    # SECRET, TOKEN, PASSWORD, PASSWD, PASSPHRASE, CREDENTIAL, API_KEY, ACCESS_KEY or PRIVATE_KEY (APIKEY too), in
    # upper, lower or title case; and a command that prints a stored credential: git credential fill (and a helper's
    # get), gcloud auth print-access-token and print-identity-token, aws configure get of a key, export-credentials
    # and sts get-session-token, assume-role or get-federation-token, az account get-access-token, gpg
    # --export-secret-keys, heroku config, docker or podman inspect (a container's environment) and ps with BSD's e
    # (each process's environment) or macOS's -E. lean: a name of any other shape (DB_URL, STRIPE_SK) and a value
    # printed another way (a script, set, declare -p) aren't read
    pattern: '^(?:printenv|env)(?: -[^ ]+)*$|^printenv(?: [^ ]+){0,64}? [A-Za-z0-9_]{0,64}(?:SECRET|Secret|secret|TOKEN|Token|token|PASSWORD|Password|password|PASSWD|passwd|PASSPHRASE|Passphrase|passphrase|CREDENTIAL|Credential|credential|API_?KEY|Api_?Key|api_?key|ACCESS_?KEY|Access_?Key|access_?key|PRIVATE_?KEY|Private_?Key|private_?key)[A-Za-z0-9_]{0,64}(?: |$)|^(?:echo|printf)(?: [^ ]+){0,64}? [^ ]{0,64}\$\{?[A-Za-z0-9_]{0,64}(?:SECRET|Secret|secret|TOKEN|Token|token|PASSWORD|Password|password|PASSWD|passwd|PASSPHRASE|Passphrase|passphrase|CREDENTIAL|Credential|credential|API_?KEY|Api_?Key|api_?key|ACCESS_?KEY|Access_?Key|access_?key|PRIVATE_?KEY|Private_?Key|private_?key)|^git(?: -[^ ]{1,32}(?: [^- ][^ ]{0,90})?){0,8}? credential(?:-[A-Za-z0-9]+)? (?:fill|get)(?: |$)|^gcloud(?: [^ ]+){0,32}? auth (?:application-default )?print-(?:access|identity)-token(?: |$)|^aws(?: [^ ]+){0,32}? (?:configure get (?:[^ ]{0,64}\.)?aws_(?:secret_access_key|session_token|access_key_id)|configure export-credentials|sts (?:get-session-token|assume-role[a-z-]{0,32}|get-federation-token))(?: |$)|^az(?: [^ ]+){0,32}? account get-access-token(?: |$)|^gpg2?(?: [^ ]+){0,32}? --export-secret-(?:sub)?keys(?:[ =]|$)|^heroku(?: [^ ]+){0,32}? config(?::get)?(?: |$)|^(?:docker|podman)(?: -[^ ]{1,32}(?: [^- ][^ ]{0,90})?){0,8}? (?:container )?inspect(?: |$)|^ps(?: [^ ]+){0,32}? (?:[A-Za-z]{0,16}e[A-Za-z]{0,16}|-[A-Za-z]{0,16}E[A-Za-z]{0,16})(?: |$)'
    label: secrets_access
  - id: TK-F032
    # a file in a download folder (~/Downloads/x, $HOME/Downloads/x, /Users/me/Downloads/x, /home/me/Downloads/x,
    # C:\Users\me\Downloads\x, or a path that starts with Downloads/, in any case) that a call acts on: content from
    # outside that reached the machine through no tool the policy reads, as a web page's does, so it labels the run
    # untrusted_content where a run condition reads that label. A URL's downloads/ (python.org/downloads/) is no such
    # folder. lean: only a folder named Downloads in a home folder or at the start of a path (not one under /mnt/c
    # or another mount, nor a localized name such as Téléchargements); label them in a rule of your own
    field: target
    pattern: '(?:^|[\s\"''=@])(?:(?:~|\$HOME|\$\{HOME\}|/[Uu]sers/[^/\\\s\"'']{1,255}|/home/[^/\\\s\"'']{1,255}|/root|[A-Za-z]:[/\\][Uu]sers[/\\][^/\\\s\"'']{1,255})[/\\])?[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][/\\]'
    label: untrusted_content
  - id: TK-F033
    class: fs
    # a secret file read by a file tool that reads it (Read and Grep; the other harnesses' read tools are mapped to
    # Read): any path argument
    tool: Read|Grep
    field: path
    pattern: '(?:^|[/\\])(?:\.ssh|\.aws|\.gnupg)(?:[/\\]|$)|(?:^|[/\\])(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))$'
    unless: '(?:^|[/\\])(?:\.[Ee][Nn][Vv]\.(?:[Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])|\.ssh[/\\](?:known_hosts(?:\.old)?|config|authorized_keys|[^/\\]{1,255}\.pub)|[A-Za-z0-9_.-]{0,255}(?:id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}\.pub|credentials[A-Za-z0-9_.-]{0,255}\.(?:md|rst|adoc)))$'
    label: secrets_access
  - id: TK-F034
    class: shell
    # a secret file as an operand of a command that reads it (cat, less, head, tail, base64, jq, source and `.`,
    # dd if=, curl -d @ and the like; grep and its kind, sed and awk after their pattern or script word, which only
    # names what it matches), as any operand but the last of one that copies it (cp, mv, ln, install, rsync, scp: the
    # last is where it goes), or anywhere in an interpreter's words (python -c, node -e, a script's arguments). One
    # read of one file never secret (above), after options and a grep-like's pattern, or a copy of one, is exempt.
    # lean: a pattern file (grep -f .env) is read as the pattern word, and a copy into .ssh/, .aws/ or .gnupg/ labels
    # as a copy out of one (a folder's name is read up to its separator, which keeps the search linear); an
    # exemption reads at most 16 options and a path word of 1,000 characters (a longer one is labelled)
    pattern: '^(?:cat|tac|nl|less|more|most|head|tail|bat|batcat|view|vi|vim|nvim|nano|emacs|ed|cut|sort|uniq|strings|od|xxd|hexdump|base64|base32|basenc|uuencode|jq|yq|diff|cmp|comm|paste|join|column|fold|fmt|iconv|dd|dotenv|env-cmd|tar|zip|gzip|bzip2|xz|zstd|7z|openssl|gpg|gpg2|age|curl|wget|http|https|xh|pbcopy|xclip|wl-copy)(?: [^\n]*?)?[ =@/\\](?:(?:\.ssh|\.aws|\.gnupg)(?:[/\\]| |$)|(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))(?: |$))|^(?:source|\.)(?: [^\n]*?)?[ =@/\\](?:(?:\.ssh|\.aws|\.gnupg)(?:[/\\]| |$)|(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))(?: |$))|^(?:grep|egrep|fgrep|zgrep|rg|ag|ack|sed|awk|gawk|mawk|nawk)(?: -[^ ]+){0,16} [^- ][^ ]* (?:[^\n]*?[ =@/\\])?(?:(?:\.ssh|\.aws|\.gnupg)(?:[/\\]| |$)|(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))(?: |$))|^(?:cp|mv|ln|install|rsync|scp|ditto)(?: [^\n]*?)?[ =@/\\](?:(?:\.ssh|\.aws|\.gnupg)[/\\]|(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255})) [^ ])|^(?:python[0-9.]*|pypy[0-9.]*|node|nodejs|deno|bun|ruby|perl|php|osascript|pwsh|powershell|Rscript|lua)(?: [^\n]*?)?[/\s\"''=:@(](?:(?:\.ssh|\.aws|\.gnupg)[/\\]|(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))(?:$|[/\s\"''\\),;]))'
    unless: '^[A-Za-z0-9_.-]+(?: -[A-Za-z0-9=-]+){0,16} (?:[^ ]{0,1000}[/\\])?(?:\.[Ee][Nn][Vv]\.(?:[Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])|\.ssh[/\\](?:known_hosts(?:\.old)?|config|authorized_keys|[^/ ]{1,255}\.pub)|[A-Za-z0-9_.-]{0,255}(?:id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}\.pub|credentials[A-Za-z0-9_.-]{0,255}\.(?:md|rst|adoc)))$|^(?:cp|mv|ln|install|rsync|scp|ditto)(?: -[A-Za-z0-9=-]+){0,16} (?:[^ ]{0,1000}[/\\])?(?:\.[Ee][Nn][Vv]\.(?:[Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])|\.ssh[/\\](?:known_hosts(?:\.old)?|config|authorized_keys|[^/ ]{1,255}\.pub)|[A-Za-z0-9_.-]{0,255}(?:id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}\.pub|credentials[A-Za-z0-9_.-]{0,255}\.(?:md|rst|adoc))) [^ ]+$|^(?:grep|egrep|fgrep|zgrep|rg|ag|ack|sed|awk|gawk|mawk|nawk)(?: -[A-Za-dg-z0-9=]+){0,16} [^- ][^ ]*(?: -[A-Za-dg-z0-9=]+){0,16} (?:[^ ]{0,1000}[/\\])?(?:\.[Ee][Nn][Vv]\.(?:[Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])|\.ssh[/\\](?:known_hosts(?:\.old)?|config|authorized_keys|[^/ ]{1,255}\.pub)|[A-Za-z0-9_.-]{0,255}(?:id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}\.pub|credentials[A-Za-z0-9_.-]{0,255}\.(?:md|rst|adoc)))$'
    label: secrets_access
  - id: TK-F035
    class: shell
    # a secret file redirected into a command (`< .env`, `done < .env`, `3< .env`); a line whose one redirection is of
    # a file never secret is exempt
    field: line
    pattern: '(?:^|[^<0-9&])[0-9]{0,2}< ?[\"'']?(?:[^ ;&|<>()\"''\n]{0,1000}[/\\])?(?:(?:\.ssh|\.aws|\.gnupg)(?:[/\\]|[\"'']|$|[ ;&|)])|(?:\.(?:env(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|envrc|netrc(?:[.-][A-Za-z0-9_]{1,64}){0,8}~?|npmrc|pypirc|config[/\\]gh[/\\]hosts\.ya?ml)|[A-Za-z0-9_.-]{0,255}(?:\.env~?|credentials(?:\.[A-Za-z0-9_-]{1,64})?(?:\.json)?|id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}))[\"'']?(?:$|[ ;&|)]))'
    unless: '^[^<]*< ?[\"'']?(?:[^ ;&|<>()\"''\n]{0,1000}[/\\])?(?:\.[Ee][Nn][Vv]\.(?:[Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])|\.ssh[/\\](?:known_hosts(?:\.old)?|config|authorized_keys|[^/ ;&|<>()"''\n]{1,255}\.pub)|[A-Za-z0-9_.-]{0,255}(?:id_(?:rsa|dsa|ecdsa|ed25519)[A-Za-z0-9_.-]{0,255}\.pub|credentials[A-Za-z0-9_.-]{0,255}\.(?:md|rst|adoc)))[\"'']?(?:[ ;&|)][^<]*)?$'
    label: secrets_access
  - id: TK-F036
    class: mcp
    # a password manager's MCP tool that reads an item (1Password, Bitwarden, LastPass, Keeper, Dashlane, Proton Pass,
    # KeePass): any tool on its server but one that lists, searches, writes or locks
    tool: 'mcp(?::[^/]*?(?:[Oo]ne[_-]?[Pp]assword|1[Pp]assword|[Bb]it[Ww]arden|[Ll]ast[Pp]ass|[Kk]eeper|[Dd]ashlane|[Pp]roton[_-]?[Pp]ass|[Kk]ee[Pp]ass)[^/]*/|__(?:[^_]|_[^_])*?(?:[Oo]ne[_-]?[Pp]assword|1[Pp]assword|[Bb]it[Ww]arden|[Ll]ast[Pp]ass|[Kk]eeper|[Dd]ashlane|[Pp]roton[_-]?[Pp]ass|[Kk]ee[Pp]ass)(?:[^_]|_[^_])*__).*'
    field: tool
    pattern: '^'
    unless: '^(?:list|search|find|create|add|new|update|edit|delete|remove|move|archive|lock|status|whoami|sync|help)(?:[_-]|$)'
    label: secrets_access
  - id: TK-F037
    class: shell
    # a send through a command the coding pack doesn't count as a network one: gh gist create, release upload, an issue
    # or pull request's create, comment, edit or review with a body file (-F, --body-file), gh api with -X/--method
    # POST, PUT or PATCH or an --input body; any git push (and send-pack); ping, traceroute, tracepath, mtr or arping of
    # a name a substitution or variable builds (the name a DNS lookup sends)
    pattern: '^gh(?: -[^ ]{1,32}(?: [^- ][^ ]{0,90})?){0,8}? (?:gist create|release upload)(?: |$)|^gh(?: -[^ ]{1,32}(?: [^- ][^ ]{0,90})?){0,8}? (?:issue|pr) (?:create|comment|edit|review)(?: [^ ]+){0,32}? (?:-F|--body-file)(?:[ =]|$)|^gh(?: -[^ ]{1,32}(?: [^- ][^ ]{0,90})?){0,8}? api(?: [^ ]+){0,32}? (?:(?:-X|--method)[ =]?(?:POST|PUT|PATCH|[Pp]ost|[Pp]ut|[Pp]atch)|--input)(?:[ =]|$)|^git(?: -[^ ]{1,32}(?: [^- ][^ ]{0,90})?){0,8}? (?:push|send-pack)(?: |$)|^(?:ping6?|traceroute6?|tracepath|mtr|arping)(?: [^ ]+){0,32}? [^ ]{0,1000}[$\x60]'
    label: egress
  - id: TK-F038
    class: shell
    # bash's own network files: a redirection to or from /dev/tcp/host/port or /dev/udp/host/port
    field: target
    pattern: '(?:^|[ /=<>])dev[/\\](?:tcp|udp)[/\\]'
    label: egress
  - id: TK-F039
    class: http
    # a web fetch, to any host: its URL alone can carry data (a path or a name), where TK-F012 counts only a URL with
    # a query or to a host not on this machine's list
    tool: WebFetch
    pattern: '^'
    label: egress
  - id: TK-F040
    class: mcp
    # an MCP tool whose own name says it sends: send, post, publish, reply, share, tweet, notify, dm, upload, or types
    # or fills text into a page (type, fill, submit), first or after browser_, puppeteer_, playwright_, page_,
    # preview_ or a messaging service's name (slack_, discord_, teams_, telegram_, chat_, mail_, gmail_, email_,
    # whatsapp_, signal_, matrix_, sms_, twilio_): slack_post_message, chat_postMessage, send_message, browser_type
    field: tool
    pattern: '^(?:(?:browser|puppeteer|playwright|page|preview|slack|discord|teams|telegram|chat|gmail|mail|email|whatsapp|signal|matrix|sms|twilio)[_-])?(?:[Ss]end|[Pp]ost|[Pp]ublish|[Rr]eply|[Tt]ype|[Ff]ill|[Ss]ubmit|[Uu]pload|[Ss]hare|[Tt]weet|[Nn]otify|[Dd]m)(?:$|[_A-Z-])'
    label: egress
  - id: TK-F041
    class: email
    # an email send with a recipient: the email class reads `recipients` from to, cc, bcc and recipients, so a send
    # names where the data goes (a mail-reading tool mapped to email reads none)
    field: recipients
    pattern: '.'
    label: egress

# Detection (signer/detect.py), recorded only: a shadow incident is kept with the run (tracekit view shows it) and
# holds nothing. Notify in enforce mode needs a webhook, which a laptop's signer has none of.
limits:
  - id: TK-L001
    # a runaway loop: more calls in one minute of a session than an agent makes working (the server pack's)
    match: '*'
    count: true
    max: 300
    window: 60
    scope: session

respond:
  - {trigger: TK-L001, mode: shadow, action: notify}
  # a call that ran after a deny or an unapproved ask: a harness that ran it anyway
  - {trigger: executed_against_policy, mode: shadow, action: notify}
