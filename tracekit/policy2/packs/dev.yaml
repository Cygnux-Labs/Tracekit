# The signer's default policy, for coding agents on a laptop: the server pack's tested rules, from the packs it is
# composed of (the coding, browser, data, network, cloud, comms and core packs: secrets, credentials files and the
# cloud metadata service among them), so a secret read or sent, a remote delete, an access or audit-logging change
# and money moved are held or denied here too (#604); plus a visible demo deny and ask, so both are easy to see. They
# also match an MCP tool of that name (mcp:<server>/<name>), which the coding pack only flags.
#
# Three things differ from the server pack. Its shadow detection isn't here. A tool no pack maps is flagged, not
# held: a laptop runs tools and MCP servers no list names; one given a command line or a SQL statement to run is held
# (TK-A062). And a coding agent's messages to its own agents are class `harness`: Claude Code's Agent and Task
# prompts, SendMessage, a subagent's SubagentHandback report, its TodoWrite list and a Workflow's script (its agents'
# calls are each decided by their own hook), and what the hooks map onto those names (Task: Qwen Code's agent,
# Cursor's Task, OpenCode's and Kilo Code's task, Antigravity CLI's invoke_subagent; TodoWrite: Qwen Code's
# todo_write, OpenCode's todowrite). Every
# rule of no class reads them, but their `target` is only the URLs and network addresses they name, not the file
# names their prose mentions: TK-S004 (a credentials file) and TK-F005 (a secret-looking path) don't read them, as a
# prompt that names ~/.aws/credentials doesn't open it. TK-S002 still denies a secret's value in one, and TK-S001 the
# metadata service's address, as a URL or a bare IPv4 address in any form. A SendMessage can leave the machine, so
# it is flagged (TK-F018); an Agent or Task run remotely is held (TK-F019), as none of its calls are decided here. An
# app's own tool by one of these names (Workflow included) gets the same reading here. Every email, payment and database tool's call and
# every Browser Use action is flagged (TK-F020 to TK-F023), as the coding pack flags an MCP call: the server parts'
# rules for them hold only the harmful forms.
extends: [coding.yaml, browser.yaml, server-data.yaml, server-net.yaml, server-cloud.yaml, server-comms.yaml,
          server-core.yaml]
version: '2026.11-dev-5'
description: dev default (the server pack's rules, unmapped tools flagged, uploads to cloud storage held, a demo deny and a demo ask)
unknown_tools: flag
# a call over 64 KiB, which the policy doesn't read, waits for a person (TK-OVERSIZE as an ask) where the server pack's
# TK-S002 would deny it unread: on a laptop a large file write is ordinary work
oversize: ask

tools:
  Agent: harness             # Claude Code: a subagent's prompt
  Task: harness              # Claude Code's earlier name for Agent, and the other harnesses' (above)
  SendMessage: harness       # Claude Code: a message to a teammate or a running subagent
  SubagentHandback: harness  # Claude Code: a subagent's report to the agent that started it
  TodoWrite: harness         # Claude Code's todo list, and the other harnesses' (above)
  ToolSearch: harness        # Claude Code: loads tools' schemas by name or by a search (`select:Read,Edit`)
  Skill: harness             # Claude Code: loads a skill's instructions by its name
  SlashCommand: harness      # Claude Code: expands a slash command's prompt (`/review`)
  Workflow: harness          # Claude Code: a script that runs its agents (each of their calls has its own hook)

deny:
  - id: TK-DEMO-DENY
    tool: '(mcp:[^/]+/)?tracekit_demo_denied'
    pattern: '^'
    reason: demo deny rule
    rationale: Shows what a signed deny looks like.

ask:
  - id: TK-A032
    class: shell
    # each command's argv: a gsutil, gcloud storage or aws s3 copy, move or sync whose destination is a bucket (gs://,
    # s3://), or an Azure blob upload. A coding agent on a laptop rarely writes to cloud storage, and it can be
    # production data; the server pack inherits from the coding pack, not this one, so server agents that publish to
    # buckets aren't held. lean: an rclone remote (name:path) can't be told from a local path cheaply, so rclone
    # uploads aren't read; upgrade: a structural argv rule. Up to eight options (with a value) before the service and
    # again before its verb; `[\w\W]*?` crosses a newline inside an argument; lazy, which halves the fallback
    # engine's rescan
    pattern: '^(?:gsutil (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:cp|mv|rsync) (?:[\w\W]*? )?gs://[^ ]*(?: -[^ ]+(?: [^- ][^ ]*)?)*$|gcloud (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:(?:alpha|beta) )?storage (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:cp|mv|rsync) (?:[\w\W]*? )?gs://[^ ]*(?: -[^ ]+(?: [^- ][^ ]*)?)*$|aws (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}s3 (?:-[^ ]+ +(?:[^- ][^ ]* +)?){0,8}(?:cp|mv|sync) (?:[\w\W]*? )?s3://[^ ]*(?: -[^ ]+(?: [^- ][^ ]*)?)*$|az storage blob (?:upload|upload-batch|sync)(?: |$))'
    reason: uploading to cloud storage
    remedy: Have a person approve the held call, or write the files locally and let a person upload them.
    rationale: A bucket can hold production data or serve the public; a person confirms what a coding agent writes there.
  - id: TK-A056
    class: shell
    field: push
    # here, not in the coding pack, as TK-A032: the server pack extends the coding pack, and a server agent's deploy
    # is often its job (E17's benign corpus has them). Each command's argv, a git push read for where it goes
    # (engine._git_push: git push, git send-pack, hub push): `PUSH:<why>` for a push to main or master (`main`,
    # `HEAD:main`, `refs/heads/master`, `heads/main`), to a branch the line can't tell (no refspec, so push.default
    # picks; HEAD, @ or origin/HEAD; an expansion or a pattern), of tags (--tags, --follow-tags, a refs/tags/ or tags/
    # refspec, `tag v1.0`) or of every branch (--all, --mirror). A force push is TK-D003's deny and a delete push
    # TK-A002's ask. A push of named branches other than main and master stays flagged (TK-F004). Any other command is
    # its argv: publishing a package (npm, pnpm, yarn or bun publish, yarn's `npm publish`, uv, poetry or cargo
    # publish, gem push, twine upload, also as any runner's `-m twine`), pushing an image or a chart (docker or podman
    # push and image push, helm push) or deploying (terraform, tofu or terragrunt apply, pulumi up, helm install or upgrade,
    # kubectl apply or delete, but not a dry run kubectl reads as one: engine._kubectl_dry_run's `DRYRUN:`), each after
    # up to eight options with a value or not; a gh or hub api call naming main's or master's ref (git/refs/heads/main,
    # ref=refs/heads/main), merging branches (repos/<o>/<r>/merges, repositories/<id>/merges) or putting or deleting a
    # file (engine._gh_api's `PUSH:contents`, `PUSH:merges` for any form of the merges path, `PUSH:merge-upstream`
    # for a fork's merge-upstream into main or master, and `PUSH:unknown` for a write whose target the line can't
    # tell), read percent-decoded as GitHub reads its path; `gh repo sync <owner/repo>` into main or master
    # (engine._gh_repo_sync's `PUSH:repo-sync`);
    # a GraphQL updateRef or updateRefs, mergeBranch or createCommitOnBranch, read as TK-A002 reads deleteRef;
    # Sapling's `sl push --to main`, `git town ship` (or git-town), and Jujutsu's `jj git push` with no arguments,
    # --all, --tracked, a main or master bookmark (exact: too) or a glob:.
    # lean: another deploy CLI (vercel, fly deploy, gh release create) is recorded, not held; a gh or hub api GET of
    # main's ref, a merge into any branch and a GraphQL mutation on any ref are held as one on main would be (the
    # method, the base and the ref id aren't read: reading /merges with base=main in either order took the fallback
    # engine seconds on 64 KiB); add a verb here when one is in use
    pattern: '^PUSH:|^(?:npm|pnpm|yarn|bun)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:npm )?publish(?: |$)|^(?:uv|poetry|cargo)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} publish(?: |$)|^gem(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} push(?: |$)|^twine(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} upload(?: |$)|^[^ ]+(?: [^ ]+){0,8}? -[A-Za-z]*m ?twine(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} upload(?: |$)|^(?:docker|podman)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:image )?push(?: |$)|^helm(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:install|upgrade|push)(?: |$)|^(?:terraform|tofu)(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} apply(?: |$)|^terragrunt(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:run-all |stack run |run (?:-[^ ]+ )*)?apply(?:-all)?(?: |$)|^pulumi(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} up(?: |$)|^kubectl(?: -[^ ]+(?: [^- ][^ ]*)?){0,8} (?:apply|delete)(?: |$)|^(?:gh|hub) api [\w\W]*?/git/refs/heads/(?:main|master)(?:[ ?#/]|$)|^(?:gh|hub) api [\w\W]*?(?: |-f|-F|=)ref=refs/heads/(?:main|master)(?: |$)|^(?:gh|hub) api [\w\W]*?\b(?:repos/[^/ ]+/[^/ ]+|repositories/[^/ ]+)/merges(?:[/?#][^ ]*)?(?: |$)|^(?:(?:gh|glab|hub) api|curl|wget|https?|xhs?) [\w\W]*?(?:updateRefs?|mergeBranch|createCommitOnBranch)\b|^sl (?:-[^ ]+(?: [^- ][^ ]*)? ){0,8}push [\w\W]*?(?:--to[ =]|-t ?)(?:remote/)?(?:main|master)(?: |$)|^(?:git (?:-[Cc] [^ ]* |--(?:git-dir|work-tree|namespace|super-prefix|config-env|attr-source) [^ ]* |--?[A-Za-z][-A-Za-z]*(?:=[^ ]*)? ){0,8}town|git-town) (?:-[^ ]+ )*ship(?: |$)|^jj (?:-[^ ]+(?: [^- ][^ ]*)? ){0,8}git push(?:$| [\w\W]*?(?:(?:(?:-b ?|--(?:bookmark|branch)[ =])[''"]?(?:exact:)?(?:main|master)[''"]?|--all|--tracked)(?: |$)|glob:))'
    reason: a push to the default branch or of tags, or a publish or deploy
    remedy: Have a person approve the held call, or push a named feature branch and leave the merge or release to a person.
    rationale: These reach a shared branch, a registry or a running system, where others build, install or deploy from them; a person confirms each one.
  - id: TK-A062
    class: unknown
    # every tool but two kinds: Claude Code's PowerShell (in any case), unmapped on purpose (the signer also reads its
    # command as a shell line, and holds it only where a deny or ask rule matches it as bash reads it:
    # signer/service.py), and a Claude Code or Gemini CLI MCP tool (mcp__…), which the signer reads as one too: the MCP
    # rules hold its command or its SQL (TK-S010, TK-S012, TK-A041). An MCP name in a case no pack maps (MCP:x/y) is
    # read here as TK-S010 reads an MCP tool: any value of a command argument holds it (`MCPCMD:`)
    tool: '(?:[^Ppm][\w\W]*|[Pp](?:[^Oo][\w\W]*|[Oo](?:[^Ww][\w\W]*|[Ww](?:[^Ee][\w\W]*|[Ee](?:[^Rr][\w\W]*|[Rr](?:[^Ss][\w\W]*|[Ss](?:[^Hh][\w\W]*|[Hh](?:[^Ee][\w\W]*|[Ee](?:[^Ll][\w\W]*|[Ll](?:[^Ll][\w\W]*|[Ll](?:[\w\W]+))?)?)?)?)?)?)?)?)?|m(?:[^c][\w\W]*|c(?:[^p][\w\W]*|p(?:[^_][\w\W]*|_(?:[^_][\w\W]*)?)?)?)?)?'
    field: run
    # what a tool no pack maps (unknown_tools flags it) is given to run (engine._runs): `CMD:<value>` for each argument
    # TK-S010 reads as a command (command, commands, cmd, cmds, script or shell_command, in any case, at any depth),
    # and each statement under a sql, query or statement argument as every SQL dialect lexes it (classes.sql_read:
    # comments and literals blanked, every blank run a space), `SQL;` before one a `;` ends and `SQL:` before the
    # last. A command line is any value but one plain word (`WORD:<its last /-part>`; letters, digits, `_ . : / -`: a
    # list or an object, a blank, a shell metacharacter or expansion makes one), and a plain word that changes the
    # machine on its own: reboot, shutdown, halt, poweroff or killall5 (every other program needs arguments to do harm). A statement is held when
    # it writes or changes the schema or access (INSERT, REPLACE or MERGE INTO; UPDATE x [alias] SET; DELETE FROM,
    # DELETE x FROM, DELETE x; DROP an object; TRUNCATE x; ALTER an object; CREATE USER or ROLE; GRANT or REVOKE on or
    # to something; COPY to or from a program or a file; a CTE; DO), or is a SELECT, CREATE, EXEC or CALL a `;` ends.
    # What the tool runs it on, and how, is its own, so no rule reads its effect; the server pack holds every
    # unmapped tool, the laptop these.
    # lean: a search in English shaped like one of these (`delete file from repo`, `truncate text`) is held too, and a
    # statement under another argument name (input, text, q) or behind a leading `(` or EXPLAIN is flagged, not held,
    # as is a bare SELECT; name such a tool in a policy of your own (`tools:` sql) if it runs SQL
    pattern: '^MCPCMD:|^CMD:|^WORD:(?:[Rr][Ee][Bb][Oo][Oo][Tt]|[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|[Hh][Aa][Ll][Tt]|[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|[Kk][Ii][Ll][Ll][Aa][Ll][Ll]5)$|^SQL[:;](?:[Ii][Nn][Ss][Ee][Rr][Tt]|[Rr][Ee][Pp][Ll][Aa][Cc][Ee])(?: (?:[Ii][Gg][Nn][Oo][Rr][Ee]|[Ll][Oo][Ww]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|[Dd][Ee][Ll][Aa][Yy][Ee][Dd]|[Hh][Ii][Gg][Hh]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy])| [Oo][Rr] [A-Za-z]+)* [Ii][Nn][Tt][Oo]\b|^SQL[:;][Mm][Ee][Rr][Gg][Ee] [Ii][Nn][Tt][Oo]\b|^SQL[:;][Uu][Pp][Dd][Aa][Tt][Ee](?: (?:[Oo][Nn][Ll][Yy]|[Ll][Oo][Ww]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|[Ii][Gg][Nn][Oo][Rr][Ee])| [Oo][Rr] [A-Za-z]+)* [^ ,;]+(?: (?:[Aa][Ss] )?[^ ,;]+)? [Ss][Ee][Tt]\b|^SQL[:;][Dd][Ee][Ll][Ee][Tt][Ee](?: (?:[Ll][Oo][Ww]_[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy]|[Qq][Uu][Ii][Cc][Kk]|[Ii][Gg][Nn][Oo][Rr][Ee]))* (?:[Ff][Rr][Oo][Mm]\b|[^ ,;]+(?: ?, ?[^ ,;]+)* [Ff][Rr][Oo][Mm]\b|[^ ,;]+(?: [Ww][Hh][Ee][Rr][Ee]\b|$))|^SQL[:;][Dd][Rr][Oo][Pp] (?:[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] )?(?:[Tt][Aa][Bb][Ll][Ee]|[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]|[Ss][Cc][Hh][Ee][Mm][Aa]|[Ii][Nn][Dd][Ee][Xx]|[Vv][Ii][Ee][Ww]|[Uu][Ss][Ee][Rr]|[Rr][Oo][Ll][Ee]|[Oo][Ww][Nn][Ee][Dd]|[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Cc][Ee][Dd][Uu][Rr][Ee]|[Tt][Rr][Ii][Gg][Gg][Ee][Rr]|[Ss][Ee][Qq][Uu][Ee][Nn][Cc][Ee]|[Tt][Yy][Pp][Ee]|[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn]|[Mm][Aa][Tt][Ee][Rr][Ii][Aa][Ll][Ii][Zz][Ee][Dd]|[Tt][Aa][Bb][Ll][Ee][Ss][Pp][Aa][Cc][Ee]|[Pp][Oo][Ll][Ii][Cc][Yy]|[Ee][Vv][Ee][Nn][Tt]|[Ll][Oo][Gg][Ii][Nn]|[Ii][Ff])\b|^SQL[:;][Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee] (?:[Tt][Aa][Bb][Ll][Ee] )?(?:[Oo][Nn][Ll][Yy] )?[^ ,;]+|^SQL[:;][Aa][Ll][Tt][Ee][Rr] (?:[Tt][Aa][Bb][Ll][Ee]|[Uu][Ss][Ee][Rr]|[Rr][Oo][Ll][Ee]|[Ll][Oo][Gg][Ii][Nn]|[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee]|[Ss][Cc][Hh][Ee][Mm][Aa]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Dd][Ee][Ff][Aa][Uu][Ll][Tt]|[Ii][Nn][Dd][Ee][Xx]|[Vv][Ii][Ee][Ww]|[Ss][Ee][Qq][Uu][Ee][Nn][Cc][Ee]|[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Cc][Ee][Dd][Uu][Rr][Ee]|[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn]|[Pp][Oo][Ll][Ii][Cc][Yy]|[Tt][Yy][Pp][Ee]|[Ss][Ee][Rr][Vv][Ee][Rr]|[Tt][Aa][Bb][Ll][Ee][Ss][Pp][Aa][Cc][Ee])\b|^SQL[:;][Cc][Rr][Ee][Aa][Tt][Ee] (?:[Oo][Rr] [Rr][Ee][Pp][Ll][Aa][Cc][Ee] )?(?:[Uu][Ss][Ee][Rr]|[Rr][Oo][Ll][Ee]|[Ll][Oo][Gg][Ii][Nn])\b|^SQL[:;][Gg][Rr][Aa][Nn][Tt] (?:[^ ]+ ){0,16}?[Oo][Nn]\b|^SQL[:;][Gg][Rr][Aa][Nn][Tt] [^ ,;]+(?: ?, ?[^ ,;]+)* [Tt][Oo]\b|^SQL[:;][Rr][Ee][Vv][Oo][Kk][Ee] (?:[^ ]+ ){0,16}?[Oo][Nn]\b|^SQL[:;][Rr][Ee][Vv][Oo][Kk][Ee] [^ ,;]+(?: ?, ?[^ ,;]+)* [Ff][Rr][Oo][Mm]\b|^SQL[:;][Cc][Oo][Pp][Yy] (?:[^ ]+ ){0,64}?(?:[Tt][Oo]|[Ff][Rr][Oo][Mm]) (?:[Pp][Rr][Oo][Gg][Rr][Aa][Mm]\b|'''')|^SQL[:;][Ww][Ii][Tt][Hh] (?:[Rr][Ee][Cc][Uu][Rr][Ss][Ii][Vv][Ee] )?[^ ,;]+(?: ?\([^)]*\))? [Aa][Ss] ?\(|^SQL[:;][Dd][Oo] (?:[Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee] [^ ]+ )?''''|^SQL;(?:[Ss][Ee][Ll][Ee][Cc][Tt]|[Cc][Rr][Ee][Aa][Tt][Ee]|[Ee][Xx][Ee][Cc]|[Ee][Xx][Ee][Cc][Uu][Tt][Ee]|[Cc][Aa][Ll][Ll])\b'
    reason: an unmapped tool given a command or a SQL statement to run
    remedy: Have a person approve the held call, or map the tool in a policy of your own (`tools:`), to `shell` or `sql` so the rules read what it runs, or to `app` if it runs nothing.
    rationale: Tracekit can't read what an unmapped tool does with a command or a query, and the server pack holds every unmapped tool; a person confirms these.
  - id: TK-F019
    class: harness
    tool: 'Agent|Task'
    # a subagent that runs remotely: this signer decides none of its calls, so the prompt is the last thing it reads
    pattern: '"isolation":"remote"'
    reason: a subagent that runs where Tracekit doesn't decide its calls
    remedy: Have a person approve the held call, or run the subagent locally, where each of its calls is decided.
    rationale: A remote subagent's tool calls aren't decided or recorded here; a person confirms what it is sent to do.
  - id: TK-DEMO-ASK
    tool: '(mcp:[^/]+/)?tracekit_demo_ask'
    pattern: '^'
    reason: demo ask rule
    rationale: Shows a call held for a person's approval.

flag:
  - id: TK-F018
    class: harness
    tool: SendMessage
    # a message to another agent: a teammate or a running subagent may run elsewhere, so the message is kept on the
    # record as one that can leave the machine
    pattern: '^'
    label: agent_message
  - id: TK-F020
    class: email
    # every email tool's call: outbound mail, kept on the record (TK-M003 holds a mass email, TK-P001 a recipient that
    # came only from untrusted content)
    pattern: '^'
    label: outbound_email
  - id: TK-F021
    class: payment
    # every payment tool's call, kept on the record (TK-M001, TK-M002 and TK-M005 hold money moved)
    pattern: '^'
    label: payment
  - id: TK-F022
    class: sql
    # every database query, kept on the record as an MCP call is (TK-F006): the server-data rules read a query's
    # SQL, and a postgres or sqlite MCP tool is class sql, not mcp, once they do
    pattern: '^'
    label: database_query
  - id: TK-F023
    class: browser
    # every Browser Use action, kept on the record as a browser MCP tool's call is (TK-F006)
    pattern: '^'
    label: browser_action
