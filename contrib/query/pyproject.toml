[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit-query"
version = "0.1.0"
description = "Read-only SQL (and an MCP server) over a Tracekit ledger"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["tracekit-ai"]

[project.scripts]
tracekit-sql = "tracekit_query:main"

[tool.setuptools]
py-modules = ["tracekit_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
