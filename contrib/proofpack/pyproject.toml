[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit-proofpack"
version = "0.1.0"
description = "Tracekit proof packs: a .tkb bundle, a readable report and a control map in one zip (no bundled verifier)"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["tracekit-ai"]

[project.scripts]
tracekit-proofpack = "tracekit_proofpack:main"
tracekit-report = "tracekit_proofpack:report_main"

[tool.setuptools]
py-modules = ["tracekit_proofpack"]
